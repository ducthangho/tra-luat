name: Work Packet
description: Mo mot Work Packet Issue theo docs/PROTOCOL_DA_PHIEN.md §3.2
title: "[WP] "
labels:
  - coord:packet
  - state:proposed
body:
  - type: markdown
    attributes:
      value: |
        Nguon normative cua khoi duoi day la `docs/PROTOCOL_DA_PHIEN.md` §3.2. Form nay chi thu thap
        TRUONG; quy tac (spec dong bang bang `spec_hash` khi vao `ready`, doi objective/acceptance/write
        set/dependency/executor/environment thi phai co revision moi, agent khong tu mo write set) o lai
        trong protocol.

        §3.2 con liet ke mot khoi THU HAI - `change_policy_sha`, `effective_write_set`, `required_checks`,
        `land_obligations`. Do la truong PHAI SINH do dispatcher bo sung; nguoi dung va agent KHONG duoc tu
        khai, nen chung co y KHONG co mat trong form nay.
  - type: textarea
    id: spec
    attributes:
      label: Packet spec (khoi YAML §3.2)
      description: Giu nguyen tap truong. Thay gia tri placeholder, dung xoa khoa.
      render: yaml
      value: |
        schema_version: 1
        packet_id: wp<issue>
        mission_issue: <number>
        revision: 1
        spec_hash: <sha256>
        objective: <mot ket qua tu du>
        write_set:
          - type: exact | prefix
            path: <repo-relative-path>
        depends_on: []
        executor: claude | codex
        environment: cloud | local
        risk: normal | sensitive
        acceptance_criteria: []
    validations:
      required: true
  - type: textarea
    id: nguon-quyet-dinh
    attributes:
      label: Nguon quyet dinh
      description: Link ben toi Mission revision, MCR hoac dong roadmap lam can cu cho packet nay.
    validations:
      required: false
