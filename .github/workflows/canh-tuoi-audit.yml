name: canh-tuoi-audit
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: canh-tuoi-audit
  cancel-in-progress: false
jobs:
  canh-tuoi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet PyYAML==6.0.3 jsonschema==4.26.0
      - run: python ops/canh_tuoi_audit.py
        env:
          GH_TOKEN: ${{ github.token }}
          B2_RUN_ID: ${{ github.run_id }}
          B2_RUN_ATTEMPT: ${{ github.run_attempt }}
