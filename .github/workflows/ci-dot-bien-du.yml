name: đột biến đủ (hằng tuần)

# #651 (CI-REGISTRY-THU-HEP-VUNG r1) M4 — bù phần chốt nới của #651 (`ci_dang_ky_test.py`, `.github/**` trừ `ci.yml` không còn
# ép đủ). Cùng lệnh registry, KHÔNG biến diff ⇒ `doc_diff` "không đo được" ⇒ `ke_hoach` fail-closed về ĐỦ cho mọi bộ.
# Chốt `loi_workflow_dot_bien_du` (`.claude/dev/ci_dang_ky_test.py`): mọi giá trị hoặc GHIM, hoặc BẰNG `gate-registry` của
# `ci.yml` (trích từ chính hai tệp) trừ `env` bước registry. Sửa `gate-registry` mà quên tệp này ⇒ registry ĐỎ trên PR.
# Chỉ ubuntu: Windows vốn bỏ đột biến của `pretooluse_guard_test`.
# #661: đột biến ĐỦ của `ops/nhanh_don_duoc_test.py` chia job mảnh + job gom; registry chạy bộ ấy NHẸ (M4/M5 ở W2).
# WP748 r16: đây là `full_mutant_audit` — 52 ca dưới MỖI 239 tự đột biến + 10 đột biến sản phẩm, KHÔNG thu hẹp ma trận.
# Bắt buộc trên ĐÚNG SHA ứng viên (workflow_dispatch trên ref ấy) trước merge/land/release; biên nhận targeted của
# `ci.yml` KHÔNG thay được. Ước tính g12: ~73 800 s nối tiếp ⇒ 8 mảnh ≈ 2,6 h/mảnh ⇒ trần 360 phút (trần job GitHub).
# wp1166 (PR0): mọi checkout GHIM biểu thức SHA sự kiện (không tên nhánh) rồi ĐO lại HEAD; artifact mảnh mang run_id +
# run_attempt (tên riêng từng attempt). Job gom tải MỌI artifact mảnh của ĐÚNG run_id (mọi attempt) vào thư mục RIÊNG
# từng artifact (không merge-multiple ⇒ không ghi đè nhau), rồi với MỖI mảnh chọn đúng MỘT bên sản xuất hợp lệ (`head` =
# SHA sự kiện, rc 0, mọi mục passed; attempt cao nhất, in attempt đã dùng) ⇒ chạy lại riêng job gom / riêng một mảnh hỏng
# vẫn gom được. Group concurrency theo run_id + không huỷ ⇒ hai lượt audit không thay chỗ nhau.
# Chốt: `loi_ghim_sha_du` / `chon_bien_nhan_du` / `loi_bien_nhan_du`.

on:
  schedule:
    - cron: "17 19 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dot-bien-du-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dot-bien-du:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Force LF checkout (hash parity với manifest)
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          # r226 — vì sao ghim `core.abbrev 7`: xem chú thích cùng bước ở job `gate`.
          git config --global core.abbrev 7
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: checkout phải đúng SHA sự kiện (wp1166)
        run: |
          h="$(git rev-parse HEAD)"
          echo "CHECKOUT_SHA=$h EVENT_SHA=${{ github.sha }} RUN=${{ github.run_id }}/${{ github.run_attempt }}"
          test "$h" = "${{ github.sha }}"
      - name: dấu job (wp1460)
        env: {KHOA_JOB: "dot-bien-du", RUN_ID: "${{ github.run_id }}", RUN_ATTEMPT: "${{ github.run_attempt }}", SU_KIEN_SHA: "${{ github.sha }}"}
        run: python3 -c 'import json, os, subprocess; e = os.environ; g = lambda r:subprocess.check_output(["git", "rev-parse", r], text=True).strip(); json.dump({"schema":"dau_job.v1", "khoa_job":e["KHOA_JOB"], "run_id":int(e["RUN_ID"]), "run_attempt":int(e["RUN_ATTEMPT"]), "su_kien_sha":e["SU_KIEN_SHA"], "checkout_sha":g("HEAD"), "checkout_tree":g("HEAD^{tree}")}, open("dau-job.json", "w", encoding="utf-8"))'
      - uses: actions/upload-artifact@v4
        with:
          name: dau-job-${{ github.run_id }}-${{ github.run_attempt }}-dot-bien-du
          path: dau-job.json
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cài PyYAML + jsonschema (cổng đăng lease + validator verdict cần)
        run: python -m pip install --quiet PyYAML==6.0.3 jsonschema==4.26.0
      - name: cài actionlint cho G5
        shell: bash
        env:
          AL_VER: 1.7.7
        run: bash ops/cai_actionlint.sh
      - name: cài shellcheck cho G5 (cài xong đo lại)
        shell: bash
        run: bash ops/cai_cong_cu.sh shellcheck
      - name: cài rg cho G5 (cài xong đo lại)
        shell: bash
        run: bash ops/cai_cong_cu.sh rg
      - name: G5 probe ban ke cong cu (#290; selftest T1..T8 chi o job gate, chot M6 #637)
        shell: bash
        run: python ops/cong_cu.py kiem-tra --json
      - name: cài Ruff 0.15.15 và in probe dương
        run: |
          python -m pip install --quiet ruff==0.15.15
          ruff --version
      # KHÔNG có CI_DANG_KY_SU_KIEN/GOC/DAU: vắng biến diff ⇒ kế hoạch ĐỦ cho mọi bộ (fail-closed #643).
      - name: test registry (phạm vi + các bộ chưa được nối)
        env:
          CI_DANG_KY_WORKERS: "2"
          CI_DANG_KY_DOT_BIEN_MANH: ops/nhanh_don_duoc_test.py
        run: python .claude/dev/ci_dang_ky_test.py --chay

  dot-bien-manh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        manh: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: checkout phải đúng SHA sự kiện (wp1166)
        run: |
          h="$(git rev-parse HEAD)"
          echo "CHECKOUT_SHA=$h EVENT_SHA=${{ github.sha }} RUN=${{ github.run_id }}/${{ github.run_attempt }}"
          test "$h" = "${{ github.sha }}"
      - name: dấu job (wp1460)
        env: {KHOA_JOB: "dot-bien-manh-${{ matrix.manh }}", RUN_ID: "${{ github.run_id }}", RUN_ATTEMPT: "${{ github.run_attempt }}", SU_KIEN_SHA: "${{ github.sha }}"}
        run: python3 -c 'import json, os, subprocess; e = os.environ; g = lambda r:subprocess.check_output(["git", "rev-parse", r], text=True).strip(); json.dump({"schema":"dau_job.v1", "khoa_job":e["KHOA_JOB"], "run_id":int(e["RUN_ID"]), "run_attempt":int(e["RUN_ATTEMPT"]), "su_kien_sha":e["SU_KIEN_SHA"], "checkout_sha":g("HEAD"), "checkout_tree":g("HEAD^{tree}")}, open("dau-job.json", "w", encoding="utf-8"))'
      - uses: actions/upload-artifact@v4
        with:
          name: dau-job-${{ github.run_id }}-${{ github.run_attempt }}-dot-bien-manh-${{ matrix.manh }}
          path: dau-job.json
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: đột biến một mảnh
        env:
          NHANH_DON_DUOC_DICH: ${{ matrix.manh }}/8
          NHANH_DON_DUOC_DICH_RA: manh/manh-${{ matrix.manh }}.json
          NHANH_DON_DUOC_DICH_DU: "1"
        run: python ops/nhanh_don_duoc_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: dot-bien-manh-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.manh }}
          path: manh/manh-${{ matrix.manh }}.json
          if-no-files-found: error

  dot-bien-gop:
    needs: dot-bien-manh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: checkout phải đúng SHA sự kiện (wp1166)
        run: |
          h="$(git rev-parse HEAD)"
          echo "CHECKOUT_SHA=$h EVENT_SHA=${{ github.sha }} RUN=${{ github.run_id }}/${{ github.run_attempt }}"
          test "$h" = "${{ github.sha }}"
      - name: dấu job (wp1460)
        env: {KHOA_JOB: "dot-bien-gop", RUN_ID: "${{ github.run_id }}", RUN_ATTEMPT: "${{ github.run_attempt }}", SU_KIEN_SHA: "${{ github.sha }}"}
        run: python3 -c 'import json, os, subprocess; e = os.environ; g = lambda r:subprocess.check_output(["git", "rev-parse", r], text=True).strip(); json.dump({"schema":"dau_job.v1", "khoa_job":e["KHOA_JOB"], "run_id":int(e["RUN_ID"]), "run_attempt":int(e["RUN_ATTEMPT"]), "su_kien_sha":e["SU_KIEN_SHA"], "checkout_sha":g("HEAD"), "checkout_tree":g("HEAD^{tree}")}, open("dau-job.json", "w", encoding="utf-8"))'
      - uses: actions/upload-artifact@v4
        with:
          name: dau-job-${{ github.run_id }}-${{ github.run_attempt }}-dot-bien-gop
          path: dau-job.json
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cài PyYAML + jsonschema (cổng đăng lease + validator verdict cần)
        run: python -m pip install --quiet PyYAML==6.0.3 jsonschema==4.26.0
      - uses: actions/download-artifact@v4
        with:
          pattern: dot-bien-manh-${{ github.run_id }}-*
          path: manh-tho
      - name: biên nhận mảnh phải đủ, đúng SHA sự kiện, job mảnh success (wp1166)
        run: python .claude/dev/ci_dang_ky_test.py --kiem-bien-nhan-du manh-tho --chon-ra manh --run-id "${{ github.run_id }}" --sha-su-kien "${{ github.sha }}" --ket-qua-manh "${{ needs.dot-bien-manh.result }}"
      - name: gom mảnh
        run: python ops/nhanh_don_duoc_test.py --gop-du manh

  # wp1460 (B1a): job thu ghi MỘT biên nhận `bien_nhan_audit.v1` cho lượt; ĐỎ khi không chứng minh đủ X1–X8 (K7 bắt job này).
  bien-nhan-audit:
    needs: [dot-bien-du, dot-bien-manh, dot-bien-gop]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: checkout phải đúng SHA sự kiện (wp1166)
        run: |
          h="$(git rev-parse HEAD)"
          echo "CHECKOUT_SHA=$h EVENT_SHA=${{ github.sha }} RUN=${{ github.run_id }}/${{ github.run_attempt }}"
          test "$h" = "${{ github.sha }}"
      - name: dấu job (wp1460)
        env: {KHOA_JOB: "bien-nhan-audit", RUN_ID: "${{ github.run_id }}", RUN_ATTEMPT: "${{ github.run_attempt }}", SU_KIEN_SHA: "${{ github.sha }}"}
        run: python3 -c 'import json, os, subprocess; e = os.environ; g = lambda r:subprocess.check_output(["git", "rev-parse", r], text=True).strip(); json.dump({"schema":"dau_job.v1", "khoa_job":e["KHOA_JOB"], "run_id":int(e["RUN_ID"]), "run_attempt":int(e["RUN_ATTEMPT"]), "su_kien_sha":e["SU_KIEN_SHA"], "checkout_sha":g("HEAD"), "checkout_tree":g("HEAD^{tree}")}, open("dau-job.json", "w", encoding="utf-8"))'
      - uses: actions/upload-artifact@v4
        with:
          name: dau-job-${{ github.run_id }}-${{ github.run_attempt }}-bien-nhan-audit
          path: dau-job.json
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cài PyYAML + jsonschema (cổng đăng lease + validator verdict cần)
        run: python -m pip install --quiet PyYAML==6.0.3 jsonschema==4.26.0
      - uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: dot-bien-manh-${{ github.run_id }}-*
          path: manh-tho
      - uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: dau-job-${{ github.run_id }}-*
          path: dau-tho
      - name: REST của lượt (wp1460; mỗi điểm ghi .json hoặc .loi, không dừng giữa chừng)
        if: always()
        env: {GH_TOKEN: "${{ github.token }}", KHO: "${{ github.repository }}", RUN_ID: "${{ github.run_id }}", WF_SHA: "${{ github.workflow_sha }}"}
        run: |
          mkdir -p rest
          lay() { ten="$1"; shift; if gh api "$@" > "rest/$ten.json" 2> "rest/$ten.loi"; then rm -f "rest/$ten.loi"; else rm -f "rest/$ten.json"; fi; }
          lay run "repos/$KHO/actions/runs/$RUN_ID"
          lay jobs --paginate --slurp "repos/$KHO/actions/runs/$RUN_ID/jobs?filter=all&per_page=100"
          lay artifacts --paginate --slurp "repos/$KHO/actions/runs/$RUN_ID/artifacts?per_page=100"
          if [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]]; then lay definition "repos/$KHO/contents/.github/workflows/ci-dot-bien-du.yml?ref=$WF_SHA"; fi
          exit 0
      - name: thu biên nhận audit (wp1460)
        if: always()
        env: {KHO: "${{ github.repository }}", KHO_ID: "${{ github.repository_id }}", WORKFLOW_REF: "${{ github.workflow_ref }}", WORKFLOW_SHA: "${{ github.workflow_sha }}", SU_KIEN: "${{ github.event_name }}", REF: "${{ github.ref }}", CRON: "${{ github.event.schedule }}", SHA_SU_KIEN: "${{ github.sha }}", RUN_ID: "${{ github.run_id }}", RUN_ATTEMPT: "${{ github.run_attempt }}"}
        run: python .claude/dev/ci_dang_ky_test.py --thu-bien-nhan-audit bien_nhan_audit.json --rest rest --manh-tho manh-tho --dau-tho dau-tho --kho "$KHO" --kho-id "$KHO_ID" --workflow-ref "$WORKFLOW_REF" --workflow-sha "$WORKFLOW_SHA" --su-kien "$SU_KIEN" --ref "$REF" --cron "$CRON" --sha-su-kien "$SHA_SU_KIEN" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bien-nhan-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: bien_nhan_audit.json
          if-no-files-found: error
