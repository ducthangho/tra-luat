name: đột biến đủ (hằng tuần)

# #651 (CI-REGISTRY-THU-HEP-VUNG r1) M4. Lượt `gate-registry` của `ci.yml` bỏ vòng đột biến của bộ trong `NHE`
# khi diff không chạm vùng (#643/#647/#651), và #651 thu hẹp vùng: `ci_dang_ky_test.py` cùng `.github/**` (trừ
# `ci.yml`) không còn ép đủ. Workflow này bù phần nới ấy: chạy CÙNG lệnh registry mà KHÔNG truyền biến diff, nên
# `doc_diff` trả "không đo được" và `ke_hoach` fail-closed về ĐỦ cho mọi bộ.
#
# Chốt ở `.claude/dev/ci_dang_ky_test.py` (`loi_workflow_dot_bien_du`), trích TỪ CHÍNH hai tệp YAML: `on` đúng
# `schedule` + `workflow_dispatch`; `permissions` chỉ đọc; cron ghim; không khoá cấp workflow khác; một job; env job,
# `timeout-minutes` và MỌI bước bằng `gate-registry` của `ci.yml`, trừ `env` bước registry = chỉ `CI_DANG_KY_WORKERS`.
# Sửa `gate-registry` mà quên tệp này ⇒ registry ĐỎ ngay trên PR — không có bản sao thứ hai để trôi.
#
# Chỉ ubuntu: lượt đủ này đo VÒNG ĐỘT BIẾN; Windows vốn bỏ đột biến của `pretooluse_guard_test`.

on:
  schedule:
    - cron: "17 19 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dot-bien-du:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Force LF checkout (hash parity với manifest)
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          # r226 — vì sao ghim `core.abbrev 7`: xem chú thích cùng bước ở job `gate`.
          git config --global core.abbrev 7
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cài PyYAML + jsonschema (cổng đăng lease + validator verdict cần)
        run: python -m pip install --quiet PyYAML==6.0.3 jsonschema==4.26.0
      - name: cài actionlint cho G5
        shell: bash
        env:
          AL_VER: 1.7.7
        run: bash ops/cai_actionlint.sh
      - name: cài shellcheck cho G5 (cài xong đo lại)
        shell: bash
        run: bash ops/cai_cong_cu.sh shellcheck
      - name: cài rg cho G5 (cài xong đo lại)
        shell: bash
        run: bash ops/cai_cong_cu.sh rg
      - name: G5 probe ban ke cong cu (#290; selftest T1..T8 chi o job gate, chot M6 #637)
        shell: bash
        run: python ops/cong_cu.py kiem-tra --json
      - name: cài Ruff 0.15.15 và in probe dương
        run: |
          python -m pip install --quiet ruff==0.15.15
          ruff --version
      # KHÔNG có CI_DANG_KY_SU_KIEN/GOC/DAU: vắng biến diff ⇒ kế hoạch ĐỦ cho mọi bộ (fail-closed #643).
      - name: test registry (phạm vi + các bộ chưa được nối)
        env:
          CI_DANG_KY_WORKERS: "2"
        run: python .claude/dev/ci_dang_ky_test.py --chay
