name: WP1166 Windows source validation probe
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: full-mutant-audit-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  windows-probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 783d7081df4eddefad39c9e2d607cb7e330d28be
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install PyYAML==6.0.3
    - shell: bash
      run: "python - <<'PYCODE'\nimport copy, json, os, runpy, subprocess\nfrom pathlib\
        \ import Path\nimport yaml\nm = runpy.run_path('.claude/dev/ci_dang_ky_test.py')\n\
        w = yaml.safe_load(Path('.github/workflows/ci-dot-bien-du.yml').read_text(encoding='utf-8'))\n\
        ci = yaml.safe_load(Path('.github/workflows/ci.yml').read_text(encoding='utf-8'))\n\
        check = m['loi_workflow_dot_bien_du']\nassert not check(w, ci), check(w, ci)\n\
        for job in w['jobs']:\n    bad = copy.deepcopy(w)\n    next(s for s in bad['jobs'][job]['steps']\
        \ if s.get('uses') == 'actions/checkout@v4')['with']['ref'] = '${{ github.ref\
        \ }}'\n    assert check(bad, ci), job\nbad = copy.deepcopy(w)\nbad['concurrency']['cancel-in-progress']\
        \ = True\nassert check(bad, ci)\nactual = subprocess.check_output(['git',\
        \ 'rev-parse', 'HEAD'], text=True).strip()\nassert actual == '783d7081df4eddefad39c9e2d607cb7e330d28be'\n\
        print(json.dumps(dict(sha=actual, platform=os.name, positive=1, negative=4)))\n\
        PYCODE\n"
