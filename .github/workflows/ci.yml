name: gate

# CI 2 nền tảng (quyết định grilling 2026-07-09 #8): Cowork/Chat chạy Linux trong khi dev trên Windows —
# lớp bug nền-tảng (cp1258 decode, path, symlink) từng lọt vì gate chỉ chạy 1 nền. Toàn bộ job OFFLINE,
# không cần secret nào.
#
# LƯU Ý line-ending: RELEASE_MANIFEST.json hash byte THẬT của file — repo chuẩn LF. Phải tắt autocrlf
# TRƯỚC checkout, nếu không runner Windows checkout CRLF → hash lệch → release-verify fail oan.

on:
  push:
    branches: [master]
  pull_request:
  # r226 — CHỖ HỞ ĐÃ TRẢ GIÁ 9 RUN: hai cò trên chỉ bắn ở master và ở PR, nên nhánh làm việc KHÔNG bao
  # giờ được gate soi. Đợt r225 nối 3 guard vào CI mà nhánh không chạy được ⇒ tưởng đã đóng nhưng chưa
  # từng chạy lần nào. `workflow_dispatch` cho phép soi gate theo yêu cầu trên BẤT KỲ ref nào, không
  # phải mở PR mới biết. (GitHub đòi workflow có mặt ở nhánh mặc định thì nút này mới dùng được ⇒ chỉ
  # hiệu lực SAU khi bản này lên master.)
  workflow_dispatch:

# r245 — CẮT PHÚT ACTIONS. Đo ngày 13-08: gate chạy 6,6 phút tường, nhân hệ số
# Windows x2 thành ~20 phút TÍNH TIỀN mỗi lượt, x13,6 lượt/ngày = ~8.100 phút/tháng.
# Hạn mức Free là 2.000 ⇒ cạn khoảng ngày 11 hằng tháng, và ĐÃ cạn thật: 12-08 16:21
# còn chạy tốt, 12-08 19:30 trở đi mọi job chết ở giây thứ 2 với runner_id=0 (không
# nhận được runner, không có bước nào, không log). CI của kho đứng hình từ đó.
#
# Hai chốt dưới đây KHÔNG hạ tiêu chuẩn gate, chỉ bỏ phần lặp vô ích:
concurrency:
  # Agent đẩy nhiều lần lên cùng một PR; lượt cũ thành vô nghĩa ngay khi có lượt mới.
  # KHÔNG huỷ trên master: đó là lượt gác cổng phát hành, phải chạy trọn.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        # Windows tốn GẤP ĐÔI phút. Chạy nó ở nơi thật sự cần: trước khi vào master,
        # khi gọi tay, hoặc khi PR được gắn nhãn `windows` (dùng cho PR đụng đường
        # phụ thuộc nền). PR thường vẫn được Linux soi mỗi lần đẩy.
        # KHÔNG phải nới gate: master vẫn luôn qua CẢ HAI nền trước khi phát hành.
        os: ${{ fromJSON(
              (github.event_name == 'workflow_dispatch'
               || github.ref == 'refs/heads/master'
               || contains(github.event.pull_request.labels.*.name, 'windows'))
              && '["ubuntu-latest","windows-latest"]'
              || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Force LF checkout (hash parity với manifest)
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          # r226 — NGƯỠNG L2 CỦA doc-claims-check PHẢI TẤT ĐỊNH. `sha_lens` lấy từ `git rev-parse --short`,
          # mà git tự nới độ dài viết tắt theo SỐ OBJECT của kho. ĐO trên chính kho này: clone `--depth 1`
          # → 7 · clone đủ lịch sử (281 commit, 17.783 object) → 8. Mà 8 đúng bằng độ dài tiền tố UUID
          # notebook (743ed200, 45739ff7, dbe706a0…) ⇒ ngưỡng trôi lên 8 thì 18 tiền tố UUID bị hô
          # SHA_NOT_A_COMMIT và ca r218_docclaims_l2_sha_khong_ton_tai (mồi `deadbee`, 7 ký tự) cũng đỏ
          # theo. Ghim 7 = giữ ĐÚNG ngưỡng mọi phép đo của r218 dựa vào, KHÔNG phải nới lỏng guard.
          git config --global core.abbrev 7
      - uses: actions/checkout@v4
        with:
          # r226 — `fetch-depth` mặc định (1) làm L2 MÙ: `cat-file -e` trượt với mọi SHA cũ nên trích dẫn
          # ĐÚNG bị hô sai (đo: `ad413e7`/`78d6bfe` — cả hai là commit thật 09-07 và 07-07 — bị gắn cờ
          # SHA_NOT_A_COMMIT trên clone `--depth 1`). Guard chỉ kết luận được khi có lịch sử để tra.
          fetch-depth: 0
      # Kiểm CHÍNH head của PR, không dùng GITHUB_SHA vì trên pull_request đó là synthetic merge.
      # `cat-file` và `merge-base` đều không có nhánh bỏ qua: thiếu object/fetch/lỗi git phải đỏ.
      - name: PR head contains required EOL base
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EOL_BASE_SHA: 1880346d2be3c0be9a93de7624ee108d99b6c88c
        run: |
          set -eu
          test -n "$PR_HEAD_SHA"
          git cat-file -e "${PR_HEAD_SHA}^{commit}"
          git cat-file -e "${EOL_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$EOL_BASE_SHA" "$PR_HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: py_compile
        run: python -m py_compile scripts/tl.py scripts/tl_boot.py scripts/gen_instructions.py scripts/tl_core/__init__.py scripts/tl_core/deterministic.py scripts/tl_core/jsonio.py scripts/tl_core/workflow.py scripts/tl_core/release.py scripts/tl_core/live.py scripts/tl_core/zip_ingest.py scripts/tl_core/ocr.py scripts/tl_core/chunking.py scripts/tl_core/command_registry.py
      # F2-A (ADR-0018): validator EOL dùng CHUNG với `.githooks/pre-commit`. Hook chỉ phủ máy
      # dev đã bật `core.hooksPath`; CI là đường TỰ ĐỘNG, và guard không nối vào đường tự động
      # thì guard chỉ là tài liệu (bài học r225). Chạy trên CẢ ubuntu lẫn windows vì cả lớp hỏng
      # này là lớp hỏng theo NỀN TẢNG.
      - name: eol-policy selftest
        run: python .githooks/eol_policy_test.py
      - name: pre-push selftest
        run: python .githooks/pre_push_test.py
      # CỔNG ĐĂNG LEASE — cùng doctrine với hai bước ngay trên: guard không nối vào
      # đường TỰ ĐỘNG thì guard chỉ là tài liệu (bài học r225).
      #
      # ĐÃ TRẢ GIÁ, 16-08-2026, và đây là ca thật chứ không phải giả định. PR #132
      # thêm năm tệp `ops/reviews/*-verdict.md` mà KHÔNG thêm chúng vào bảng mục lục
      # của `ops/reviews/README.md`. `t27` sinh ra để chặn đúng chuyện đó và nó ĐỎ
      # ngay: `29/30`. Nhưng bộ này chỉ chạy ở `ops-publish-lease.yml`, mà workflow
      # ấy CHỈ bắn trên nhánh `ops/**` — nên master đỏ ở một chốt mà cổng master
      # KHÔNG đo. `ci.yml` xanh, PR merge trơn, và trạng thái đỏ nằm im cho tới khi
      # một phiên khác tình cờ chạy tay mới lộ.
      #
      # Cùng họ với "cổng không nói dối, nó VẮNG MẶT": người merge đã kiểm cổng và
      # kiểm đúng cái cổng có mặt — chỉ là cái cổng cần thì không ở đó.
      #
      # Vì sao đặt Ở ĐÂY chứ không để `ops-publish-lease.yml` lo: workflow ấy trả lời
      # câu "lease này đăng được không", còn câu cần trả lời trước mỗi lần vào master
      # là "cây này còn hợp lệ không". Hai câu khác nhau, và chỉ câu thứ hai mới chặn
      # được một PR không đụng `ops/leases/**`.
      #
      # Chạy trên CẢ hai nền: bộ này gọi lệnh qua `sys.executable` nên thuần Python;
      # `t19` (symlink) tự bỏ qua khi nền không cho tạo symlink. Đo 16-08: 3,4 giây,
      # không đáng kể so với trần 25 phút của job.
      # GHIM EXACT, không để spec trần. Cross-review PR "#134" (codex) nêu
      # `unpinned-pyyaml-ci-dependency`: spec trần làm CÙNG MỘT SHA có thể xanh hôm nay
      # và đỏ sau này mà cây không đổi — cùng lớp với tiền lệ `pypdf>=4.0` không có trần.
      # Chọn exact chứ không phải `>=6.0,<7` vì job này đã ghim `python-version: "3.12"`
      # ngay trên: ghim một nửa thì tính tất định cũng chỉ được một nửa.
      # Nâng bản là việc CÓ CHỦ ĐÍCH — đổi số ở đây, đừng để PyPI đổi hộ.
      - name: cài PyYAML (bộ cổng đăng lease cần)
        run: python -m pip install --quiet PyYAML==6.0.3
      # `actionlint` LÀ CÔNG CỤ BẮT BUỘC CHO `t33`, không phải thứ tuỳ chọn cho đẹp.
      # "YAML parse được" KHÁC "GitHub NHẬN": đo 16-08-2026, `ops-don-ref.yml` bị GitHub
      # TỪ CHỐI — dấu hiệu là một run mang tên ĐƯỜNG DẪN TỆP, 0 job, `conclusion: failure`
      # (run 31971137920). SÁU lượt cross-review đều kết luận "YAML ok" vì cả sáu chỉ kiểm
      # bằng PyYAML, mà PyYAML không biết luật của GitHub.
      #
      # `t33` fail-close khi thiếu công cụ — một cổng tự tắt lúc thiếu công cụ là cổng
      # không tồn tại đúng lúc nó cần nhất. Nên chữa bằng cách CẤP ĐỦ CÔNG CỤ cho runner,
      # đúng tiền lệ `ripgrep` ở `launcher-windows.yml`, chứ không bằng cách hạ chuẩn `t33`.
      #
      # GHIM EXACT như `PyYAML==6.0.3` ngay trên: spec trần làm CÙNG MỘT SHA xanh hôm nay
      # và đỏ ngày mai mà cây không đổi. KHAI THẲNG phần chưa làm: bước này ghim PHIÊN BẢN
      # chứ chưa kiểm BĂM gói tải về — cùng mức bảo đảm với dòng `pip install` phía trên,
      # không hơn. Nâng lên kiểm băm là việc riêng, đừng đọc rộng hơn thứ đang có.
      - name: cài actionlint (bộ cổng đăng lease cần cho t33)
        shell: bash
        env:
          AL_VER: 1.7.7
        run: |
          set -euo pipefail
          if command -v actionlint >/dev/null 2>&1; then actionlint --version; exit 0; fi
          case "${RUNNER_OS}" in
            Linux)   GOI="actionlint_${AL_VER}_linux_amd64.tar.gz" ;;
            macOS)   GOI="actionlint_${AL_VER}_darwin_arm64.tar.gz" ;;
            Windows) GOI="actionlint_${AL_VER}_windows_amd64.zip" ;;
            *) echo "KHONG DO DUOC: nen la '${RUNNER_OS}', chua co goi cho nen nay"; exit 1 ;;
          esac
          DICH="$RUNNER_TEMP/actionlint"
          mkdir -p "$DICH"
          curl -fsSL -o "$DICH/goi" \
            "https://github.com/rhysd/actionlint/releases/download/v${AL_VER}/${GOI}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            unzip -q -o "$DICH/goi" -d "$DICH"
          else
            tar -xzf "$DICH/goi" -C "$DICH"
          fi
          echo "$DICH" >> "$GITHUB_PATH"
          # BẰNG CHỨNG DƯƠNG: `command -v` là CÓ MẶT, `--version` mới là CHẠY ĐƯỢC.
          # Trên Windows tệp là `actionlint.exe`; msys thường tự thêm đuôi, nhưng "thường"
          # không phải phép đo nên thử thẳng cả hai tên.
          "$DICH/actionlint" --version || "$DICH/actionlint.exe" --version
      - name: lease-publish selftest (cổng đăng lease)
        run: python ops/lease_publish_test.py
      # `don-nhanh.ps1` XOÁ NHÁNH REMOTE — thao tác không hoàn tác được ở phía PR: xoá
      # nhầm một nhánh đang là BASE của PR đang mở thì GitHub ĐÓNG các PR ấy, và tạo lại
      # nhánh không mở lại chúng. Bộ này khoá đúng chỗ đó, cộng chốt fail-close khi không
      # đọc được danh sách PR.
      #
      # VÌ SAO NỐI VÀO CI: script này land ngày 17-08 KHÔNG có phản chứng nào, và cùng
      # ngày lộ ra một lỗ (base) mà không phép đo tự động nào bắt được. Cùng bài học với
      # `eol-policy` ngay dưới — guard không nối vào đường TỰ ĐỘNG thì guard chỉ là tài liệu.
      #
      # CHỈ CHẠY TRÊN LINUX — và đây là một lời KHAI NỢ, không phải một lựa chọn thiết kế.
      #
      # Bản đầu của bước này khai "Chạy trên CẢ ubuntu lẫn windows: cả lớp hỏng của script
      # này là lớp hỏng theo NỀN". Câu ấy MÔ TẢ Ý ĐỊNH, không mô tả thực tế, và không ai đo
      # nó: bộ test + bước CI này CHỈ có trên nhánh của #150 (master không có cả hai), mà
      # PR thường chỉ chạy `ubuntu` ⇒ nó CHƯA TỪNG chạy trên Windows. Lần đo Windows đầu
      # tiên là một `workflow_dispatch` gọi tay trước khi merge, và kết quả là:
      #
      #     windows-latest ⇒ `don-nhanh: 3/21 dat`   (run 32060230138, head a66cad69)
      #     ubuntu-latest  ⇒ `don-nhanh: 21/21 dat`  (cùng run)
      #
      # 18 ca đỏ cùng một thông điệp `THIEU git tren PATH.` rc=12. Nguyên nhân gốc nằm
      # trong `Chay-KichBan` của bộ test: nó dựng lại PATH thành `<gh-giả>;/usr/bin;/bin`
      # — dùng `[IO.Path]::PathSeparator` nên DẤU PHÂN CÁCH đúng nền, nhưng ĐƯỜNG DẪN thì
      # ghim cứng POSIX. Port MỘT NỬA, nên đọc lướt thì nó *trông* đã cross-platform.
      # Còn một blocker thứ hai nằm xa hơn, chưa lượt chạy nào chạm tới: `gh` giả là script
      # `#!/bin/sh` cài bằng `chmod +x` — trên Windows không có `chmod`, và tệp không phần
      # mở rộng không chạy được qua `PATH` (`PATHEXT`).
      #
      # VÌ SAO CHẶN Ở ĐÂY thay vì vá ngay: master chạy CẢ HAI nền, nên để nguyên là đẩy
      # một cổng ĐỎ vào master; còn port bộ giả sang Windows là thay đổi lớn, phải có lượt
      # review riêng (và §8 đòi cross-provider cho phạm vi workflow). Giữa "cổng đỏ" và
      # "cổng khai đúng phạm vi mình phủ", chọn cái thứ hai — nhưng KHÔNG được đọc nó thành
      # "đã phủ Windows".
      #
      # NỢ CÓ TÊN: `don-nhanh-test-chua-chay-duoc-tren-windows`. Đáng trả, vì `don-nhanh.ps1`
      # vốn là script CHO Windows (có `don-nhanh.cmd` đi kèm) — tức hiện tại thứ duy nhất
      # KHÔNG được đo lại chính là nền nó chạy thật.
      - name: don-nhanh selftest (chốt xoá nhánh)
        if: runner.os != 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/don-nhanh_test.ps1
      # Cùng doctrine với bước ngay trên và với hai bước eol/pre-push: guard không nối
      # vào đường TỰ ĐỘNG thì guard chỉ là tài liệu (bài học r225).
      # `gate_lifecycle.py` là cơ chế dev-side chống chạy trùng gate + ghi/validate
      # evidence. Nó KHÔNG deselect test và KHÔNG thay promotion gate A2 — xem
      # `docs/PROTOCOL_DA_PHIEN.md`. Bộ này thuần Python, đo 16-08: 13 ca.
      # CHẠY BỘ CA GATE BÊN TRONG MỘT CGROUP ĐƯỢC UỶ QUYỀN — một bước duy nhất.
      #
      # Vì sao gộp: tư cách thành viên cgroup KHÔNG mang được sang bước khác (mỗi
      # `run:` là một shell con của runner agent, không phải con của bước trước).
      # Muốn bộ ca chạy BÊN TRONG vùng được uỷ quyền thì việc chuyển vào và việc
      # chạy phải nằm cùng một shell.
      #
      # Đo được trên `ef82ca3`: không uỷ quyền thì `mkdir` cgroup con trả
      # `[Errno 13]`, gate tụt về QUÉT CÂY và hai ca cgroup lặng lẽ bỏ qua trong
      # khi tổng vẫn xanh — tức con số nói về đường dự phòng.
      #
      # THU HỒI QUYỀN Ở CHA SAU KHI VÀO (P1 cross-review trên `19a9c0e`): muốn
      # chuyển tiến trình vào cgroup con thì luật delegation containment đòi ghi
      # được `cgroup.procs` của TỔ TIÊN CHUNG. Mở đủ lâu để bước vào, rồi TRẢ LẠI
      # root ngay — thu hẹp được một tầng.
      #
      # NHƯNG ĐỪNG ĐỌC ĐÂY THÀNH "ĐÃ KHOÁ ĐƯỜNG RA" (P1 cross-review trên
      # `052d100`; bản trước của chính chú thích này khai đúng như vậy và đó là
      # lời khai SAI). `RIENG/cgroup.procs` vẫn thuộc UID của runner, mà lệnh gate
      # chạy bằng CHÍNH UID ấy trong một `tl-gate-*` con của `RIENG` — nên nó vẫn
      # tự ghi mình ngược lên `RIENG` được, không cần đụng `CHA/cgroup.procs` đã
      # trả về root. Khe "cố tình trèo ra" là khe ĐƯỢC HOÃN CÓ CHỦ Ý; xem khối
      # "PHẠM VI CỦA CHÍNH LỚP CGROUP" trong `gate_lifecycle.py` và
      # `ops/NO_KY_THUAT.md` mục 1. Bước này chặn thoát VÔ TÌNH, không chặn cố ý.
      - name: bo ca gate chay TRONG cgroup duoc uy quyen (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          MOUNT="$(awk '{for(i=1;i<=NF;i++) if($i=="-" && $(i+1)=="cgroup2"){print $5; exit}}' /proc/self/mountinfo)"
          GOC="$(awk -F: '$1=="0"{print $3}' /proc/self/cgroup)"
          echo "mount cgroup2 = ${MOUNT:-KHONG CO} | cgroup cua ta = ${GOC:-KHONG CO}"
          if [ -z "$MOUNT" ] || [ -z "$GOC" ] || [ "$GOC" = "/" ]; then
            echo "KHONG uy quyen duoc (khong co cgroup2, hoac ta dang o GOC diem gan)"
            exit 1
          fi
          CHA="${MOUNT}${GOC}"
          RIENG="${CHA}/tl-gate-ci"
          sudo mkdir -p "$RIENG"
          # Chỉ hai tệp, KHÔNG đệ quy: thư mục (để `mkdir` cgroup con) và
          # `cgroup.procs` của nó. KHÔNG đụng `cgroup.subtree_control`, KHÔNG đụng
          # cgroup con nào đang có dưới service.
          sudo chown "$(id -u):$(id -g)" "$RIENG" "$RIENG/cgroup.procs"
          # Mở tạm ở CHA đúng để bước vào...
          sudo chown "$(id -u):$(id -g)" "$CHA/cgroup.procs"
          echo $$ > "$RIENG/cgroup.procs"
          # ...rồi TRẢ LẠI root ngay. Việc này đóng đúng MỘT đường: ghi thẳng vào
          # `CHA/cgroup.procs`. Con cháu vẫn ghi ngược lên `RIENG` được vì
          # `RIENG/cgroup.procs` phải thuộc UID runner mới chuyển vào được — xem
          # khối trên. ĐỪNG đọc dòng này thành "đã hết đường ra".
          sudo chown root:root "$CHA/cgroup.procs"
          echo "da vao $(awk -F: '$1=="0"{print $3}' /proc/self/cgroup)"
          # FAIL-CLOSE CHO CHÍNH PHÉP ĐO: Linux mà không cấp được cgroup thì lượt
          # này KHÔNG đo lớp vùng chứa, và một lượt xanh như thế là lời khai sai
          # về độ phủ. Thà đỏ ở đây — đỏ thì có người đọc.
          python - <<'PY'
          import sys
          sys.path.insert(0, ".claude/dev")
          import gate_lifecycle as gl
          cg = gl._tao_cgroup_gate()
          print("cap cgroup:", "DUOC" if cg is not None else "KHONG DUOC")
          if cg is None:
              sys.exit(1)
          gl._don_cgroup(cg)
          PY
          python .claude/dev/gate_lifecycle_test.py
      - name: gate lifecycle selftest (nen khong co cgroup)
        if: runner.os != 'Linux'
        run: python .claude/dev/gate_lifecycle_test.py
      # `--all` soi TOÀN BỘ index, không chỉ tệp đang stage — đây là thứ duy nhất bắt được nợ
      # CRLF có sẵn (hook cũ so với HEAD nên mù hoàn toàn với nó).
      #
      # CHẶN NGAY TỪ F2-A, KHÔNG `continue-on-error`: đây là CI policy, thuộc commit policy.
      # Hệ quả CÓ CHỦ ĐÍCH và đã lường trước: chạy CI ở ĐÚNG commit F2-A sẽ ĐỎ, vì 10 blob CRLF
      # di sản vẫn còn trong index cho tới khi F2-B (`git add --renormalize .`) dọn. Ba commit
      # A/B/C là MỘT đơn vị land; trạng thái trung gian đỏ là đúng, còn hạ cổng để A tự xanh thì
      # cổng sẽ fail-open ở HEAD cuối — đắt hơn nhiều. Đo ở HEAD cuối: 0 vi phạm.
      - name: eol-policy survey
        run: python .githooks/eol_policy.py --all --json
      # Canonical selftest chạy ở CÂY DEV, nơi `scripts/test_fragments/` và `.editorconfig` đều
      # có. Gói phát hành KHÔNG có cả hai (bị `_RELEASE_EXCLUDE_DIRS`/`_RELEASE_EXCLUDE_NAMES`
      # loại), nên một fragment có thể XANH ở dev mà NỔ ở gói. Đã xảy ra thật ở vòng 3:
      # `wp49_eol_policy_index_blobs` đọc `.editorconfig`, selftest dev 1696/1696 nhưng selftest
      # trong bundle giải nén báo FAIL. Bước này dựng bundle, giải nén, rồi chạy các bundled
      # fragment case THẬT trên đúng topology đó.
      #
      # Ở ĐÚNG commit F2-A bước này ĐỎ (`TEST_ID_SET_MISMATCH`): bundled module là artifact phái
      # sinh, thuộc F2-C, nên ở A nó chưa mang `wp49`. Cùng hạng với hai bước eol ở trên — A/B/C
      # là MỘT đơn vị land, đo ở HEAD cuối mới là phép đo thật.
      - name: bundled-fragment check (topology gói)
        run: python .github/checks/bundle_fragment_check.py --json
      - name: gen_instructions selftest
        run: python scripts/gen_instructions.py --selftest
      # AG-T0-03: bộ unit test của packet KHÔNG nằm trong `scripts/test_fragments/` nên
      # `tl.py --selftest` KHÔNG khám phá ra nó — đo được ở lượt land: cùng một lượt, selftest đếm
      # 1697/1697 trên CẢ master lẫn nhánh packet, tức 7 ca mới không hề được tính. Không có bước
      # này thì bằng chứng "7/7 ca" chỉ tái lập được bằng tay, và CI sẽ không bao giờ đỏ khi ai đó
      # làm hỏng `compute_parser_coverage`. Giữ bước riêng (thay vì chuyển tệp sang
      # `test_fragments/`) để không đụng vào topology gói đang sát trần 200.
      - name: command-registry unit test (AG-T0-03)
        run: python scripts/tl_core/command_registry_test.py
      # BỌC selftest qua `gate_lifecycle.py run` thay vì gọi thẳng — KHÔNG thêm lượt
      # chạy nào, chỉ thêm bằng chứng. Vì sao cần: `.claude/commands/gate-targeted.md`
      # bước 4 bảo reviewer tải artifact `gate-evidence-<OS>-<attempt>` để tái dùng
      # thay cho một lượt full local, mà TRƯỚC ĐỢT NÀY không có gì trong CI sinh ra nó
      # (P2 cross-review PR "#141"). Tài liệu mô tả một đường không tồn tại thì người
      # làm theo sẽ rơi xuống nhánh dự phòng mà không hiểu vì sao — cùng họ "cổng
      # không nói dối, nó VẮNG MẶT".
      # `--positive-regex` đòi N/N hai số BẰNG NHAU: rc=0 một mình không phải bằng chứng.
      # ĐỊNH DANH PHẢI KHỚP ĐÚNG BỘ VALIDATOR ghi trong `gate-targeted.md` — tên tệp
      # `tl-selftest-<OS>`, `--name tl-selftest`, `--selected-test full-selftest`, và
      # `base_sha` là MERGE-BASE với master. Lượt trước tôi sinh ra artefact với bộ
      # định danh KHÁC (`selftest`, `$GITHUB_SHA`), nên `validate` báo mismatch ngay
      # cả với artefact thành công và đường tái dùng vẫn luôn rơi xuống `/gate`
      # (P2 cross-review PR "#141"). Tôi đã kiểm artefact TỒN TẠI rồi tuyên bố xong,
      # mà chưa kiểm nó DÙNG ĐƯỢC bởi đúng lệnh tài liệu chỉ — lại đúng lỗi "đo sự
      # có mặt thay vì đo khả năng".
      # CHI SINH BẰNG CHỨNG Ở LƯỢT MÀ `HEAD` LÀ COMMIT THẬT.
      #
      # Trên `pull_request`, `actions/checkout` lấy commit MERGE TỔNG HỢP, nên
      # `git rev-parse HEAD` KHÔNG phải head của PR. Đo được: lượt `pull_request`
      # trên `91a027d` ĐỎ ngay ở bước này trong khi `workflow_dispatch` cùng SHA
      # xanh. Tôi đã đổi một mỏ neo sai (`$GITHUB_SHA`) lấy một mỏ neo sai khác
      # (PR head, trong khi cây là merge) — cả hai đều khai một thứ KHÔNG PHẢI thứ
      # vừa đo.
      #
      # Không có cách nào làm đúng ở lượt PR mà không đổi thứ CI đang test: cây
      # merge chính là thứ đáng test trước khi vào master. Nên bằng chứng chỉ sinh
      # ở `push`/`workflow_dispatch`, đúng luồng `gate-targeted.md` mô tả ("T1
      # push/handoff: chờ CI tạo full evidence exact-head"). Lượt PR vẫn chạy
      # selftest, chỉ không giả vờ sinh ra chứng cho một commit không có trong lịch sử.
      - name: tl selftest (luot PR — khong sinh bang chung)
        if: ${{ github.event_name == 'pull_request' }}
        run: python scripts/tl.py --selftest
      - name: tl selftest (co bang chung exact-identity)
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/.tl_state/gate
          # KHÔNG dùng `--depth`: checkout ở trên cố ý đặt `fetch-depth: 0` cho
          # `doc-claims` L2 (`cat-file -e` trượt mọi SHA cũ trên clone nông). Một
          # `--depth=50` ở đây có thể làm nông lại chính thứ bước kia cần, và tệ hơn
          # là `merge-base` sẽ trượt khi nhánh rẽ xa hơn 50 commit (P2 review "#141").
          # FAIL-CLOSE: `base_sha` sai làm bằng chứng vô dụng một cách IM LẶNG.
          git fetch --no-tags origin master
          # HEAD ĐÚNG LÀ HEAD CỦA PR, không phải `$GITHUB_SHA`. Trên `pull_request`,
          # `$GITHUB_SHA` là commit MERGE TỔNG HỢP do GitHub dựng — dòng 73 của chính
          # tệp này đã cảnh báo đúng điều đó, và tôi vẫn viết sai ở đây (P2 review
          # "#141"). Evidence neo vào commit tổng hợp thì không ai validate lại được
          # vì commit ấy không có trong lịch sử nhánh.
          # `HEAD` của cây, không phải biến nào cả: bằng chứng phải khai ĐÚNG
          # thứ vừa đo. Bước này chỉ chạy khi HEAD là commit thật (xem `if:` trên).
          HEAD_SHA="$(git rev-parse HEAD)"
          BASE_SHA="$(git merge-base FETCH_HEAD "$HEAD_SHA")"
          echo "head_sha = $HEAD_SHA"
          echo "base_sha = $BASE_SHA"
          NEN="${RUNNER_OS}"
          python .claude/dev/gate_lifecycle.py run \
            --kind heavy --name tl-selftest --repo . \
            --evidence "scripts/.tl_state/gate/tl-selftest-${NEN}.json" \
            --output "scripts/.tl_state/gate/tl-selftest-${NEN}.out" \
            --expected-head "$HEAD_SHA" --base-sha "$BASE_SHA" --require-clean \
            --selected-test full-selftest \
            --wait-seconds 60 --timeout-seconds 2400 \
            --positive-regex '(?m)^.*\b([1-9][0-9]*)/\1\b[^\r\n]*\r?\n?\Z' \
            -- python scripts/tl.py --selftest
      # `if: always()` — bằng chứng của một lượt ĐỎ còn đáng tải hơn của lượt xanh.
      - name: tai len gate-evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          # Lượt PR không sinh evidence (xem trên) => không có tệp là ĐÚNG, không phải lỗi.
          path: scripts/.tl_state/gate/
          if-no-files-found: warn
      - name: workflow-audit strict
        run: python scripts/tl.py workflow-audit --strict --json
      - name: golden-test
        run: python scripts/tl.py golden-test --json
      # r225: r218 dựng cổng kiểm trích dẫn, r219 nối vào `/gate` (đường TAY) mà QUÊN CI (đường TỰ ĐỘNG)
      # — đúng loại hỏng r219 tự mô tả: "guard không nối vào đường chạy tự động thì guard chỉ là tài liệu".
      - name: doc-claims-check strict
        run: python scripts/tl.py doc-claims-check --strict --json
      - name: determinism-audit strict
        run: python scripts/tl.py determinism-audit --strict --json
      - name: release-check full
        run: python scripts/tl.py release-check --full --json
      # --strict: file THỪA trong cây mà manifest không có ⇒ ĐỎ (bản cũ chỉ cảnh báo rồi trôi qua)
      - name: release-verify strict (manifest khớp cây)
        run: python scripts/tl.py release-verify RELEASE_MANIFEST.json --strict --json
      - name: release-bundle x2 cùng SHA-256
        shell: bash
        run: |
          python scripts/tl.py release-bundle --out dist/a.zip --json > /dev/null
          python scripts/tl.py release-bundle --out dist/b.zip --json > /dev/null
          python - <<'PY'
          import hashlib
          h = [hashlib.sha256(open(f, "rb").read()).hexdigest() for f in ("dist/a.zip", "dist/b.zip")]
          assert h[0] == h[1], f"bundle không tất định: {h}"
          print("bundle sha256 =", h[0])
          PY
      - name: tl_boot smoke
        run: python scripts/tl_boot.py --version
