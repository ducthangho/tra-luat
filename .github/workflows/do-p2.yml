name: do-p2 (NHANH DO TAM — A1/A5 cua CI-PROVENANCE-SONG-SONG, khong merge)

on:
  push:
    branches: ['do-ci/**']

permissions:
  contents: read

jobs:
  do:
    strategy:
      fail-fast: false
      matrix:
        n: ["1", "4", "vang"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Force LF checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.abbrev 7
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet PyYAML==6.0.3 jsonschema==4.26.0
      - shell: bash
        env:
          AL_VER: 1.7.7
        run: bash ops/cai_actionlint.sh
      - shell: bash
        run: bash ops/cai_cong_cu.sh shellcheck
      - shell: bash
        run: bash ops/cai_cong_cu.sh rg
      - name: chay ci_provenance_test
        shell: bash
        env:
          N: ${{ matrix.n }}
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/kq"
          nproc
          s=$(date +%s)
          if [ "$N" = vang ]; then
            python ops/ci_provenance_test.py > "$RUNNER_TEMP/kq/n-$N.out" 2>&1; rc=$?
          else
            CI_PROVENANCE_TIEN_TRINH="$N" python ops/ci_provenance_test.py > "$RUNNER_TEMP/kq/n-$N.out" 2>&1; rc=$?
          fi
          echo "n=$N rc=$rc giay=$(( $(date +%s) - s ))" | tee "$RUNNER_TEMP/kq/n-$N.meta"
          tail -5 "$RUNNER_TEMP/kq/n-$N.out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: do-p2-n-${{ matrix.n }}
          path: ${{ runner.temp }}/kq/
