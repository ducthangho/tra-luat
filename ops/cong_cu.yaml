# ops/cong_cu.yaml — BẢN KÊ CÔNG CỤ TẤT ĐỊNH (G1, packet #290 HA-TANG-CONG-CU-TAT-DINH).
# MỘT nguồn cho `ops/cong_cu.py` (probe+canary+cổng), `ops/cai_cong_cu.sh` (cài), CI. Danh
# sách CHO PHÉP đang LỚN DẦN — công cụ chưa cổng nào gọi tới thì không có ở đây (xem
# `chua_do_duoc`), không phải khiếm khuyết cần vá ngay.
# SCHEMA `cong_cu.<ten>`: bat_buoc(vắng MỌI probe⇒KHÔNG_ĐO_ĐƯỢC,mã riêng,G4/T1) ·
# ban_ghim(chuỗi KHÁC RỖNG|null) · probe(≥1 {ten,lenh:[argv],regex,expected_rc?:int|[int]};
# expected_rc vắng=0; regex phải bắt TRỌN token; >1 probe=T7: các đường PHẢI khớp NHAU) ·
# chinh_sach(blocking|advisory; chỉ có nghĩa khi có canary; vắng⇒blocking fail-close) ·
# cai({lenh,moi_truong} chung MỌI nền, hoặc
# {linux|macos|windows:{...}} khi khác theo nền; vắng=chưa tự động hoá, từ chối RÕ) ·
# canary(fixture ops/canary/<tên>.yml minh chứng CÓ HIỆU LỰC, không chỉ có mặt).
schema_version: 1
cong_cu:
  git:
    # Git for Windows in `git version 2.55.0.windows.5` — hậu tố nhà cung cấp nối bằng
    # DẤU CHẤM, không phải `-`/`+` như PEP 440. Regex cũ bắt `2.55.0` rồi `_cat_tien_to_token`
    # từ chối ĐÚNG vì ký tự kế là `.` ⇒ lane windows-latest ĐỎ ở G5 ngay lượt master đầu
    # tiên sau #446 (run 33612364175). Regex nay bắt trọn tới hết token; Linux (`2.43.0`)
    # và macOS (`2.39.3 (Apple Git-146)`) dừng ở xuống dòng / khoảng trắng như trước.
    bat_buoc: true
    ban_ghim: null
    probe: [{ten: mac_dinh, lenh: [git, --version], regex: '(?m)^git version\s+(\d+\.\d+\.\d+(?:[.+-][0-9A-Za-z.+-]*)?)'}]
    cai:
      # wp858 (L1): `chon_thu_muc_chay_duoc` (ops/cai_cong_cu.sh) in ứng viên Q2 ĐẦU TIÊN mà `cong_cu.py kiem-tra` nhận DAT
      # (Linux `/usr/bin` · macOS brew · Windows choco; cuối `command -v`). python: checker giải `python` theo PATH
      # (`python` → `python3` → `py -3`, như `cai_cong_cu.sh`) — nợ `python-probe-khong-theo-PATH` đã đóng ở #886 (PR #888).
      linux: {lenh: 'sudo apt-get install -y git && chon_thu_muc_chay_duoc git "${CONG_CU_GOC:-}/usr/bin" "$(dirname "$(command -v git || echo ./git)")"'}
      macos: {lenh: 'brew install git && chon_thu_muc_chay_duoc git "$(brew --prefix)/bin" "$(dirname "$(command -v git || echo ./git)")"'}
      windows: {lenh: 'choco install git --yes --no-progress && chon_thu_muc_chay_duoc --win git "${ProgramFiles:-C:/Program Files}/Git/cmd" "${ProgramFiles:-C:/Program Files}/Git/bin" "${ProgramFiles:-C:/Program Files}/Git/usr/bin" "$(dirname "$(command -v git || echo ./git)")"'}
  python:
    bat_buoc: true
    ban_ghim: null
    probe: [{ten: mac_dinh, lenh: [python, --version], regex: '(?m)^Python\s+(\d+\.\d+\.\d+)'}]
    cai:
      linux: {lenh: 'sudo apt-get install -y python3 python3-pip && chon_thu_muc_chay_duoc python "${CONG_CU_GOC:-}/usr/bin" "$(dirname "$(command -v python || echo ./python)")"'}
      macos: {lenh: 'brew install python && chon_thu_muc_chay_duoc python "$(brew --prefix)/bin" "$(dirname "$(command -v python || echo ./python)")"'}
      windows: {lenh: 'choco install python --yes --no-progress && chon_thu_muc_chay_duoc --win python "${ChocolateyInstall:-C:/ProgramData/chocolatey}/bin" "$(cygpath -u "${SystemDrive:-C:}/")"Python3* "$(dirname "$(command -v python || echo ./python)")"'}
  PyYAML:
    # Khai để LUẬT ở `t16` có hiệu lực: mọi gói bên thứ ba phải có mặt trong bản kê.
    # `ban_ghim: null` CÓ CHỦ ĐÍCH — `ci.yml` giữ quyền ghim (6.0.3). Container dev
    # hiện có 6.0.1; ghim ở đây sẽ làm cổng ĐỎ vì một trôi lệch KHÔNG thuộc packet này.
    # Trôi lệch ấy là nợ có thật, đã khai ở phần báo cáo, không nuốt.
    bat_buoc: true
    ban_ghim: null
    probe:
      - ten: mac_dinh
        lenh: [python, -c, "import importlib.metadata as m; print(m.version('PyYAML'))"]
        regex: '(?m)^(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$'
    cai: {lenh: "python -m pip install --quiet PyYAML==6.0.3"}
  actionlint:
    bat_buoc: true
    ban_ghim: "1.7.7"
    probe: [{ten: mac_dinh, lenh: [actionlint, -version], regex: '(?m)^(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$'}]
    cai: {lenh: "bash ops/cai_actionlint.sh", moi_truong: {AL_VER: "1.7.7"}}
    canary: actionlint_shellcheck
    chinh_sach: blocking
  jsonschema:
    # `.claude/dev/review_verdict_binding.py` import ở MỨC MODULE, mà `packet_loop.py`
    # import lại nó — nên thiếu gói này thì cổng gate lifecycle KHÔNG IMPORT NỔI, không
    # phải "chạy yếu đi". Đo được: `gate` ĐỎ liên tục từ `47a50395` với
    # `ModuleNotFoundError: No module named 'jsonschema'`, và không ai thấy suốt bốn vòng
    # cross-review vì cả bốn chạy trong container có sẵn gói.
    # `python` KHÔNG `python3`: Windows phổ biến chỉ có `python`/`py` (CLAUDE.md).
    bat_buoc: true
    ban_ghim: "4.26.0"
    probe:
      - ten: mac_dinh
        lenh: [python, -c, "import importlib.metadata as m; print(m.version('jsonschema'))"]
        regex: '(?m)^(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$'
    cai: {lenh: "python -m pip install --quiet jsonschema==4.26.0"}
  shellcheck:
    # KHÔNG bắt buộc: actionlint tự dò shellcheck trên PATH, ÂM THẦM bỏ lớp luật SC* khi
    # vắng (rc=0) — canary trên bắt đúng sự âm thầm đó (T2).
    bat_buoc: false
    chuan_bi: true
    ban_ghim: null
    probe: [{ten: mac_dinh, lenh: [shellcheck, --version], regex: 'version:\s*(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)'}]
    cai:
      linux: {lenh: 'sudo apt-get install -y shellcheck && chon_thu_muc_chay_duoc shellcheck "${CONG_CU_GOC:-}/usr/bin" "$(dirname "$(command -v shellcheck || echo ./shellcheck)")"'}
      macos: {lenh: 'brew install shellcheck && chon_thu_muc_chay_duoc shellcheck "$(brew --prefix)/bin" "$(dirname "$(command -v shellcheck || echo ./shellcheck)")"'}
      windows: {lenh: 'choco install shellcheck --yes --no-progress && chon_thu_muc_chay_duoc --win shellcheck "${ChocolateyInstall:-C:/ProgramData/chocolatey}/bin" "$(dirname "$(command -v shellcheck || echo ./shellcheck)")"'}
  rg:
    # Agent không thể tra cứu an toàn nếu thiếu rg; launcher đã coi đây là bắt buộc.
    bat_buoc: true
    ban_ghim: null
    probe: [{ten: mac_dinh, lenh: [rg, --version], regex: '(?m)^ripgrep\s+(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)'}]
    cai:
      # wp868 (N4): cùng bộ chọn `chon_thu_muc_chay_duoc` (ops/cai_cong_cu.sh) với git/python/shellcheck/bash — thư mục
      # là ứng viên ĐẦU TIÊN mà CHÍNH `cong_cu.py kiem-tra --chi rg` nhận `DAT`, đi qua kênh kết quả RIÊNG (trình cài
      # `ripgrep` không kết thúc stdout bằng LF nên không còn bị nối dòng). Tên trần đã DAT ⇒ không đổi PATH, không ghi
      # $GITHUB_PATH (ci.yml run 39115659366). Ứng viên: Linux `/usr/bin` (dưới `CONG_CU_GOC` khi test) · macOS
      # `$(brew --prefix)/bin` · Windows WinGet\Links, choco\bin — rồi `command -v`.
      # Phần trước ` && ` ĐẦU TIÊN (lệnh cài) PHẢI khớp `CONG_CU` của launcher.py và hook (launcher_test canh); wp802 (Q6):
      # winget trước, choco dự phòng.
      linux: {lenh: 'sudo apt-get install -y ripgrep && chon_thu_muc_chay_duoc rg "${CONG_CU_GOC:-}/usr/bin" "$(dirname "$(command -v rg || echo ./rg)")"'}
      macos: {lenh: 'brew install ripgrep && chon_thu_muc_chay_duoc rg "$(brew --prefix)/bin" "$(dirname "$(command -v rg || echo ./rg)")"'}
      windows: {lenh: 'winget install --id BurntSushi.ripgrep.MSVC -e --accept-source-agreements --accept-package-agreements --disable-interactivity || choco install ripgrep --yes --no-progress && chon_thu_muc_chay_duoc --win rg "$LOCALAPPDATA/Microsoft/WinGet/Links" "${ChocolateyInstall:-C:/ProgramData/chocolatey}/bin" "$(dirname "$(command -v rg || echo ./rg)")"'}
  bash:
    # Hook SessionStart là bash; trên Windows công thức này cấp Git Bash.
    bat_buoc: true
    ban_ghim: null
    probe: [{ten: mac_dinh, lenh: [bash, --version], regex: '(?m)^GNU bash, version\s+(\d+\.\d+\.\d+)[^(]*\('}]
    cai:
      linux: {lenh: 'sudo apt-get install -y bash && chon_thu_muc_chay_duoc bash "${CONG_CU_GOC:-}/usr/bin" "$(dirname "$(command -v bash || echo ./bash)")"'}
      macos: {lenh: 'brew install bash && chon_thu_muc_chay_duoc bash "$(brew --prefix)/bin" "$(dirname "$(command -v bash || echo ./bash)")"'}
      windows: {lenh: 'choco install git --yes --no-progress && chon_thu_muc_chay_duoc --win bash "${ProgramFiles:-C:/Program Files}/Git/cmd" "${ProgramFiles:-C:/Program Files}/Git/bin" "${ProgramFiles:-C:/Program Files}/Git/usr/bin" "$(dirname "$(command -v bash || echo ./bash)")"'}
