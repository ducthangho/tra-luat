# ops/cong_cu.yaml — BẢN KÊ CÔNG CỤ TẤT ĐỊNH (G1, packet #290 HA-TANG-CONG-CU-TAT-DINH).
# MỘT nguồn cho `ops/cong_cu.py` (probe+canary+cổng), `ops/cai_cong_cu.sh` (cài), CI. Danh
# sách CHO PHÉP đang LỚN DẦN — công cụ chưa cổng nào gọi tới thì không có ở đây (xem
# `chua_do_duoc`), không phải khiếm khuyết cần vá ngay.
# SCHEMA `cong_cu.<ten>`: bat_buoc(vắng MỌI probe⇒KHÔNG_ĐO_ĐƯỢC,mã riêng,G4/T1) ·
# ban_ghim(chuỗi KHÁC RỖNG|null) · probe(≥1 {ten,lenh:[argv],regex,expected_rc?:int|[int]};
# expected_rc vắng=0; regex phải bắt TRỌN token; >1 probe=T7: các đường PHẢI khớp NHAU) ·
# chinh_sach(blocking|advisory; chỉ có nghĩa khi có canary; vắng⇒blocking fail-close) ·
# cai({lenh,moi_truong} chung MỌI nền, hoặc
# {linux|macos|windows:{...}} khi khác theo nền; vắng=chưa tự động hoá, từ chối RÕ) ·
# canary(fixture ops/canary/<tên>.yml minh chứng CÓ HIỆU LỰC, không chỉ có mặt).
schema_version: 1
cong_cu:
  git:
    bat_buoc: true
    ban_ghim: null
    probe: [{ten: mac_dinh, lenh: [git, --version], regex: '(?m)^git version\s+(\d+\.\d+\.\d+)'}]
    cai:
      linux: {lenh: 'sudo apt-get install -y git && dirname "$(command -v git)"'}
      macos: {lenh: 'brew install git && dirname "$(command -v git)"'}
      windows: {lenh: 'choco install git --yes --no-progress && dirname "$(command -v git)"'}
  python:
    bat_buoc: true
    ban_ghim: null
    probe: [{ten: mac_dinh, lenh: [python, --version], regex: '(?m)^Python\s+(\d+\.\d+\.\d+)'}]
    cai:
      linux: {lenh: 'sudo apt-get install -y python3 python3-pip && dirname "$(command -v python3)"'}
      macos: {lenh: 'brew install python && dirname "$(command -v python)"'}
      windows: {lenh: 'choco install python --yes --no-progress && dirname "$(command -v python)"'}
  PyYAML:
    # Khai để LUẬT ở `t16` có hiệu lực: mọi gói bên thứ ba phải có mặt trong bản kê.
    # `ban_ghim: null` CÓ CHỦ ĐÍCH — `ci.yml` giữ quyền ghim (6.0.3). Container dev
    # hiện có 6.0.1; ghim ở đây sẽ làm cổng ĐỎ vì một trôi lệch KHÔNG thuộc packet này.
    # Trôi lệch ấy là nợ có thật, đã khai ở phần báo cáo, không nuốt.
    bat_buoc: true
    ban_ghim: null
    probe:
      - ten: mac_dinh
        lenh: [python, -c, "import importlib.metadata as m; print(m.version('PyYAML'))"]
        regex: '(?m)^(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$'
    cai: {lenh: "python -m pip install --quiet PyYAML==6.0.3"}
  actionlint:
    bat_buoc: true
    ban_ghim: "1.7.7"
    probe: [{ten: mac_dinh, lenh: [actionlint, -version], regex: '(?m)^(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$'}]
    cai: {lenh: "bash ops/cai_actionlint.sh", moi_truong: {AL_VER: "1.7.7"}}
    canary: actionlint_shellcheck
    chinh_sach: blocking
  jsonschema:
    # `.claude/dev/review_verdict_binding.py` import ở MỨC MODULE, mà `packet_loop.py`
    # import lại nó — nên thiếu gói này thì cổng gate lifecycle KHÔNG IMPORT NỔI, không
    # phải "chạy yếu đi". Đo được: `gate` ĐỎ liên tục từ `47a50395` với
    # `ModuleNotFoundError: No module named 'jsonschema'`, và không ai thấy suốt bốn vòng
    # cross-review vì cả bốn chạy trong container có sẵn gói.
    # `python` KHÔNG `python3`: Windows phổ biến chỉ có `python`/`py` (CLAUDE.md).
    bat_buoc: true
    ban_ghim: "4.26.0"
    probe:
      - ten: mac_dinh
        lenh: [python, -c, "import importlib.metadata as m; print(m.version('jsonschema'))"]
        regex: '(?m)^(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$'
    cai: {lenh: "python -m pip install --quiet jsonschema==4.26.0"}
  shellcheck:
    # KHÔNG bắt buộc: actionlint tự dò shellcheck trên PATH, ÂM THẦM bỏ lớp luật SC* khi
    # vắng (rc=0) — canary trên bắt đúng sự âm thầm đó (T2).
    bat_buoc: false
    chuan_bi: true
    ban_ghim: null
    probe: [{ten: mac_dinh, lenh: [shellcheck, --version], regex: 'version:\s*(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)'}]
    cai:
      linux: {lenh: 'sudo apt-get install -y shellcheck && dirname "$(command -v shellcheck)"'}
      macos: {lenh: 'brew install shellcheck && dirname "$(command -v shellcheck)"'}
      windows: {lenh: 'choco install shellcheck --yes --no-progress && dirname "$(command -v shellcheck)"'}
  rg:
    # Agent không thể tra cứu an toàn nếu thiếu rg; launcher đã coi đây là bắt buộc.
    bat_buoc: true
    ban_ghim: null
    probe: [{ten: mac_dinh, lenh: [rg, --version], regex: '(?m)^ripgrep\s+(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)'}]
    cai:
      linux: {lenh: 'sudo apt-get install -y ripgrep && dirname "$(command -v rg)"'}
      macos: {lenh: 'brew install ripgrep && dirname "$(command -v rg)"'}
      windows: {lenh: 'choco install ripgrep --yes --no-progress && dirname "$(command -v rg)"'}
  bash:
    # Hook SessionStart là bash; trên Windows công thức này cấp Git Bash.
    bat_buoc: true
    ban_ghim: null
    probe: [{ten: mac_dinh, lenh: [bash, --version], regex: '(?m)^GNU bash, version\s+(\d+\.\d+\.\d+)[^(]*\('}]
    cai:
      linux: {lenh: 'sudo apt-get install -y bash && dirname "$(command -v bash)"'}
      macos: {lenh: 'brew install bash && dirname "$(command -v bash)"'}
      windows: {lenh: 'choco install git --yes --no-progress && dirname "$(command -v bash)"'}
