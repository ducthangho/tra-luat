quyet_dinh_thiet_ke_can_reviewer_soi:
  - 'Lệch giữa bản bung và cây của oid ra rc 8 (KHÔNG ĐO ĐƯỢC), không phải rc 12: thứ hỏng là dụng cụ đo trên nền này, không phải biên bản.'
  - 'Phép đối chiếu bản bung chạy cho CẢ thư mục ops/land/<x>-provenance của oid (ba thành phần đầu của đường dẫn), cả nhánh passed lẫn nhánh miễn, kể cả tệp không liên quan tới validator: một .gitattributes hay một cặp tên trùng ở bất kỳ đâu trong thư mục ấy làm rc 8.'
  - 'git(): lệnh HỎI (cat-file, branch, show) rc khác 0 coi như trả rỗng ⇒ oid_khong_tren_remote hoặc "không đọc được module trên origin/master"; lệnh còn lại (ls-tree, archive) rc khác 0 là lỗi đo ⇒ rc 8. Đột biến d2b_bo_rc_git_do · d2b_bo_rc_git_hoi khoá hai nửa.'
  - 'Băm blob dùng hashlib.sha1: kho định dạng sha256 sẽ không khớp (oid 40 hex đã bị SHA_RE ép từ đầu).'
  - 'tarfile.extractall(filter="data") cần Python ≥ 3.12 (CI ghim 3.12; đo ở 3.13.18).'
  - 'Các điểm của lượt 1 không đổi: D2b chỉ chạy khi D1 đạt; module nạp lười; attempt_kieu bắn thì neo_attempt không bắn kèm; dòng D2b ĐẠT in cả khi D3/D4 đỏ.'
he_qua_windows:   # biết trước từ mã và tài liệu, CHƯA đo trên Windows
  - 'Nền không có quyền tạo symlink: mọi oid có symlink (mode 120000) ở bất kỳ đâu trong thư mục ops/land/<x>-provenance ra rc 8 "bản bung … không khớp cây của oid", không ra lý do của module. Đo trên origin/master 5dc92e2: 0 mục 120000 và 0 gitlink trên 10140 mục của ops/land; 0 tên chứa byte ngoài 0x21–0x7E — tức chưa hồ sơ thật nào chạm đường này.'
  - 'Bộ ca tự dò khả năng tạo symlink (_d2b_symlink_duoc): nền không tạo được thì 6 biến thể đánh dấu sym chuyển kỳ vọng sang rc 8. Trên nền ấy các biến thể đó KHÔNG đo lý do kiem_tep:not_measured:symlink nữa — một lượt Windows xanh không chứng minh nhánh ấy.'
  - 'Hệ tệp không phân biệt hoa/thường: ca hai_ten_chi_khac_hoa_thuong ra rc 8 nhờ chốt trùng tên (chạy trước khi đọc tệp); trên Linux cùng chốt ấy bắn. Hành vi thật của tarfile khi hai tên va nhau trên NTFS: chưa đo.'
  - 'core.autocrlf của MÁY CHẠY đổi đầu ra git archive — ĐO trên kho tạm không có .gitattributes (gate/autocrlf.log, git 2.43.0): autocrlf=true ⇒ LF thành CRLF; false/input ⇒ nguyên byte. Với kho thật thì không: git archive origin/master (5dc92e2) -- ops/land dưới autocrlf=false VÀ =true đều cho 10140/10140 tệp khớp băm blob, 0 tệp vắng (gate/archive_that.log) — nhờ ".gitattributes: * text=auto eol=lf" của chính commit. Hệ quả: oid KHÔNG mang .gitattributes ấy + máy autocrlf=true ⇒ rc 8 (trước lượt 2 thì validator đọc byte đã đổi mà không ai biết). Bộ ca chạy git với GIT_CONFIG_GLOBAL/SYSTEM = os.devnull nên không ăn cấu hình máy; git for Windows thật: chưa đo.'
