  - 'Bảng mục index của fixture: giá trị bytearray ⇒ mode 100755 (để tệp 100755 của lkg không phụ thuộc chmod và core.fileMode).'
mo_hinh_khong_phai_windows: >-
  Hai móc trong tiến trình. git_loi="tep" (lượt 4) thay os.walk để xếp symlink trỏ thư mục vào danh sách tệp; cần cho lk4, lk6, lk7 trên Linux.
  git_loi="nguyen" (lượt 6) thay bộ lọc của extractall: gọi tarfile.data_filter rồi trả lại linkname gốc; cần cho lkl trên Python có bản vá tarfile.
  Bảy fixture _D2B_TC và năm fixture _D2B_TB không dùng mô hình nào. Không mô hình nào tạo symlink loại tệp hay mô phỏng phép phân giải tên của NTFS.
he_qua_windows:   # viết từ mã và từ các phép đo của điều phối; kết quả M3 trên 45944c7 ở mục test Windows
  - 'Bảng _D2B_TB rỗng trên Windows (os.sep khác "/"): năm biến thể lkf…lkj VẮNG MẶT. Một lượt Windows xanh không đo chúng.'
  - 'lka (→ sub\…\x): đường dẫn Windows hợp lệ tới một tệp thường; bị (a) chặn trên mọi nền.'
  - 'nen_giu_nguyen_dich[lkl] và [lk5] chạy trên Windows, trong tiến trình. Trên 3.12.10 bộ lọc data không viết lại linkname (điều phối đo), nên với lkl mô hình ở đó trùng hành vi của chính bộ lọc.'
  - 'lk8 (→ SUB): trên NTFS SUB phân giải tới thư mục sub; (c) chặn vì "…/SUB" không trùng từng byte mục nào kiểu tệp.'
  - 'Máy không tạo được symlink: mọi biến thể đánh dấu sym tự chuyển kỳ vọng sang rc 8 danh mục; một lượt xanh trên máy ấy KHÔNG đo chốt.'
