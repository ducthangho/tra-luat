quyet_dinh_thiet_ke_can_reviewer_soi:
  - '"Cây" trong quyết định được đọc là DANH MỤC CÂY CON của thư mục provenance (thứ được bung), không phải cả cây của oid: đích ../lk5-provenance/ci.yaml là tệp thường có thật trong cây của oid nhưng bị CHẶN (lkc). Chặt hơn chữ quyết định; điều phối đồng ý (02:05Z 26-11).'
  - 'Chuẩn hoá là VĂN BẢN (posixpath.normpath), đúng chữ quyết định. Đích không chuẩn tắc mà chuẩn hoá ra tệp thường thì QUA dù nền có thể coi là hỏng. Lập luận rằng không symlink nào qua danh sách mà nền lại coi là THƯ MỤC: giả sử mọi symlink của danh mục đều qua. Xét một symlink mà nền phân giải thành công. Nếu đường phân giải không đi xuyên symlink nào khác thì mọi thành phần là thư mục thật, phép ".." chạy trên thư mục thật nên normpath trùng phép phân giải của nền, và đích là đúng tệp thường ấy. Nếu nó đi xuyên một symlink khác như một thành phần thư mục thì symlink kia phải phân giải tới thư mục; lấy symlink trong cùng của chuỗi lồng ấy, nó không đi xuyên symlink nào nên theo ý trên nó là tệp thường — mâu thuẫn. Còn symlink mà đích cuối là một symlink khác thì không qua danh sách (đích không phải mục kiểu tệp).'
  - 'Lập luận trên dùng ngữ nghĩa POSIX. Trên Windows một đích có "/" không phân giải (điều phối đo 18:41Z 25-11) và một đích có "\" không bao giờ trùng từng byte một đường dẫn POSIX của danh mục, trừ khi danh mục có tệp mang "\" trong tên; cây như thế không bung được nguyên dạng trên Windows và luật danh mục ra rc 8.'
  - '"Mục kiểu tệp" = mọi mode khác 040000 và 120000 (xem chua_do_duoc về gitlink).'
  - 'Không dùng casefold, NFC hay đổi dấu phân cách ở chốt này: ba đột biến cho_hoa_thuong, cho_nfc, cho_cheo_nguoc thêm đúng các phép ấy và đều làm ca đích đỏ.'
  - 'Chốt chỉ nằm ở nhánh passed. Nhánh miễn không gọi K2; kiem_mien lọc readback bằng is_file() and not is_symlink(), không dùng os.walk.'
