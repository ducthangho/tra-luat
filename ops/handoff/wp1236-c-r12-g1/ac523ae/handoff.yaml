  - 'tep/readback_thu_muc chứa ký tự xuống dòng: regex đặc tả [^/]+ cho phép, khi ấy dòng "D2b ĐẠT …" hay lý do symlink_hoac_mode:… bị tách thành nhiều dòng. Không xử lý (đặc tả không nói); không có ca.'
  - 'Hai lệnh git branch -r --contains và cat-file chạy trên object store cục bộ: không chứng minh remote THẬT còn giữ oid lúc chạy (đặc tả đòi fetch trước).'
