doi_chieu_mau_co_san:   # chủ kho: "Đọc kỹ launcher, lỗi symlink đã được xử lý trong skill"
  mau_1: '.claude/dev/launcher.py `_chup_workspace`: os.walk(followlinks=False); mục nào trong danh sách thư mục mà islink thì chuyển sang danh sách tệp; MỌI mục trong danh sách tệp được lstat + S_ISLNK ⇒ ghi L kèm sha256 của readlink'
  giong: 'ý (i) — nhận diện symlink trên MỌI mục của cả hai danh sách, không tin cách os.walk xếp: D2b làm vậy từ lượt 3 (`dia` duyệt ds + fs, hỏi is_symlink() TRƯỚC is_dir()) rồi so hai chiều với mode của cây. Tập symlink trên đĩa = tập mục 120000; lệch ⇒ rc 8. Chốt mới chạy trên đúng tập 120000 ấy, nên không có symlink nào mẫu bắt được mà D2b không thấy'
  khac_co_chu_y: 'ý (ii) — mẫu coi mọi symlink như nhau (L). D2b không theo nguyên dạng vì K2 phân biệt symlink trỏ thư mục (vi phạm) với symlink tệp không phải *.yaml (không xét). Muốn giữ phân biệt ấy mà không hỏi nền thì chỉ còn cây: mode 120000 + đích tính trên danh mục cây'
  quyet_dinh: 'chủ kho chọn "Giữ phạm vi K2" (điều phối chuyển lời 18:45Z 25-11): không siết thành "mọi symlink ⇒ not_measured:symlink"'
  mau_2: '.claude/skills/work-packet/SKILL.md mục "Ca symlink Windows native": fixture dựng symlink THẬT phải khai target_is_directory đúng loại, đích dùng "\" trên Windows; không có nhánh bỏ qua'
  ap_dung_mau_2: 'luật ấy áp cho fixture TỰ tạo symlink trên đĩa. Fixture lk2…lk7 không làm thế: symlink ghi thẳng vào index (mode 120000), đi qua git archive, và symlink trên đĩa do chính tarfile của nền tạo trong MÃ SẢN PHẨM — phần ấy đo hành vi của nền, không phải fixture. Chỉ _D2B_NEN tự tạo symlink trên đĩa: "gop" (tới thư mục x1; nay có target_is_directory=True) và "dich" (tới tệp ci.yaml); cả hai đích không chứa "/"'
mo_hinh_khong_phai_windows: >-
  Móc git_loi="tep" thay os.walk trong tiến trình: mọi mục của danh sách thư mục là symlink được chuyển sang danh sách tệp (đúng thu=['sub'] tep=['d']
  điều phối đo). Nó KHÔNG tạo symlink loại tệp và KHÔNG mô phỏng việc isdir trả False. Một đột biến bị giết dưới mô hình này chứng minh chốt không
  dựa vào cách os.walk xếp; nó không chứng minh hành vi trên Windows.
