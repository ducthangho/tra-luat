quyet_dinh_thiet_ke_can_reviewer_soi:
  - 'Chốt K2-theo-cây chỉ xét symlink TRỎ THƯ MỤC. Symlink *.yaml để module bắt như cũ: module hỏi is_symlink() trên từng tệp *.yaml, và một symlink *.yaml trỏ thư mục thì hoặc nằm trong danh sách thư mục (module bắt) hoặc bị chốt mới bắt.'
  - 'Phép chuẩn hoá đích là VĂN BẢN (posixpath.normpath), chọn có chủ ý để không hỏi nền. Lập luận không bỏ sót: mọi symlink phân giải được tới thư mục kéo theo một symlink trong cùng có đường đi toàn thư mục thật, với nó normpath trùng phép phân giải của nền.'
  - 'Gốc bản bung được tính là thư mục ("."): đích ../../.. từ thư mục provenance trỏ đúng gốc; bộ lọc data không ném với đích ấy (Linux 3.13.18 đo qua ca lk6; Windows 3.12.10 điều phối đo 18:41Z).'
  - 'Chốt chỉ nằm ở nhánh passed. Nhánh miễn không gọi K2 và kiem_mien không dùng os.walk.'
  - 'Thêm `import posixpath` (dòng ngoài khối D2b): os.path trên Windows là ntpath, đổi "/" thành "\".'
he_qua_windows:   # viết TRƯỚC khi có M3; điều phối sau đó đo d5a7d85 tập trung trên Windows: 135/135 (issuecomment-7172185200)
  - 'lk4 (d → sub, link tạo trước đích): chốt mới tính trên cây ⇒ rc 12 symlink, không phụ thuộc loại nền gắn cho d.'
  - 'lk6 (len → ../../..) và lk7 (e → sub/<thư mục>; c → e): đích chứa "/" nên nền coi là treo; chốt mới tính trên cây ⇒ rc 12 symlink. readlink trả nguyên chuỗi (điều phối đo), nên luật nội dung không đỏ.'
  - 'Năm biến thể mô hình chạy được trên Windows (os.walk bị thay trong tiến trình) nhưng không phải bằng chứng Windows.'
  - 'Máy không tạo được symlink: mọi biến thể đánh dấu sym (nay 13) tự chuyển kỳ vọng sang rc 8 danh mục; một lượt xanh trên máy ấy KHÔNG đo chốt mới.'
  - 'Ca dừng ở biến thể lệch ĐẦU TIÊN, nên một ca đỏ che các biến thể sau nó.'
chua_do_duoc:
  - 'Windows: chỉ có lượt TẬP TRUNG của điều phối trên d5a7d85 (135 ca); full suite, bộ đột biến và luật 9 chưa chạy trên Windows.'
  - 'Python 3.12 trên Linux: mọi phép đo ở 3.13.18.'
  - 'Hai lệnh git branch -r --contains và cat-file chạy trên object store cục bộ: không chứng minh remote THẬT còn giữ oid lúc chạy.'
  - 'Đột biến NGOÀI bộ toán tử của quet_dot_bien.py và ngoài các đột biến khai báo.'
  - 'Bản ghép d5a7d85 với master mới: chỉ đo merge-tree, không chạy gate.'
  - 'Tài liệu ngoài write set vẫn ghi "D1–D4" cho kiem-dong-wp (ADR-0060 mục Cưỡng chế, bảng §20 protocol).'
