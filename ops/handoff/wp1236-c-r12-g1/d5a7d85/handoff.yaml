    cach_va_chung: >-
      K2 hỏi CÂY trước khi hỏi đĩa. Nhánh passed, sau ba luật của lượt 3 và trước kiem_tep: tro = { posixpath.normpath(join(dirname(t), readlink(t)))
      cho mọi mục 120000 }; thu_cay = { mọi mục 040000 của `ls-tree -r -t` } ∪ { "." là gốc bản bung }. Giao khác rỗng ⇒
      kiem_tep:not_measured:symlink, không gọi module. readlink đã được luật nội dung ghim bằng băm blob ngay trước đó, nên phép tính chỉ dùng dữ
      liệu của cây. Chuỗi symlink không cần mã riêng: nếu một symlink phân giải tới thư mục qua symlink khác thì symlink trong cùng của chuỗi trỏ
      THẲNG tới thư mục (mọi thành phần trên đường đi của nó là thư mục thật, nên normpath văn bản tính đúng) và tự nó có mặt trong giao.
    phep_kiem_dong: >-
      ca cong_d2b_c4_symlink 29 biến thể. Bảy biến thể mới: năm biến thể mô hình nen_bung_symlink_thu_muc_thanh_tep[lk4|lk6|lk7|lk3|lk5] (os.walk
      xếp symlink trỏ thư mục vào tệp; lk3 = YAML symlink vẫn do module bắt, lk5 = đối chứng rc 0) và hai biến thể không mô hình
      symlink_tro_thu_muc[lk6|lk7]. Bốn đột biến d2b_k2_*: tin_dia (bỏ chốt = hành vi dbe650d) · bo_goc · dich_tho (không ghép thư mục chứa symlink)
      · moi_symlink (coi mọi symlink là trỏ thư mục). Ma trận (gate/ma_tran_c4.log) cho biết biến thể nào bắt đột biến nào; gate/m3_mo_hinh.log chạy
      bộ test này trên mã dbe650d (đỏ ở biến thể mô hình lk4, cổng trả rc 0) và trên mã d5a7d85 (đạt).
    chua_do_duoc:
      - 'Windows native trên d5a7d85: điều phối đã chạy TẬP TRUNG (135/135, issuecomment-7172185200); full suite và đột biến trên Windows: chưa chạy. Chưa có phép đo nào trên Windows cho thấy một đột biến của chốt mới bị giết ở đó'
      - 'đích có ".." đứng SAU một thành phần là symlink hoặc không tồn tại: normpath văn bản có thể coi là thư mục thứ mà nền coi là treo ⇒ chặn thừa (rc 12). Không có ca; trên Python có bộ lọc data viết lại đích (3.13.18 đã đo ở lượt 3) các đích ấy đã ra rc 8 từ luật nội dung'
      - 'Python 3.12.10 trên Windows không viết lại đích symlink như 3.13.18 (suy từ phép đo của điều phối: readlink giữ nguyên "../../../a"); hệ quả cho ca nen_viet_lai_dich_symlink không đổi vì ca ấy tự viết lại đích'
      - 'symlink có đích tuyệt đối hoặc thoát thư mục bung: không soạn ca'
