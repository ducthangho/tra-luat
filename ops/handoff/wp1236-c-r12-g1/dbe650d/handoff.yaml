  - 'Luật tên trùng khoá chạy TRƯỚC khi bung (chỉ cần danh mục git): cây có hai tên trùng khoá ra rc 8 trên mọi nền, kể cả Linux phân biệt hoa/thường — tức phán quyết không phụ thuộc nền chạy.'
  - 'Phạm vi ba luật là CẢ thư mục ops/land/<x>-provenance của oid (cả nhánh passed lẫn miễn), kể cả mục không liên quan tới validator. Đo trên origin/master: 0 nhóm trùng khoá trên 11056 mục của ops/land (cả thư mục), và 73/73 tệp đánh giá thật cho kết quả giống hệt ứng viên lượt 2.'
  - 'Dấu chấm cuối KHÔNG bị thêm vào miền cấm của E3 (đổi miền là đổi quyết định chủ kho): nền nào bỏ dấu chấm cuối khi ghi thì luật danh mục bắt (rc 8), nền nào giữ thì không có gì để chặn.'
  - 'Các điểm của lượt 1–2 không đổi: lệch bản bung là rc 8 (dụng cụ đo hỏng, không phải biên bản); git() phân lệnh hỏi/lệnh đo; tarfile filter="data" cần Python ≥ 3.12; D2b chỉ chạy khi D1 đạt; module nạp lười.'
