      `44 bước / 4 skipped` rồi **ghi nhầm số bước 44 thành 43** cũng cho đúng cặp đang xét.
      Cùng họ: trộn hai lần đọc khác nhau, hoặc chép tay sai một chữ số.
      Sai lầm phương pháp: bản trước lấy chính con số `43` **đang tranh cãi** làm chuẩn chắc chắn
      để loại mọi khả năng ghi chép sai. Không có nguồn nào chứng minh `43` được ghi đúng, cũng
      không có nguồn nào chứng minh hai số đến từ CÙNG một lần đọc.
      Nói cho đúng mức: phản ví dụ trên là **khả năng logic**, KHÔNG phải lời khai rằng chuyện ấy
      đã xảy ra. Nên trạng thái đúng là **CHƯA LOẠI ĐƯỢC GIẢ THUYẾT NÀO**, không phải "đã loại".
    nguyen_nhan_that_su: >-
      **CHƯA XÁC ĐỊNH.** Các giả thuyết còn sống, không cái nào bị loại: (a) đọc giữa chừng lúc job
      còn `in_progress`; (b) đọc nhầm sang job Ubuntu kèm một lỗi ghi chép; (c) trộn hai lần đọc;
      (d) chép tay sai. Thời điểm điều phối thực sự gọi API KHÔNG được ghi ở đâu, nên cửa sổ
      `00:04:53Z → 00:11:17Z` (384 s = 6,4 phút) chỉ là **khoảng KHỚP TỪNG CON SỐ** cho giả thuyết
      (a), không phải sự việc đã quan sát. Nó còn giả định thêm rằng thời điểm một bước kết thúc
      trùng với thời điểm API hiển thị `conclusion` của bước ấy — mệnh đề đó cũng chưa đo.
      Cặp đo trước/sau của run KHÁC (`34176439015`) chỉ chứng minh **cơ chế (a) có thể xảy ra**,
      không chứng minh nó đã xảy ra ở run `34169756563`.
      Đủ căn cứ để ĐÍNH CHÍNH CON SỐ; KHÔNG đủ căn cứ để chốt nguyên nhân. Hai việc khác nhau.
    bai_hoc: >-
      Chỉ đọc số bước và số `skipped` khi `status == "completed"`; job `in_progress` phải trả
      KHÔNG ĐO ĐƯỢC, không được trả một con số. Cùng họ bài học "cổng VẮNG MẶT trông giống cổng
      XANH" của `CLAUDE.md`, đổi đối tượng: một phép đo CHƯA XONG trông giống một phép đo ĐÃ XONG,
      vì cả hai đều trả về một con số hợp lệ. Chốt rẻ và luôn dùng được: đếm luôn số bước có
      `conclusion: null` và đòi nó bằng **0**.
      ĐÃ RÚT một câu ở đây: bản trước kết "trong ca này nó khác 0 và tự tố cáo phép đo". Không có
      response nào của lần đọc CŨ được lưu, nên **không ai biết lần đọc ấy thấy bao nhiêu bước
      `null`** — câu đó là suy từ giả thuyết (a) rồi kể lại như dữ liệu.
      Và bài học THỨ HAI, đắt hơn, rút từ chính khối này: **loại một giả thuyết bằng một con số
      thuộc chính lời khai đang nghi ngờ là không loại được gì.** Muốn loại (b) thì cần nguồn độc
      lập về lần đọc cũ — không phải một phép trừ trên số do chính lần đọc ấy sinh ra.
    rut_lai_mot_khang_dinh: >-
      Bản trước ghi run `pull_request` là phép đo trên **exact head** `17f4a1b`. **Rút.**
      Lượt `pull_request` chạy trên cây MERGE TỔNG HỢP, không phải commit `17f4a1b`; run gắn nhãn head
      ấy không chứng minh checkout/test đúng commit ấy. Vậy exact head **chưa có** bằng chứng CI riêng.
    canh_bao_doc_ket_qua: >-
      Lượt `pull_request` chỉ có **MỘT job** (ubuntu) — đúng cái bẫy `plat-x8-land-evidence.yaml` đã ghi.
      Windows chỉ xuất hiện trên lượt `push` của merge commit, tức SAU khi merge.
      CI xanh **KHÔNG** đóng nợ "head `17f4a1b` chưa qua cross-review".
    dinh_chinh: >-
      Bản đầu tệp này khai CI **KHÔNG ĐO ĐƯỢC** vì "bộ công cụ chỉ có 44 tool, không có nhóm
      workflow/actions". SAI, và sai theo đúng lớp lỗi `CLAUDE.md` đã ghi thành luật: *"Đếm SỰ CÓ MẶT
      của một đường thay vì KHẢ NĂNG của nó"* và *"phải thử ít nhất HAI client trước khi gọi đó là
      chính sách."* `CLAUDE.md:583` nêu thẳng `/mcp/x/actions` là endpoint RIÊNG; điều phối chưa thử
      đã tuyên. Probe sau đó trả 4 công cụ.
  - ten: 'head đã vào master'
    ket_qua: '`git merge-base --is-ancestor 17f4a1b origin/master` ⇒ ĐÚNG. master = `802fc01`, hai cha = `b416830` + `17f4a1b`.'
  - ten: 'nhánh không còn commit ngoài master'
    ket_qua: '`rev-list --count origin/master..claude/soan-spec-3-viec-treo-20260906` ⇒ **0**'
  - ten: 'bộ lease trên master, có actionlint đúng bản ghim'
    ket_qua: '`rc=0` · **121/121 đạt; đã chạy=121, bỏ qua=0** · 71 s · out 8649 B. actionlint 1.7.7 cài bằng `ops/cai_actionlint.sh`.'
    ghi_chu: >-
      Đây là lần `t33_workflow_dang_lease_phai_qua_actionlint` được ĐO THẬT trên master. Trong
      full-gate trước merge nó ĐỎ vì thiếu công cụ, nên suite khi ấy là 120/121.
  - ten: 'doc-claims-check trên master'
    ket_qua: '`rc=0`, `ok: true`, out 70861 B'
    dieu_kien_do: >-
      **CON SỐ BYTE PHỤ THUỘC MÔI TRƯỜNG — đo lại có thể ra khác mà không ai sai.** `70861 B` đo trên
      kho thiếu 23 tag. Trên kho ĐỦ tag: **70854 B**, lệch đúng 7 byte, `rc=0`/`ok: true` không đổi.
      Nguyên nhân đã truy: SHA `1835b46` (trong `docs/KE_HOACH_RASOAT_HOSO_ORCHESTRATION.md:39`) nằm
      trên tag `archive/dlbrut-ke-hoach-dau`. Kho thiếu tag ấy phân loại nó
      `SHA_NOT_A_COMMIT_IN_HISTORICAL_DOC`; kho đủ tag phân loại `SHA_NOT_REACHABLE_FROM_HEAD` —
      chuỗi ngắn hơn 7 ký tự. Cả hai vẫn là finding nên `rc` không đổi.
      Phát hiện khi đối chiếu cổng nền↔sandbox của cross-review #478 lượt 4: `rc` KHỚP ở cả hai vế
      nhưng output KHÔNG giống hệt byte — tức phép so `rc` một mình KHÔNG phân biệt được hai môi
      trường. Nêu điều kiện đo ở đây vì một con số không ghi điều kiện thì sẽ trôi mà không ai biết.
      GHI CHÚ CHO NGƯỜI ĐO LẠI: phép canh mù mà `CLAUDE.md` quy định dùng `ls-remote --heads`, tức
      **chỉ phủ `refs/heads`** — nó trả "0 mù" trên chính kho đang thiếu 23 tag. Muốn tái lập
      `70854 B` thì phải fetch cả `refs/tags/*` trước.
  - ten: 'mọi manifest trong ops/reviews trên master'
    ket_qua: >-
      13 manifest, **0 hỏng**. Chi tiết: 9 gói kiểm trực tiếp `rc=0`; lượt 12 và 13 kiểm theo ánh xạ
      `DOC-MANIFEST.md` ⇒ **178/178** và **48/48**; lượt 11 kiểm qua `manifest11-layout/` của gói 12
      ⇒ **128/128**; `bundle-PROMPT.sha256` là băm trần không có tên tệp nên `sha256sum -c` không
      phân tích được — so trực tiếp với `bundle-PROMPT.md` ⇒ KHỚP `e60c376a…`.
    canh_bao_doc_ket_qua: >-
      Chạy `sha256sum -c` từ chính thư mục manifest KHÔNG dùng được cho **4** tệp — nhưng vì
      **HAI nguyên nhân KHÁC NHAU**, đừng gộp. Không tệp nào là hỏng băm.
      · **3 tệp** (lượt 11, 12, 13): `-c` phân tích được record rồi báo `OK=0/N` với **N > 0**, vì
      manifest ghi bố cục SANDBOX của reviewer (`VERDICT.md`, `do-review13/…`) còn trong kho tệp đã
      đổi tên và làm phẳng. Kiểm theo ánh xạ `DOC-MANIFEST.md` thì ĐẠT (128/128 · 178/178 · 48/48).
      · **1 tệp** (`pr468-hoso-4-packet-review-13-codex/bundle-PROMPT.sha256`): KHÔNG ra `OK=0/N`
      chút nào — nó là **băm trần không có tên tệp**, nên `sha256sum -c` không phân tích được
      record NÀO. Đo được: `rc=1`, stdout RỖNG, stderr
      `sha256sum: bundle-PROMPT.sha256: no properly formatted checksum lines found`.
      Đây là lỗi ĐỊNH DẠNG của phép kiểm, không phải lệch bố cục. So trực tiếp ⇒ KHỚP `e60c376a…`.
      ĐÍNH CHÍNH: bản trước khai cả 4 ra `OK=0/N` và quy cả 4 về nguyên nhân bố cục — sai ở tệp thứ
      tư, dù THÂN mục `ket_qua` ngay trên đã nhận đúng nó là băm trần. Đúng bệnh "vá phần THÂN, để
      nguyên KHUNG". Cross-review #478 lượt 4 bắt (`land-evidence-dem-bon-goi-doi-bo-cuc`).
      Phiên điều phối đã một lần suýt báo kho hỏng vì phép kiểm sai này.

