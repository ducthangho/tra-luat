giai_mau_thuan_4_vs_6_skipped:
  van_de: >-
    `ops/land/pr468-hoso-4-packet-land-evidence.yaml` (đang ở PR #478) ghi một
    `mau_thuan_chua_giai`: điều phối đọc **4 skipped** cho job `gate (windows-latest)` trên merge
    commit `802fc01`, trong khi cross-review #478 lượt 2 phân tích tĩnh `.github/workflows/ci.yml`
    và đếm **6** bước có `if` sai trên tổ hợp push/master/windows.
  nay_giai_duoc: >-
    **Reviewer đúng, điều phối sai — và sai vì ĐỌC GIỮA CHỪNG.** Job Windows của run
    `34176439015` lúc đang chạy hiển thị `43 bước, 1 skipped`; khi chạy XONG nó là
    **44 bước, 6 skipped**. Bước chưa chạy tới thì `conclusion` còn `null`, nên phép đếm
    `conclusion == "skipped"` giữa chừng cho số THẤP HƠN thực tế.
    Con số **6** khớp đúng phân tích tĩnh của reviewer.
  bai_hoc: >-
    Đếm `skipped` trên một job `in_progress` là phép đo SAI, không phải phép đo thiếu. Chỉ đọc
    số bước/skipped khi `status == "completed"`.
  viec_phai_lam: >-
    Sửa `mau_thuan_chua_giai` trong land evidence của #468 (nhánh `claude/land-468-20260908`,
    PR #478) theo kết quả này. Phiên tiếp nối `session_01C52eS8AgeiwTrDifXGDGYP` đang giữ nhánh
    ấy — việc thuộc về nó, tệp này chỉ ghi lại phép đo để nó khỏi phải đo lại.

