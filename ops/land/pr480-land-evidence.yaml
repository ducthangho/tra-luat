        và không ai gọi `workflow_dispatch`, lượt `push` sau merge là lần đo Windows ĐẦU TIÊN của mã
        đó. Bỏ chờ nghĩa là nếu Windows đỏ, ta biết MUỘN HƠN — không phải không biết.
      - >-
        PHẦN KHÔNG ĐỔI: mọi cổng chạy TẠI CHỖ ở `post_merge_checks` phía trên vẫn chạy đủ và vẫn là
        điều kiện của land. Bỏ chờ CI không nới bất kỳ cổng nào khác.

# --- KHÔNG ĐO ĐƯỢC ---
khong_do_duoc:
  - muc: 'CI trên merge commit'
    ly_do: >-
      CỐ Ý không đo — chủ kho bỏ bước chờ đọc CI hậu-merge. Run vẫn chạy tự động; không ai đọc nó
      trong hồ sơ này. Xem `post_merge_checks` mục cuối.
  - muc: 'Người bấm merge là NGƯỜI hay PHIÊN'
    ly_do: 'GitHub không có trường phân biệt. Điều phối tự khai là phiên gọi API.'
  - muc: 'Nguồn thô cho mọi số API (merge, review, CI)'
    ly_do: 'Kho không kèm JSON thô. Mọi số ấy là attestation của điều phối.'
  - muc: 'Nội dung thật của hai comment bản chiếu trên GitHub'
    ly_do: >-
      REST tới `repos/…` bị proxy chặn 403 từ container này; đường đọc MCP tự chuẩn hoá thực thể
      HTML nên `diff` qua nó chỉ tìm được lệch VỀ KÝ TỰ THẬT, không khẳng định được byte.
  - muc: 'Model đã phục vụ và `thread_id` của hai lượt review'
    ly_do: '`run.json` không lưu argv; `codex` không phát `modelUsage`.'
  - muc: 'Kho nông và log A/B gốc của điều phối'
    ly_do: 'Không có trong gói. Tiền đề master đỏ đã bị rút; phần chưa đối chứng là môi trường lịch sử, không phải mâu thuẫn cổng còn mở.' 

