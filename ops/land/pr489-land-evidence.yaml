chuoi_land_evidence_DA_DONG_THEO_QUYET_DINH_CHU_KHO:
  chuoi_day_du: '#468 → #478 → #486 → #487 → #489 → #490 (CHÍNH TỆP NÀY) — DỪNG'
  mat_xich_thu: 6
  mat_xich_thu_7: KHONG_TON_TAI
  van_de_da_gay_ra_chuoi: >-
    THÓI QUEN, KHÔNG PHẢI QUY TẮC — và bản trước của dòng này viết ngược. Nó khai "land evidence
    PHẢI vào kho qua một PR, mà PR ấy LẠI CẦN land evidence" như thể là luật. Quét lại toàn kho:
    KHÔNG có luật ấy. `PROTOCOL:466-488` định nghĩa schema bản ghi và đòi bằng chứng bền;
    `ADR-0034:17-21` đòi hậu-merge gate và bookkeeping — KHÔNG chỗ nào đòi một PR KẾ NHIỆM cho
    chính bản ghi land evidence. Việc mỗi mắt xích lại sinh mắt xích sau là do CÁCH LÀM của các
    phiên trước, không do doctrine. Codex connector chấm đúng chỗ này (P2 `Remove the invented
    recursive-PR requirement`) trên `a48f576`, và nó ĐÚNG.
    Chi phí mỗi mắt xích thì ĐO ĐƯỢC thật: một lượt CI (~24 phút runner), một lượt duyệt của
    người khác, và ít nhất một lượt cross-review (~16 phút cộng một hạn mức API).
  quyet_dinh:
    nguoi_quyet: ducthangho
    ngay: '2026-09-09'
    nguyen_van: 'merge #490, tôi cho phép land mà không cần CI, đóng chuỗi'
    loai_nguon: >-
      Chỉ thị trực tiếp trong phiên điều phối. KHÔNG có hiện vật GitHub cho câu này ⇒ ATTESTATION;
      thứ ĐO ĐƯỢC là hệ quả của nó (merge commit của #490, và sự VẮNG MẶT của một PR land evidence
      cho #490).
  hai_dieu_duoc_mien:
    - muc: 'CI cho bước land của #490'
      pham_vi: >-
        MIỄN. Không chờ và không đòi lượt CI nào cho việc land tệp này. Đây là mở rộng của quyết
        định đã có từ trước trong phiên (bỏ chờ CI hậu-merge), nay áp cả cho tiền kiểm của #490.
    - muc: 'PR land evidence cho chính #490'
      pham_vi: >-
        MIỄN. Chuỗi dừng tại đây; #490 KHÔNG sinh mắt xích thứ 7. `merged` của #490 là kết cục
        cuối cùng của tuyến hồ sơ này.
  cai_KHONG_duoc_mien: >-
    Duyệt khác danh tính. Ràng buộc cứng của chủ kho — *"Merge chỉ khi: duyệt khác danh tính trên
    ĐÚNG head + gate xanh + đã cross-review"* — nêu CI và duyệt là HAI điều kiện TÁCH BIỆT, nên
    miễn CI KHÔNG miễn duyệt. Cổng `cong` (`.claude/dev/duyet_danh_tinh.py`) cưỡng chế đúng điều
    kiện ấy và nó KHÔNG phải một cổng CI: nó không chạy test nào, chỉ đếm bản duyệt hợp lệ. Điều
    phối KHÔNG tự nới nó, và KHÔNG dùng quyền admin để đi vòng.
  he_qua_do_duoc_cua_viec_dong_chuoi: >-
    KHÔNG cổng nào đỏ vì chuỗi dừng. Đo được: `rg -l "ops/land"` (trừ chính `ops/land` và
    `ops/reviews`) ⇒ 2 tệp, cả hai là VĂN BẢN; `packet_loop.py` có 17 lệnh con và KHÔNG lệnh nào
    kiểm land evidence — chuỗi `landed` chỉ xuất hiện trong 2 chuỗi MÔ TẢ danh sách trạng thái.
    Thứ mất là cho NGƯỜI ĐỌC, không phải cho máy.
  no_moi_sinh_ra_tu_quyet_dinh_nay:
    slug: quyet-dinh-dong-chuoi-chua-vao-doctrine
    mo_ta: >-
      Quyết định này hiện CHỈ nằm trong tệp land evidence. `ADR-0034` vẫn định nghĩa `landed` cần
      "bookkeeping", nên phiên sau đọc doctrine vẫn phải GHI bookkeeping — điều đó không đổi.
    dinh_chinh_ban_truoc: >-
      Bản trước viết thêm: "KHÔNG tệp doctrine nào nói bookkeeping của một PR hồ sơ THUẦN được
      MIỄN PR riêng" — câu ấy đọc sự VẮNG MẶT của một miễn trừ thành sự TỒN TẠI của một yêu cầu.
      Đó là lỗi NGƯỢC của chính lỗi vừa rút ở `van_de_da_gay_ra_chuoi`: cả hai đều biến thói quen
      thành luật. Không cần miễn trừ cho một thứ chưa từng bị đòi.
    vi_sao_de_xuat_ADR_KHONG_con_la_cach_chua_duy_nhat: >-
      Nếu doctrine chưa từng đòi PR kế nhiệm thì một `ADR-0046` miễn trừ là THỪA: không có luật
      nào để nới. Cách rẻ hơn và đúng hơn là ghi rõ trong protocol rằng bookkeeping của một PR có
      thể nằm TRONG chính PR ấy hoặc trong PR kế tiếp — làm cho điều đã đúng trở nên ĐỌC ĐƯỢC,
      thay vì cấp ngoại lệ cho một quy tắc tưởng tượng. Phiên sau chọn đường nào cũng phải ĐO
      trước: đi tìm câu doctrine thật sự đòi PR riêng; KHÔNG tìm thấy thì đừng viết ADR miễn trừ.
    vi_sao_dang_ghi_thay_vi_lam_ngay: >-
      Sửa doctrine là hành vi QUẢN TRỊ (`ADR-0034` đòi impact analysis + human approval), và nếu
      đi đường ADR thì kéo theo cập nhật bảng §20 kẻo `adr-song` ĐỎ. Chủ kho bảo "đóng chuỗi",
      KHÔNG bảo "sửa doctrine". Điều phối làm đúng phần được giao và KHAI phần chưa làm, thay vì
      tự mở rộng phạm vi vào chỗ doctrine. `CLAUDE.md` đã ghi: nơi các ca đi chết là
      prompt/README — nên nợ này được ghi Ở ĐÂY chứ không chỉ trong hội thoại.

