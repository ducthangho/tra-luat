    ngoai_write_set: true
  - slug: cong-receipt-chua-dinh-nghia-cay-dang-merge
    trang_thai: MANG_SANG
    mo_ta: >-
      Cổng receipt đọc cây trên đĩa nhưng xét quan hệ tổ tiên từ `HEAD`, nên cây đang merge cho
      kết quả đỏ hợp đồng mà khó đọc.
    ngoai_write_set: true
  - slug: gate-master-do-lai-cay-trung-bam
    trang_thai: MOI
    mo_ta: >-
      Khi merge là fast-forward về nội dung, những BƯỚC LẶP LẠI của chân `ubuntu-latest` ở lượt
      master đo lại một cây KHÔNG khác một byte so với cây lượt PR đã đo xanh. Đo được ở chính
      lần land này: `tree(e82af37) == tree(99aef14) == e307ea31`. Chưa có cổng nào cắt những
      bước lặp ấy.
    pham_vi_HEP_co_chu_dich: >-
      Nợ này KHÔNG đề xuất cắt CẢ chân ubuntu. Chân ấy còn chạy hai bước mà lượt PR bỏ qua
      (`tl selftest` có bằng chứng exact-identity, và `release-verify strict` lane LAND); cắt cả
      chân là mất luôn hai bước đó. Phát biểu rộng hơn phép đo chính là finding mà cross-review
      lượt 1 và lượt 2 đã chấm ở đúng chỗ này.
    chua_co_packet: true
  - slug: khong-cong-nao-doc-ops-land
    trang_thai: MOI
    mo_ta: >-
      Nợ schema/URL uỷ quyền; giữ slug lịch sử, không hiểu nó là không cổng nào đọc thư mục.
      Đo trên `8802924`: grep `ops/*.py`, `.claude/dev/*.py`, `scripts/tl_core/*.py`,
      `.github/workflows/*.yml` cho `ops/land` và `land_operator` ⇒ 0 nơi. Phép tìm literal
      không đo đủ phạm vi đọc: tại cùng SHA, `eol-policy survey` trong `ci.yml` chạy
      `python .githooks/eol_policy.py --all --json`, đọc blob trong index và kiểm EOL của cả
      9 tệp `ops/land/*.yaml`, gồm tệp #493. Kiểm EOL không xác minh schema hay URL uỷ quyền.
      Phản chứng bỏ dòng `authorization_url` trên bản sao r370 vẫn cho `bien_nhan_v2` ĐẠT.
      Việc khoản thiếu đi qua gate PR, gate master và 11 lượt cross-review rồi được connector
      nêu sau merge là ATTESTATION của phiên điều phối; gói không có đầy đủ log các lượt đó.
      Không suy từ việc không báo finding thành cả 11 lượt đều chưa đối chiếu schema.
    chua_co_packet: true
  - slug: quyet-dinh-dong-vong-lap-review-chua-vao-doctrine
    trang_thai: MOI
    mo_ta: >-
      "Đóng vòng lặp cross-review theo quyết định chủ kho khi P1=P2=0 nhưng P3 còn" hiện CHỈ nằm
      trong tệp land evidence này và trong `r360`. Không doctrine nào nói khi nào được dừng.

