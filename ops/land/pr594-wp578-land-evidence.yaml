      NO BO viec neu ten head cu the trong van xuoi (kieu "head sau X"), thu se loi thoi moi ban va.
      NO KHONG BO nghia vu them mot entry cho head cha o MOI ban va — luat khong tu sinh du lieu.
      Nen LOP NAY KHONG DONG DUOC BANG VAN BAN chung nao con va: moi ban va sinh mot head chua co CI.
