# ══════════════════════ VI PHAM 3 — VUOT TRAN TRUC LOI GOI CODEX (§12) ══════════════════════
VI_PHAM_3_VUOT_TRAN_TRUC_LOI_GOI:
  co_vi_pham: true
  dieu_khoan: 'PROTOCOL §12 d.1011-1013 nguyen van: "Hai lượt Codex review trên cùng PR là một stop condition riêng của
    review budget. Review Rescue Checkpoint được kích hoạt khi chạm trần này hoặc khi PR chạm trần vòng review canon
    của `ADR-0043` mà chưa approve. Chạm checkpoint không tự biến Packet thành thất bại nội dung và không cho phép gọi
    thêm bằng prompt/phiên khác để lách trần."; d.1015-1018: "State giữ riêng `codex_review_calls_used`,
    `codex_executor_calls_used` và `review_rounds_used`. `codex_review_calls_used` tăng khi launcher có bằng chứng lời
    gọi review đã bắt đầu sinh output/token, kể cả timeout hoặc output sai schema; tối đa hai trên một PR. Lỗi
    preflight, permission denial hoặc rate-limit trước khi model sinh output không tăng bộ đếm này."; d.1021: "Đổi
    prompt, session hay tên attempt không reset các bộ đếm." ADR-0048 d.9-12 nguyen van: "nó tách ba trục VÒNG (canon,
    kỷ luật) · LỜI GỌI (chi phí) · ATTEMPT (số lần tuyên bố DONE), giữ các trần độc lập, và giữ luật trần chạm trước
    thắng. Hai trục kia **KHÔNG đổi** theo ADR này: `codex_review_calls_used` giữ nguyên trần của nó"; ADR-0043 d.5-6:
    "Trục VÒNG (canon, kỷ luật) tách khỏi trục LỜI GỌI (chi phí) và trục ATTEMPT (số lần tuyên bố DONE); các trần độc
    lập và trần chạm trước thắng."'
  su_that: 'PR #601 co SAU review codex, ca sau deu sinh output that (API pulls/601/reviews do ~2026-09-21T17:58Z: moi
    review state COMMENTED, than "Codex Review ... Reviewed commit", kem inline finding — API pulls/601/comments):
    5267880804 tren 9387078 14:33:10Z (3 inline); 5268963910 tren 85559f0 16:09:34Z (4); 5269144128 tren 7becd26
