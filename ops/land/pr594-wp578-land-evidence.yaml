      ma moi ban va sinh mot head moi voi CI moi — nen mot DANH SACH head luon cham dung mot head va
      chi day du sau ban va CUOI CUNG. Vong 8, 9 va 10 deu bat dung mot cho nay (head e6eabed, roi
      b246aac, roi e20edde), moi lan va bang cach them mot dong — va lan sau lai thieu head ke tiep.
      Doi sang LUAT la cach dong ca LOP, giong nhu doi DEM sang LIET KE o
      gate_registry_bi_huy_LIET_KE_khong_dem_tran.
