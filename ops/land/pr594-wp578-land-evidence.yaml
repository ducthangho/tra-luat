      SO NAY KHONG PHAI TIEU CHI HOAN TAT. No la nhat ky chan doan cua mot su co CI da dong. Khong muc
      nao trong CON_THIEU_DE_GOI_LANDED phu thuoc vao no. Noi thang ra vi ba vong review vua qua deu xu ly
