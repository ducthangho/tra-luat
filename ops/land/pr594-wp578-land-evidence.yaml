      lan thu ba. Ban vong 11 tuyen "dong ca lop"; Fable vong 12 bac, va bac DUNG: chinh ban ay de ba
      head (b246aac, e20edde, 06724b1) NGOAI dien_bien_do_duoc, tuc vi pham luat ngay luc dat luat.
      Ban vong 12 nay tra ca ba vao danh sach, va TUYEN LA BAN VA CUOI: CI cua chinh no va cua 4128fe9
      theo CAU TAO khong bao gio duoc khai o day.
      SUA LUAT O VONG 15 — vi luat tren TU NO sinh ra mot vong lap khong ket thuc. Luat doi mot entry cho
      head CHA; moi ban va sinh mot head moi, nen head cha doi theo va so lai thieu dung mot entry. Vong 7
      bat thieu 662a032; vong 14 them 662a032; vong 8 bat thieu f07fcf21 — cung mot lop, lan thu BA, va
      moi lan deu do chinh ban va truoc sinh ra. CLAUDE.md va §12 deu noi: hinh dang lap lan thu ba thi
      cau hoi dung la "co nen tiep tuc cach nay khong", khong phai "va the nao".
      LUAT MOI, thay luat cu: so nay CHOT TAI MOT EXACT SHA duoc neu ro o khoa `chot_tai_sha` ngay duoi.
