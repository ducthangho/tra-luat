# HO SO LAND — PR #621 "docs(skill): ba bai hoc co hoc da do" (adapter .claude/skills/cross-review + work-packet).
# Schema chuan: docs/PROTOCOL_DA_PHIEN.md §7 (land evidence tach approval khoi thao tac), §13.1 (evidence truoc/sau land).
# Duong dan ops/land/*-land-evidence.yaml la QUY UOC THUC TE (tien le pr718 #678, pr707 #705, pr703 #674).
#
# TRANG THAI: merged (3fc0932). Gate hau-merge 3fc0932 XANH 14/14 (run 37942714195). `landed` o tep nay = false:
# theo tien le, `landed: true` chi co hieu luc tu merge commit cua PR ghi so KE TIEP, sau khi chu kho quyet cac diem
# not_measured duoi day. "merged" KHONG dong nghia "landed" (PROTOCOL §10.2.4).
# NHAN: measured = do lai trong phien ghi so (lenh ghi kem) VA `kiem_ho_so.py --repo <clone> --tu-kiem` doi TUNG cum chu so cua la do ma bo kiem DO
# bang MOT CHOT (khong do vi traceback). Pham vi tu-kiem: la co chu so trong nut `trang_thai: measured` hoac chuoi mo dau `measured`. NGOAI pham vi:
# khoa tuong thuat (lenh, mo_ta, pham_vi, ghi_chu, dinh_chinh, nguon, readback, checkout, vai_tro, hien_vat, kiem_bang_may — xem _TUONG_THUAT); la KHONG co chu so;
# chuoi khong mo dau bang `measured` (vd trang_thai_packet.landed_ly_do, khong_do_duoc[*].mo_ta, pre_merge_checks[0..2].moc); khoi khong gan nhan (bookkeeping,
# uy_quyen.*, human_audit.assurance_dat/ghi_chu). Cac khoi nay chi co chot rieng cho MOT SO su that (kiem_ho_so.py), KHONG duoc --tu-kiem chung minh. Toan tu
# tu-kiem chi doi CHU SO: doi TU (success/OWNER/push/ci.yml) trong la measured KHONG bi thu. pre_merge_checks[0..2].{event,run_attempt,head_sha,workflow} co chot rieng.
# MAU THAN comment quyet dinh chu kho (kiem_ho_so.py than_sai; moi muc MOT dong rieng, KHONG kem dau backtick): `Reviewed commit: <40 hex head cua PR ghi so>`;
# ba dong `MOC-WORKFLOW-DEFINITION: chap_nhan <4 run id cach nhau dau phay>`, `RC-SO-CHI-CO-STEP-CONCLUSION: chap_nhan <...>`, `CHECKOUT-IDENTITY: chap_nhan <...>`;
# mot dong `assurance_dat: chap_nhan`. THAN CHI GOM cac dong mau do (bat dau o cot 0) va dong trong; DUOC: CRLF, dau cach cuoi dong, thu tu dong bat ky, run cach `,` hoac `, `.
# TU CHOI CA THAN moi dong khac (van xuoi, dau danh sach, thut, khoi rao, trich dan, HTML, in dam, lien ket...) va moi ky tu ngoai ASCII in duoc (BOM, NBSP, tab, CR don,
# U+2028, chu co dau, ky tu vo hinh): y kien viet bang loi dat o MOT COMMENT KHAC. Comment phai do CHINH chu kho dang
# (khong qua app), khong sua sau khi dang.
# thuat_lai = so lieu cua luot review, khong tai chay;
# not_measured = khong do duoc, ghi ly do.
# Readback tho: ops/land/pr621-skill-bai-hoc-provenance/ (SHA256SUMS.txt). Kiem nhat quan ho so <-> hien vat:
# `python -I ops/land/pr621-skill-bai-hoc-provenance/kiem_ho_so.py [--repo <clone day du>]`. Moi phep do REST: `gh api <duong dan>` (GET,
# client GitHub dung san cua Claude Code qua proxy phien). Log job KHONG tai trong ho so nay.

