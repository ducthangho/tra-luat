workflow_definition_nguon: >-
  BYTES: measured_nguon_thay_the; commit nguon chinh xac: not_measured (xem GIOI HAN OID) — KHONG phai WorkflowRun.file (GraphQL 403). PROTOCOL §10.2.2 cho dung nguon khac khi tu chung
  minh cung run/attempt va exact definition identity. Hai phan chung minh:
  (a) IDENTITY BYTES: blob cua ci.yml (6ba1255…) va launcher-windows.yml (24b5516…) GIONG HET tai MOI commit ung vien
  GitHub co the doc dinh nghia: base ceb1a3f, head bf63bb1, synthetic merge 511612f (event pull_request), merge f8a7829
  (event push) — do bang git rev-parse <commit>:<path> + sha256 bytes. ci.yml doi lan cuoi o 6f2b0f9 (27-09),
  launcher-windows.yml o f568e34 (05-09); ca hai deu la to tien cua moi commit ung vien. Vi vay du GitHub doc o commit nao trong bon commit ay, bytes dinh nghia la mot.
  (b) GAN VAO DUNG RUN/JOB: doi_chieu_buoc.py so than `run:` cua tung buoc trong dinh nghia (tai f8a7829) voi than
  buoc log cua CHINH job/attempt in ra (dong ESC[36;1m), theo thu tu: 10/10 job khop het (gate PR 28/28 buoc chay,
  gate master 27/27, gate-ops 8/8, gate-packet-loop 8/8, gate-registry 8/8, launcher windows 11/11, ubuntu 7/7; cac buoc
  con lai bi `if:` bo qua). Phan chung dot bien: sua MOT dong trong ban sao log gate master => all_in_order false,
  21/27. Gioi han: (b) chung minh noi dung buoc da chay khop dinh nghia, KHONG chung minh bytes ngoai than buoc (trigger,
  comment); phan ay dua vao (a).
  GIOI HAN OID: (a) va (b) chung minh BYTES dinh nghia, KHONG phan biet GitHub da doc tu commit nao trong bon commit
  ung vien (doi ref doc dinh nghia tu f8a7829 sang ceb1a3f cho ket qua giong het — Codex #670 luot 1 N2). Vi vay
  commit_nguon_chinh_xac = not_measured. Chu kho chap nhan nguon thay the VOI gioi han nay: bytes dinh nghia da do,
  OID nguon chinh xac khong do duoc.
