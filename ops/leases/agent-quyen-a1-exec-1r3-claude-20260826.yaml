phep_do_moi_cua_luot_nay: >-
  N1 ĐÃ ĐO XONG — điều kiện dừng S1 KHÔNG bắn, và đây là thay đổi thực chất so r1 (r1 còn ghi
  "CHƯA đo `agent_type` … mới chỉ đọc tài liệu"). Cách đo: bơm tạm một dòng ghi payload vào
  chính `pretooluse_guard.py` (điểm bơm duy nhất có hiệu lực NGAY — hook config chỉ nạp lúc mở
  phiên), phóng subagent `tl-auditor` thật, rồi khôi phục bằng `git checkout --` và kiểm băm blob
  khớp `origin/master` từng byte. Bắt được 3 payload:
    payload 1-2  subagent tl-auditor   agent_type = "tl-auditor"   agent_id = a39b7feeddc8766cd
    payload 3    Bash cua PHIEN CHINH  agent_type = KHOA KHONG TON TAI
  Hai hệ quả, cả hai đều là chân đứng của thiết kế: (a) `agent_type` có thật và bằng đúng tên
  agent; (b) phiên chính THIẾU HẲN khoá chứ không phải để rỗng, nên luật "vắng mặt ⇒ phiên chính"
  phân biệt được thay vì đoán. Phép đo tự mang đối chứng — payload 3 là vế đối chiếu, không phải
  suy luận. Kèm một quan sát thứ ba: `git status --porcelain | wc -l` tới hook NGUYÊN CẢ CHUỖI có
  ống, xác nhận allow-list đọc cả chuỗi không dính bẫy tiền tố của #314.
  (4) BA LỖ tìm bằng PHÉP RÀ ĐỐI NGHỊCH, chạy SAU khi suite đã xanh 8/8 — nên chúng cũng là bằng
  chứng rằng một suite xanh KHÔNG chứng minh không còn lỗ:
    echo hi<LF>cp /tmp/x scripts/tl.py   ALLOW   `shlex` whitespace_split NUOT xuong dong, hai
                                                 lenh gop thanh MOT doan, chi chuong trinh DAU
                                                 (`echo`) bi kiem
    git log -1<LF>sed -i ...             ALLOW   cung nguyen nhan
    cat <(cp /tmp/x scripts/tl.py)       ALLOW   `_boc_thay_the` chi xu `$(` va backtick, bo sot
                                                 thay the tien trinh
  Đã vá cả ba; đo lại 13/13 hình dạng tấn công `DENY`, đối chứng hợp lệ vẫn `ALLOW`. Khoá bằng
  `m8` `m9` và `m10`, trong đó `m10` phải GHÉP hai chốt (heredoc + tách dòng) mới giết được —
  riêng lẻ thì hai lớp độc lập che nhau nên đột biến đơn SỐNG. Đó không phải test yếu; doctrine
  đã ghi đúng ca này ("phải đột biến ghép cả bốn").

