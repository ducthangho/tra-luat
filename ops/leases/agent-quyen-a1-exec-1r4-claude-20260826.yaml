  `sort`/`uniq`/`diff`/`ruff` · `sed` và `awk` BỎ khỏi danh sách cho phép (ngôn ngữ có lệnh ghi
  riêng, không phân tích tin cậy được bằng chuỗi) · `git branch`/`tag` đòi dạng LIỆT KÊ tường
  minh. Đo lại 0/11 lọt, 8 ca dương vẫn `allow`, CA 10/10, ĐỘT BIẾN 13/13.
  Kèm một chốt BỊ BỎ vì đột biến chứng minh nó không có răng: nhánh riêng cho `<>`/`>&` là thừa.

