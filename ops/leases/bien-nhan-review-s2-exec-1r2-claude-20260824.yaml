viec_cua_luot_nay: >-
  B2 — lệnh con `bien-nhan`: đếm biên nhận `role: reviewer` theo packet, một định nghĩa
  duy nhất. B3 — chính lệnh ấy THOÁT KHÁC 0 khi số đếm dưới ngưỡng (mặc định 1), và
  fail-close khi KHÔNG ĐO ĐƯỢC (thiếu thư mục trong kho thật, YAML hỏng). Kèm ca phản chứng
  cho từng nhánh. KHÔNG làm B1 — đã xong ở slice 1, write set khác.

canh_bao_cho_nguoi_thi_hanh: >-
  (1) BA trạng thái, không phải hai: có · không · KHÔNG ĐO ĐƯỢC. Trạng thái thứ ba phải làm
  cổng ĐỎ, không được trả 0 lặng lẽ — "0 biên nhận" và "không đọc được thư mục" nhìn giống
  hệt nhau nếu trả cùng một số. (2) Phải có ca chứng minh cổng đếm ĐÚNG TRỤC: một biên nhận
  `role: executor` KHÔNG được tính. Thiếu ca ấy thì cổng đang đếm TỆP chứ không đếm VAI, và
  không ai biết. (3) `packet_id` trong kho có hai dạng đang sống — slug (`wp55`) và số
  (`'249'`); so bằng chuỗi và chấp cả `packet_slug`.

chua_do_duoc_luc_cap: >-
  (1) B3 bắt được ca "0 biên nhận". Ca "ghi 1 biên nhận cho 4 vòng" nó KHÔNG bắt, và chưa có
  cách đo số vòng THẬT mà không cần mạng — `packet_loop.py` có 0 đường ra GitHub. Khai
  thẳng phạm vi thay vì đặt tên cổng to hơn thứ nó cưỡng chế. (2) Chưa quét toàn bộ packet
  lịch sử xem còn bao nhiêu packet có 0 biên nhận — đo được hai, không suy ra chỉ hai.

