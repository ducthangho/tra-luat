      lần thứ hai. Cross-review lượt 2 (`ed2988d`) tìm được BA lỗ, cả ba đã tái hiện độc lập
      bằng phản chứng chạy được TRƯỚC khi vá, `rc=0` ở nơi phải `rc=11`:
      (F1a) `verdict_path` TUYỆT ĐỐI trỏ ra ngoài kho vẫn được tính — `pathlib` định nghĩa
      `a / "/x"` == `Path("/x")`, vế trái bị VỨT, nên bộ lọc mồ côi hoá ra hỏi về chính tệp
      ngoài kho; (F1b) SYMLINK trong `ops/reviews/` trỏ ra ngoài cũng đạt vì `is_file()` đi
      theo liên kết; (F2) hai biên nhận cùng THIẾU `reviewed_sha` đếm thành HAI vòng, vì khoá
      khử trùng rơi về `f"__khong_sha__{tên tệp}"` — tức lại đếm theo TỆP, đúng khuyết tật
      lượt 1 đã nêu, chỉ dời sang nhánh không ai nghĩ tới; (F3) `--toi-thieu 0` và `-1` cho
      `rc=0`, tức cổng TẮT được bằng chính cờ của nó.
      Bản vá tốn `+121` dòng (`packet_loop.py` 125→169, `packet_loop_test.py` 199→276): một
      hàm `_verdict_trong_kho` neo đích cuối vào cây thay vì hỏi sự tồn tại, một sàn cho
      `--toi-thieu`, và BỐN ca phản chứng mới — kèm chiều BẮT OAN cho mỗi ca.
      Trần mà chặn việc VÁ FINDING thì nó đang thưởng cho packet không bị soi kỹ.
