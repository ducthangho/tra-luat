  NGỜ — nếu định ghi, hãy nêu lệnh và output thật.
  (3) Bạn đang sửa cổng thẩm quyền ghi. Một cổng CHẶN OAN còn tệ hơn không có cổng. Chiều
  bắt-oan của (A) — nhánh cục bộ ĐI TRƯỚC remote phải QUA — là bắt buộc, không phải tuỳ chọn.
  (4) ĐỪNG viết chuỗi bỏ-qua-CI nguyên văn ở bất cứ đâu.
