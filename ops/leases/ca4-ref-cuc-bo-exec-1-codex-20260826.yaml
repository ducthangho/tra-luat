canh_bao_cho_nguoi_thi_hanh: >-
  (1) SANDBOX MOUNT `.git` CHỈ ĐỌC — không commit, không push.
  (2) RIG ĐÃ ĐƯỢC DỰNG SẴN hiện tượng (A): trong `cay/` có một nhánh cục bộ CỐ Ý tụt sau đối
