viec_cua_luot_nay: >-
  HAI khuyết tật của `ai-dang-giu`, cả hai đã xảy ra THẬT với phiên điều phối.

  === (A) NGƯỜI-GIỮ-MA từ nhánh CỤC BỘ tụt sau ===
  `_quet_lease_toan_kho` quét cả `refs/heads/*`. Một nhánh cục bộ sót lại từ worktree cũ, tụt
  sau đối ứng remote, làm `ai-dang-giu` báo NGƯỜI_GIỮ cho một lease ĐÃ bị thay thế.
  Đo được: `refs/heads/ops/cap-lease-t33-doi-shellcheck` ở `1bb5fc8` trong khi
  `refs/remotes/origin/…` ở `d4facdb` ⇒ `rc=11`; `git branch -f` cho khớp ⇒ `rc=0` NGAY, không
  đổi gì khác. Đây là lỗi RIG làm cổng fail-close CHẶN NHẦM việc hợp lệ.
  THEO D4 ĐÃ CHỐT: khai rõ trong output rằng nó quét `refs/heads/*`, và **CHẶN** khi một nhánh
  cục bộ tụt sau `origin/<cùng tên>`, nêu ĐÍCH DANH nhánh + lệnh chữa.
  ĐỪNG chữa bằng cách bỏ `refs/heads/*` khỏi phạm vi quét — nhánh cục bộ CHƯA ĐẨY là chỗ lease
  mới nhất nằm; bỏ nó là mở đúng lỗ mà nợ `SO-LEASE-KHONG-NAM-MOT-CHO` đã tố cáo.

  === (B) ĐẾM TRÙNG: `NGƯỜI_GIỮ` là số (lease × ref), không phải số LEASE ===
  `lenh_ai_dang_giu` làm `nguoi_giu.append(lease_id)` KHÔNG khử trùng. Cùng một lease nằm trên
  hai ref được đếm thành HAI người giữ.
  Đo được: `ai-dang-giu ops/specs/LAUNCHER-DUNG-WORKSPACE-r3.md` trả `NGƯỜI_GIỮ 5`, trong đó
  `launcher-r3-va-p1p2-exec-1r7-codex-20260824` xuất hiện HAI LẦN — một từ
  `refs/heads/ops/cap-lease-launcher-r3-va-r5`, một từ `refs/remotes/origin/…`.
  VÁ: khử trùng theo `lease_id`. Con số phải là số LEASE.
  CẨN THẬN: khử trùng KHÔNG được che mất ca (A) — hai ref có cùng `lease_id` nhưng NỘI DUNG
  khác nhau (một bản tụt sau) vẫn phải làm cổng kêu theo (A).

  MỖI ca phải có phản chứng HAI CHIỀU và đột biến RIÊNG:
    · (A) chặn đúng khi nhánh cục bộ tụt sau; KHÔNG chặn khi nhánh cục bộ khớp hoặc ĐI TRƯỚC
      remote (nhánh chưa đẩy là hợp lệ — đây là chiều bắt-oan, thiếu nó thì cổng chặn oan mọi
      phiên đang làm việc).
    · (B) cùng lease trên hai ref đếm MỘT; hai lease KHÁC NHAU vẫn đếm HAI.
  Đột biến gỡ từng chốt phải làm ca đích ĐỎ.

