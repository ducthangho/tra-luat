viec_cua_luot_nay: >-
  MỘT việc. Không phải góp ý — có phản chứng chạy được, và nó đã xảy ra THẬT trong ngày.

  === LỆNH CHỮA MÀ CỔNG IN RA KHÔNG CHẠY ĐƯỢC KHI NHÁNH BỊ MỘT WORKTREE GIỮ ===

  Lượt 1 dạy `ai-dang-giu` CHẶN khi nhánh cục bộ tụt sau, và in đích danh lệnh chữa:

      git branch -f <ten> refs/remotes/origin/<ten>

  Lệnh ấy **thất bại** khi nhánh đang được một linked worktree checkout — kể cả có `-f`:

      $ git worktree add /tmp/ca4wt ops/cap-lease-t33-doi-shellcheck
      $ python3 ops/lease_publish.py ai-dang-giu ops/lease_publish.py
      CHAN [12]: NHÁNH_CỤC_BỘ_TỤT_SAU: ops/cap-lease-t33-doi-shellcheck. … chữa: git branch -f …
      rc=12
      $ git branch -f ops/cap-lease-t33-doi-shellcheck refs/remotes/origin/ops/cap-lease-t33-doi-shellcheck
      fatal: cannot force update the branch '...' used by worktree at '/tmp/ca4wt'
      rc=128

  VÌ SAO NẶNG HƠN "CHẶN OAN": một cổng chặn oan còn để người dùng một lối ra. Cổng này chặn,
  cho ĐÚNG MỘT lối ra, và lối ấy trả `rc=128`. Người dùng làm đúng y lời nó dặn và VẪN KẸT.
  Đó là NGÕ CỤT, không phải phiền phức.

  VÀ NÓ KHÔNG HIẾM: phiên điều phối chạy thường trực nhiều linked worktree, và đã vấp đúng lỗi
  này SÁNG NAY trên hai nhánh (`wt313`, `wt313b`) TRƯỚC khi review tồn tại. Trạng thái "origin
  vừa đi tiếp trong lúc một worktree đang giữ nhánh" là trạng thái BÌNH THƯỜNG của một phiên
  đang làm việc.

  PHẢI LÀM:
    · Đọc `git worktree list --porcelain` để biết nhánh nào đang bị worktree nào giữ.
    · Khi nhánh tụt sau ĐANG BỊ GIỮ: in lệnh chữa KHÁC — fast-forward ngay trong worktree ấy
      (`git -C <đường-dẫn-worktree> merge --ff-only <origin ref>`), hoặc bảo detach worktree
      trước rồi mới `git branch -f`. NÊU ĐÍCH DANH đường dẫn worktree.
    · Khi nhánh KHÔNG bị giữ: giữ nguyên lệnh `git branch -f` hiện tại — nó đúng và đã được
      reviewer chạy thật.

  CA KHOÁ — hai chiều, và cả hai đều phải CHẠY ĐƯỢC LỆNH ĐƯỢC IN RA:
    · nhánh tụt sau, KHÔNG bị worktree giữ ⇒ in `git branch -f`, và ca phải CHẠY nó rồi đòi
      `rc=0` + ref khớp origin;
    · nhánh tụt sau, ĐANG bị worktree giữ ⇒ in lệnh khác, và ca phải CHẠY nó rồi đòi `rc=0`
      + ref khớp origin. **Đây là điểm cốt lõi: ca phải THI HÀNH lệnh, không chỉ so chuỗi.**
      So chuỗi thì bản vá "in một câu khác" cũng xanh, mà câu ấy vẫn có thể không chạy được.

  ĐỘT BIẾN BẮT BUỘC: đưa lệnh chữa trở lại `git branch -f` VÔ ĐIỀU KIỆN phải làm ca thứ hai
  ĐỎ. Không có đột biến ấy thì không biết ca đang đo lệnh chữa hay đo một hằng số.

  ĐỪNG mở lại (A)/(B) của lượt 1 — cả hai đã đúng, đã có răng, đã qua cross-review và đã xanh
  cả hai nền CI. Đừng đụng bảy ca `t102`–`t108` ngoài việc thêm ca mới.
  DƯ LƯỢNG PHÂN KỲ (#326) KHÔNG thuộc lượt này — đừng vá kèm.

