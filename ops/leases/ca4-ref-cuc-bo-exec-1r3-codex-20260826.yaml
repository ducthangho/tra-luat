viec_cua_luot_nay: >-
  MỘT việc, và nó là một QUYẾT ĐỊNH THIẾT KẾ chứ không phải một bản vá nữa.

  === ĐẾM HÌNH DẠNG: NĂM LẦN, MỘT HÌNH DẠNG ===

  Cùng một lỗi đã hiện ra năm lần, mỗi lần ở một trạng thái worktree khác:

    connector          nhánh bị worktree giữ        `branch -f` -> rc=128
    review r2 · #1     worktree `prunable`          `git -C <đường-dẫn-chết>` -> rc=128
    review r2 · #2     HAI worktree cùng nhánh      rc=0 nhưng worktree KIA thành `M  x`
    review r2 · #3     bẩn xung đột · merge · rebase  rc=1 · rc=128 · rc=128

  Ca cuối ác nhất: khi rebase dở dang, porcelain báo **detached**, nên nhánh BIẾN MẤT khỏi
  `dang_giu`, cổng quay về đúng `git branch -f` cũ — tức bản vá r2 TỰ RƠI LẠI vào ngõ cụt của r1.

  `CLAUDE.md`: "cùng một hình dạng lỗi lặp ba lần trở lên thì câu hỏi đúng là CÓ NÊN LÀM VIỆC
  NÀY KHÔNG, không phải VÁ THẾ NÀO."

  SAI Ở QUYẾT ĐỊNH GỐC: cổng đang cố phát MỘT LỆNH THI HÀNH ĐƯỢC CHO MỌI TRẠNG THÁI. Đó là
  một DANH SÁCH CẤM các trạng thái hỏng, và tập ấy chưa cạn — còn worktree bare, quyền ghi,
  đường dẫn ký tự lạ, submodule…

  === PHẢI LÀM: ĐẢO THÀNH DANH SÁCH CHO PHÉP ===

  Cổng chỉ in MỘT LỆNH CHẠY ĐƯỢC khi nó CHỨNG MINH ĐƯỢC trạng thái an toàn. Điều kiện đủ,
  tất cả phải đúng:
    · nhánh bị giữ bởi ĐÚNG MỘT worktree (đếm theo danh sách, không phải `dict` last-wins);
    · worktree ấy SỐNG — không `prunable`, đường dẫn tồn tại;
    · worktree ấy SẠCH — `git status --porcelain` rỗng;
    · KHÔNG có thao tác đang dở (merge/rebase/cherry-pick/bisect) — nhận diện bằng metadata
      per-worktree, KHÔNG chỉ bằng trường `branch` của porcelain (ca rebase làm nó báo detached).
  Và ca nhánh KHÔNG bị worktree nào giữ thì giữ nguyên `git branch -f` — nó đúng và đã đo.

  MỌI TRẠNG THÁI KHÁC: **KHÔNG IN LỆNH**. In CHẨN ĐOÁN — nhánh nào tụt sau, worktree nào đang
  giữ, ở TRẠNG THÁI GÌ — cộng câu nói rõ người đọc phải tự xử lý (commit/stash, hoàn tất hoặc
  huỷ thao tác đang dở, dọn entry stale, detach bớt worktree) rồi CHẠY LẠI cổng.
  Cổng vẫn `rc=12`, vẫn fail-close. Nó chỉ THÔI HỨA một điều nó không kiểm được.

  ĐÂY KHÔNG PHẢI BẢN VÁ CÙNG HÌNH DẠNG THỨ SÁU: nó không THÊM một trạng thái vào danh sách,
  nó BỎ LỜI HỨA sinh ra cả họ lỗi. Tập trạng thái an toàn HỮU HẠN và kiểm được; tập trạng thái
  hỏng thì không. Và nó BỚT đường mã chứ không thêm.

  TUYỆT ĐỐI KHÔNG: tự `stash`, `reset`, `abort`, `prune`, hay bất kỳ thao tác nào đụng vào
  công việc của người dùng. Cổng CHẨN ĐOÁN, người dùng QUYẾT ĐỊNH. Một cổng tự dọn worktree
  của người khác là thứ tệ hơn nhiều so với một lệnh chữa không chạy được.

  === CA KHOÁ ===

  Chiều CHO PHÉP (in lệnh, và ca phải THI HÀNH lệnh ấy rồi so ref):
    · nhánh không bị worktree nào giữ  -> `git branch -f`, rc=0, ref khớp origin  (giữ `t109`)
    · nhánh bị ĐÚNG MỘT worktree sống+sạch+rảnh -> lệnh trong worktree, rc=0, ref khớp (giữ `t110`)

  Chiều TỪ CHỐI (KHÔNG in lệnh; ca phải khẳng định output KHÔNG chứa một lệnh chạy được, và
  CÓ nêu đích danh worktree + trạng thái):
    · worktree `prunable`      · HAI worktree cùng nhánh
    · worktree bẩn xung đột    · đang merge      · đang rebase (chú ý: porcelain báo detached)

  ĐỘT BIẾN BẮT BUỘC — mỗi cái phải làm ĐÚNG ca của nó ĐỎ:
    · bỏ kiểm `prunable`  · thu danh sách worktree về "last wins"  · bỏ kiểm sạch
    · bỏ kiểm thao-tác-đang-dở  · in lệnh vô điều kiện như r2

  ĐỪNG mở lại (A)/(B) của r1 và đừng đụng `t102`-`t108`.
  DƯ LƯỢNG PHÂN KỲ (#326) KHÔNG thuộc lượt này.

