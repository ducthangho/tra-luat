quyet_dinh_mac_dinh_nguoi_giu_co_the_doi: >-
  BỐN quyết định thiết kế do phiên điều phối CHỌN MẶC ĐỊNH, đã trình người giữ kho. Executor
  thi hành theo mặc định; nếu người giữ đổi thì sẽ có lease sửa đổi, ĐỪNG tự chọn khác.
  D1 quét ngược = CHỈ BÁO CÁO, không tự sửa lease đã đăng. Lý do: lease đã đăng là hồ sơ
     đóng băng; tự ghi vào đó là đúng thứ kho đã cấm ("sửa đè làm hồ sơ mất dấu").
  D2 biên hợp lệ của ca 1 = chỉ soi tên trường THUỘC SCHEMA LEASE. Lease nhắc tên trường của
     tài liệu KHÁC (ví dụ bàn về `spec_path` của một spec) là HỢP LỆ và không được chặn.
     Phải có ca phản chứng cho ĐÚNG tình huống này, nếu không cổng sẽ chặn oan.
  D3 ca 3 = TỪ CHỐI lúc đăng, KHÔNG tự ghi `da_bi_thay_the` vào lease cũ. Cùng lý do D1.
  D4 ca 4 = FAIL-CLOSE (chặn), kèm thông điệp nêu ĐÍCH DANH nhánh cục bộ tụt sau và lệnh chữa.
     Lý do: một người-giữ-ma chặn oan việc hợp lệ, còn im lặng thì mở cửa cho writer thứ hai —
     sai cả hai chiều, nên phải kêu.

viec_cua_luot_nay: >-
  BA CA, THEO ĐÚNG THỨ TỰ NÀY. Hết ngân sách thì dừng và khai ca còn lại.

  === CA 1 (BẮT BUỘC) — con trỏ treo trong lease ===
  Tên trường xuất hiện trong văn bản một lease (dạng `` `ten_truong` ``) mà KHÔNG có định
  nghĩa `^ten_truong:` trong CHÍNH tệp ấy ⇒ ĐỎ ở `check`.
  Ca thật đã xảy ra: `vung_duoc_phep_cham` định nghĩa ở `launcher-r3-va-p1p2-exec-1r3`, bị XOÁ
  ở `r4`, mà `r4` vẫn nhắc nó HAI lần. Con trỏ nằm im hai revision rồi CHẶN THẬT một lượt
  executor ở `r5`. Đo lại được: `grep -c '^vung_duoc_phep_cham:'` so `grep -c 'vung_duoc_phep_cham'`
  trên từng revision cho 0/0 · 0/0 · 1/2 · 0/2 · 0/2.
  Kèm D2 (biên hợp lệ) — và ca phản chứng cho biên ấy là BẮT BUỘC, không phải tuỳ chọn.
  Kèm quét ngược MỘT LẦN theo D1: một chế độ chỉ-đọc liệt kê mọi lease CÒN HIỆU LỰC đang mang
  con trỏ treo. Chỉ báo cáo.

  === CA 3 (NÊN) — bia mộ hai bước, bước hai không có cổng ===
  Lease mới khai `thay_the_cho: X` mà `X` chưa mang `da_bi_thay_the` ⇒ `check` TỪ CHỐI (D3),
  thông điệp nói rõ phải thêm dòng ấy vào `X`.
  Vì sao có ca này: phiên điều phối đăng hai bia mộ đúng mẫu, `check` rc=0, workflow `success`,
  và THA ĐƯỢC SỐ KHÔNG — vì workflow chỉ ghi `posted_comment_id`, không ghi `da_bi_thay_the`.
  Bước thứ hai chỉ sống trong một dòng CHÚ THÍCH của mẫu bia mộ. Đo được: sau khi đẩy `8a10f85`,
  cả hai lease cũ vẫn 0 lần nhắc trường ấy, và `ai-dang-giu` vẫn `rc=11`.

  === CA 4 (NÊN) — `ai-dang-giu` đếm cả ref CỤC BỘ, nên nhánh cũ đẻ người-giữ-ma ===
  `_quet_lease_toan_kho` quét cả `refs/heads/*`. Một nhánh cục bộ sót lại từ worktree cũ, tụt
  sau đối ứng remote, làm `ai-dang-giu` báo NGƯỜI_GIỮ cho một lease ĐÃ bị thay thế.
  Đo được: `refs/heads/ops/cap-lease-t33-doi-shellcheck` ở `1bb5fc8` trong khi remote ở
  `d4facdb` ⇒ `rc=11`; `git branch -f` cho khớp ⇒ `rc=0` ngay, không đổi gì khác.
  Theo D4: khai rõ trong output rằng nó quét `refs/heads/*`, và CHẶN khi một nhánh cục bộ tụt
  sau `origin/<cùng tên>`, nêu đích danh nhánh + lệnh chữa.
  ĐỪNG chữa bằng cách bỏ `refs/heads/*` khỏi phạm vi quét — nhánh cục bộ CHƯA ĐẨY là chỗ lease
  mới nhất nằm; bỏ nó đi là mở đúng lỗ mà `SO-LEASE-KHONG-NAM-MOT-CHO` đã tố cáo.

  MỌI CA phải có phản chứng chạy được trong `ops/lease_publish_test.py` VÀ một đột biến giết
  được ca đích. Ca không có răng thì thà không có.

