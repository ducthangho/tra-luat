viec_cua_luot_nay: >-
  LƯỢT 2 — đóng HAI finding của cross-review vòng 1 trên PR #316
  (`verdict: changes_requested`, reviewed_sha `20cdc43be37eccf346e28aeaabadfe706d49dafd`).

  KHÔNG mở lại ca 3 (bia mộ hai bước) — reviewer đo `8/0`, `0/8`, `0/8` trên HEAD, local
  branch khác và `refs/remotes/origin/*`, kết luận ĐẠT cho mọi branch ref cục bộ.
  KHÔNG mở lại tính chỉ-đọc của lệnh `con-tro-treo` — reviewer đo fingerprint lease và
  `git status` trước/sau, cả hai KHÔNG đổi. ĐẠT.

  === P1 `chan-oan-va-lot-theo-cach-viet` — HỎNG CẢ HAI CHIỀU, một nguyên nhân ===

  `_cac_con_tro_treo` chạy regex trên TOÀN BYTE YAML, không theo cấu trúc. Reviewer dựng từ
  ĐÚNG MỘT lease nền `rc=0` rồi chỉ đổi một hình dạng văn bản mỗi lần:

    CHẶN OAN (rc=8 mà lẽ ra 0):
      comment YAML có `vung_duoc_phep_cham`        -> rc=8   (parser không coi comment là dữ liệu)
      code-span nói rõ là tên biến minh hoạ        -> rc=8
    BỎ LỌT (rc=0 mà lẽ ra 8):
      `Vung_Duoc_Phep_Cham`  (đổi hoa)             -> rc=0
      `vùng_được_phép_chạm`  (có dấu)              -> rc=0
      văn xuôi, không code-span                    -> rc=0

  Đây là tầng cưỡng chế thẩm quyền ghi. Một lease HỢP LỆ bị từ chối là P1 — chặn oan còn tệ
  hơn không có cổng, vì nó dạy người ta đi vòng.

  HƯỚNG VÁ — CHỦ KHO ĐÃ CHỐT, đừng tự chọn hướng khác:
    Bỏ quyết định-chặn dựa trên quét raw-text. Thay bằng MỘT CẤU TRÚC THAM CHIẾU MÁY ĐỌC ĐƯỢC,
    và CHỈ chặn cấu trúc ấy. Văn xuôi mơ hồ KHÔNG còn là căn cứ chặn — nó chuyển sang lệnh
    `con-tro-treo` dưới dạng ADVISORY (báo, không chặn).
    Tối thiểu bắt buộc: loại comment bằng parser/token YAML, không bằng cắt chuỗi tay.
    CẤM chữa bằng danh sách ngoại lệ theo câu chữ — kho đã trả giá cho "danh sách CẤM không
    bao giờ đủ"; một allowlist prose là đúng cái bẫy ấy ở dạng khác.

  BA CHỐT PHẢI CÓ, cả hai chiều:
    (a) comment YAML và code-span tên-biến-minh-hoạ  -> rc=0   (không chặn ca tốt)
    (b) tham chiếu MÁY ĐỌC ĐƯỢC mà thiếu khoá        -> rc=8   (vẫn chặn ca xấu)
    (c) trường đã có định nghĩa                       -> rc=0
  ĐỘT BIẾN: đưa scanner trở lại quét toàn byte, VÀ bỏ phép kiểm tham chiếu thật — mỗi cái
  phải làm ca đích ĐỎ, và phải là hai mutant TÁCH RIÊNG (dương/âm không gộp).

  Sửa luôn `t99`: ca hiện tại ĐÓNG ĐINH hành vi chặn oan (đặt `phai_qua=False` cho chuỗi đang
  bàn trường của tài liệu khác). Một ca test khoá sai hành vi thì nó bảo vệ cái sai.

  === P2 `con-tro-treo-mutant-song` — ca thứ ba KHÔNG CÓ RĂNG ===

  `t99` khẳng định `"TREO" in s`. Nhưng dòng tổng kết `CON_TRỎ_TREO 0` LUÔN chứa chuỗi ấy,
  nên ca không thể đỏ. Reviewer đo: đột biến vòng quét của `lenh_con_tro_treo` thành tập RỖNG
  -> vẫn `82/101`, đúng 19 đỏ nền, KHÔNG có dòng `ĐỎ t99`, và bộ mutant vẫn in `2/2`.
  Tức lời khai "ba ca mới có răng" CHƯA ĐẠT — mới hai.

  VÁ: đọc các DÒNG DỮ LIỆU bắt đầu bằng `CON_TRỎ_TREO<tab>`, đòi ĐÚNG MỘT hàng có cột lease ID
  bằng chính xác giá trị mong đợi, VÀ đòi con số tổng kết bằng 1. Không dùng substring chung
  với dòng header.
  Thêm ĐỘT BIẾN ĐỘC LẬP: đổi vòng quét thành rỗng (hoặc bỏ riêng dòng dữ liệu) phải làm ca lệnh
  ĐỎ, trong khi mutant của ca 1 và ca 3 vẫn được đếm RIÊNG.
  CẨN THẬN: đừng ghim test vào văn phong tiếng Việt của output — chỉ ghim SCHEMA CỘT và ngữ
  nghĩa dedup đã chọn. Ghim câu chữ là dựng một ca sẽ vỡ vì lý do sai.

  KHÔNG đụng tệp ngoài write set. KHÔNG mở lại ca 3 và tính chỉ-đọc.

