viec_cua_luot_nay: >-
  Bốn việc, nguyên văn ở mục "Đây KHÔNG phải thêm hai dòng vào ci.yml" của hồ sơ:
  (1) CHẠY `.claude/dev/mcp_gh_test.py` và `.claude/dev/probe_mang_test.py` trong CI;
  (2) đòi BẰNG CHỨNG DƯƠNG chứ không chỉ `rc=0` — khớp chuỗi tổng kết mong đợi trong `stdout`,
      vì #319 vòng 3 đã cho thấy `rc` và bản in TÁCH RỜI nhau được;
  (3) CHỐNG DANH SÁCH GÕ TAY — `ci.yml` hiện liệt kê từng `_test.py`; thêm hai dòng nữa là tái tạo
      đúng cái lỗ đã sinh ra nợ này. Cần phép liệt kê tự động, hoặc một chốt ĐỎ khi có `_test.py`
      mới KHÔNG nằm trong danh sách;
  (4) PHẢN CHỨNG CHO CHÍNH CỔNG ẤY — tối thiểu hai ca: cổng ĐỎ khi một bộ test bị gỡ khỏi danh
      sách, và cổng ĐỎ khi bộ test in dòng xanh mà mã thoát khác 0 (hoặc ngược lại).

vi_sao_packet_nay_ton_tai: >-
