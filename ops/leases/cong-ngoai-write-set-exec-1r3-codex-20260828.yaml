  Cảnh báo về chính bảng này: phép đo dùng `grep <basename> .github/workflows/*.yml`, tức khớp theo
  CHUỖI chứ không theo LỜI GỌI THẬT, và nó đã hỏng CẢ HAI CHIỀU trong tay phiên điều phối — âm tính
