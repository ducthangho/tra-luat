  · `cach_ly` — bộ test ĐANG ĐỎ ở môi trường CI, đã biết, có nợ CÓ TÊN; nó vẫn được LIỆT KÊ và vẫn
    được CHẠY, chỉ là không chặn.
  Cách ly KHÔNG phải "bỏ ra khỏi sổ". Bỏ ra khỏi sổ là quay lại vô hình — tức xoá đúng thứ packet
  này vừa mua được.

cach_ly_fail_close_hai_chieu: >-
  Đây là phần quyết định, thiếu nó thì cách ly thành NGHĨA ĐỊA:
  (a) Vào cách ly BẮT BUỘC kèm `slug` nợ và LÝ DO ĐO ĐƯỢC. Mục cách ly thiếu một trong hai ⇒ cổng
      ĐỎ. Không cho phép cách ly "trống lý do".
  (b) Bộ đang cách ly mà CHUYỂN XANH ⇒ cổng **ĐỎ**, kèm câu bảo gỡ nó khỏi cách ly. Không có chốt
      này thì một bộ đã tự lành vẫn nằm mãi trong cách ly và không ai biết — cách ly sẽ sống lâu
      hơn nguyên nhân của nó.
  Mỗi chiều (a) và (b) phải có ĐỘT BIẾN RIÊNG làm một ca ĐỎ. Chốt không có mutant là chốt sẽ hở lại.

