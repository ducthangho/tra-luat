viec_1_P1_chuoi_trong_chu_thich_gia_mao_loi_goi_that: >-
  Phép kiểm "CI có thật sự gọi mục này" đang là SO CHUỖI CON trên toàn văn bản YAML nối lại của mọi
  `.github/workflows/*.yml`. Nó không phân biệt một bước `run:` THẬT với một dòng CHÚ THÍCH nhắc lại
  đúng chuỗi lệnh. Reviewer tái hiện: xoá bước thật của `--chay`, để lại chuỗi trong một dòng chú
  thích ⇒ `TỔNG: ĐẠT`, `rc=0`; làm y hệt với một mục `DA_NOI` ⇒ cũng `ĐẠT`.
  Hậu quả đo được: TOÀN BỘ 7 bộ `MOI` và TOÀN BỘ 12 bộ `DA_NOI` có thể ngừng chạy trong CI thật mà
  cổng vẫn xanh — tái tạo NGUYÊN VẸN cái lỗ #319 mà packet này sinh ra để đóng, chỉ bằng một sửa
  đổi trong đúng write set của chính packet.
  ĐÂY LÀ HỌ LỖI KHO ĐÃ TRẢ GIÁ BA LẦN (`[skip` + `ci]` trong thông điệp commit · biểu thức Actions
  trong chú thích · workflow `paths:` không chạy lần đầu). Lần này là biến thể thứ TƯ. Theo §12,
  cùng hình dạng lỗi lặp lại ⇒ soi CÁCH LÀM: câu hỏi không phải "lọc chú thích thế nào" mà **"phép
  kiểm này có đang đọc thứ GitHub thật sự THI HÀNH không"**.
  Executor tự chọn cách. Reviewer ghi một hướng khả dĩ (parse YAML lấy trường `run` của từng step
  thay vì nối văn bản thô) — đó là GỢI Ý, không phải chỉ định; cách nào khác mà ĐO ĐƯỢC là tốt hơn
  thì làm và nói vì sao. Lưu ý PyYAML đã được cổng cài trước bước này, nên phụ thuộc ấy không mới.

