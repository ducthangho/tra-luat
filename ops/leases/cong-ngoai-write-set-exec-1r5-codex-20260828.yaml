  mục cách ly KHÔNG RỖNG — không đòi `moi_truong` phải NẰM TRONG tập giá trị ấy. Một chuỗi lệch,
  kể cả gõ nhầm một chữ, làm `hien_tai != da_neo` đúng ở MỌI nơi, kể cả trên đúng runner CI ⇒ luật
  `(b)` KHÔNG BAO GIỜ thi hành được, kể cả khi bộ test đã xanh thật.
  Nói thẳng phần thuộc về phiên điều phối: r4 là hợp đồng do CHÍNH PHIÊN NÀY viết, và nó tuyên bố
  đóng đúng lỗ này. Đo lại cho thấy nó mới ĐỔI CHỖ lỗ — thêm được cái neo, nhưng không khoá giá trị
  neo. Đây là lỗi thiết kế của phiên điều phối, không phải của executor.
  Yêu cầu: giá trị `moi_truong` phải được kiểm so với tập giá trị mà hàm ấy THẬT SỰ có thể trả về,
  lấy từ một nguồn DUY NHẤT — đừng chép tập ấy ra chỗ thứ hai, vì hai bản chép sẽ trôi khỏi nhau và
