canh_bao_da_tra_gia:
  - >-
    `[skip` + `ci]` trong THÔNG ĐIỆP COMMIT là chốt đặt sai chỗ — nó sống trong LỊCH SỬ và đã tắt
    gate của cả một PR lẫn của master. Packet này sửa CI nên đặc biệt dễ chạm: ĐỪNG viết chuỗi ấy
    nguyên văn vào commit, KỂ CẢ khi đang trích dẫn để giải thích. Muốn nhắc thì tách chữ.
  - >-
    "YAML parse được" KHÁC "GitHub NHẬN". Dấu hiệu bị từ chối là một workflow run mang tên ĐƯỜNG
    DẪN TỆP, 0 job, `conclusion: failure` — không phải một job đỏ. SÁU lượt cross-review từng kết
    luận "YAML ok" vì chỉ kiểm bằng PyYAML, mà PyYAML không biết luật của GitHub. Phải chạy
    `actionlint` THẬT; và nhớ `actionlint` IM LẶNG bỏ toàn bộ luật nền khi thiếu `shellcheck` rồi
    vẫn trả `rc=0` — thiếu công cụ thì phải ĐỎ, không được tự tắt.
  - >-
    ĐỪNG viết cú pháp biểu thức Actions trong CHÚ THÍCH của một khối `run`: GitHub nội suy biểu
    thức trên TOÀN BỘ thân `run` trước khi shell thấy nó, nên một cặp rỗng trong comment làm cả tệp
    không hợp lệ. Kho đã mất một workflow vì đúng dòng comment giải thích chuyện này.
  - >-
    Sau MỌI lần đẩy mà bạn cần một workflow chạy, hãy ĐO là nó đã chạy (`list_workflow_runs` lọc
    theo nhánh), đừng suy từ việc `git push` thành công. Workflow có `paths:` ĐÃ từng không chạy ở
    lần đẩy tạo nhánh mới — nguyên nhân CHƯA BIẾT, đừng chế ra.
  - >-
    Cổng xanh nhờ `rc=0` là cổng CÓ THỂ BỊ LỪA — đòi BẰNG CHỨNG DƯƠNG (`N/N` hai số BẰNG NHAU).
    Đó chính là việc số 2, đừng mắc lại nó trong lúc làm nó.

phan_chung_bat_buoc: >-
