phan_chung_moi_cua_r5: >-
  Hai đột biến RIÊNG, chạy trên BẢN SAO NGOÀI CÂY, mỗi cái làm một ca ĐỎ:
  · xoá một bước `run:` THẬT nhưng giữ nguyên chuỗi lệnh trong một dòng chú thích ⇒ cổng phải ĐỎ
