  hơn nguyên nhân của nó — bỏ nó là biến cách ly thành nghĩa địa, tức đúng thứ r3 sinh ra để chặn.
  r4 KHÔNG bỏ `(b)`; nó chỉ gắn cho `(b)` đúng phạm vi mà `(b)` đo được.

phan_chung_moi_cua_r4: >-
