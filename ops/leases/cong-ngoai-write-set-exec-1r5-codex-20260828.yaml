  chiếu log. Không có nó ⇒ cổng ĐỎ (mở rộng chiều `(a)`).
  Luật `(b)` — "cách ly mà chuyển xanh ⇒ ĐỎ" — CHỈ được thi hành KHI ĐANG CHẠY TRONG ĐÚNG MÔI
  TRƯỜNG ẤY. Ở môi trường khác, mục ấy in **`KHÔNG ĐO ĐƯỢC`** và **KHÔNG chặn**.
  Vì sao phải là `KHÔNG ĐO ĐƯỢC` chứ không phải im lặng bỏ qua: đó là TRẠNG THÁI THỨ BA của kho
  (`None ≠ False`). Im lặng bỏ qua thì một cách ly đã hết hạn sẽ không ai thấy ở đâu cả; in
  `KHÔNG ĐO ĐƯỢC` thì người đọc biết chốt ấy CÓ, chỉ là chưa đo được ở đây.

vi_sao_KHONG_bo_han_chieu_b: >-
