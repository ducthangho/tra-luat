luat_pham_vi_ghi_chu: >-
  Lượt 1 dừng theo `S6` vì phép liệt kê trung thực tìm ra hai bản sao lưu trữ, và lease cấm tự dựng
  ngoại lệ. Executor xử ĐÚNG. Phiên điều phối quyết, và quyết theo doctrine đã trả giá của kho:
  **"Danh sách CẤM không bao giờ đủ — phải đảo thành danh sách CHO PHÉP."** Một danh sách loại trừ
  phải đoán trước mọi cách một tệp lạ có thể xuất hiện, nên thua từ trong thiết kế; một danh sách
  cho phép chỉ phải liệt kê một tập nhỏ và biết trước.

luat_pham_vi:
  1_goc_duoc_phep: >-
    Danh sách CHO PHÉP theo GỐC, nhỏ và biết trước. Mọi `*_test.py` nằm dưới các gốc này là
    **TEST SỐNG** và PHẢI được cổng chạy:
      `.claude/dev/` · `.claude/hooks/` · `.githooks/` · `.github/checks/` ·
      `scripts/tl_core/` · `ops/` NHƯNG CHỈ MỨC ĐỈNH, không đệ quy.
    Danh sách này do packet ĐO LẠI trên cây thật rồi chốt, không chép từ đây — con số/tên trong
    lease là ĐO CỦA PHIÊN ĐIỀU PHỐI, không phải chân lý.
  2_ops_reviews_la_kho_hien_vat: >-
    `ops/reviews/**` KHÔNG phải gốc mã nguồn. Đây KHÔNG phải một ngoại lệ ad-hoc mà là phát biểu về
    BẢN CHẤT của thư mục: nó giữ bản sao BẤT BIẾN của bằng chứng review, và `ops/reviews/README.md`
    đã nói `luu-tru/*` là ref bền giữ các commit công bố verdict. Một bản sao LỊCH SỬ không phải mã
    ĐANG CHẠY; chạy nó ở CI là đo một hiện vật đông lạnh rồi tưởng mình đang gác cổng.
    Ghi lý do ĐÚNG MỘT CHỖ, đừng rải ngoại lệ theo tên tệp.
    **ĐÍNH CHÍNH CỦA r5 (finding-02 của cross-review, P2).** r2/r3/r4 khai SAI cơ chế ở đây: chúng
    nói "luật `1` (chỉ mức đỉnh của `ops/`) đã đủ loại hai bản sao ấy về mặt CƠ CHẾ; luật `2` chỉ
    ghi LÝ DO". Reviewer ĐO ngược lại — vô hiệu nhánh kiểm tên thư mục `ops/reviews/` mà giữ nguyên
    luật `1` thì hai tệp ấy KHÔNG được loại êm: chúng rơi vào `la` và cổng bắn `TỔNG: ĐỎ`, `rc=1`.
    Vậy cơ chế THẬT là nhánh kiểm tên thư mục chạy TRƯỚC, và luật `1` KHÔNG tự lo được.
    Vì sao đính chính này quan trọng hơn vẻ ngoài của nó: người đọc tin lời khai cũ sẽ coi nhánh
    `OPS_REVIEWS` là thừa và xoá đi — hồi quy dễ xảy ra ĐÚNG VÌ lý do lease đưa ra để giữ nó lại sai.
    Mã KHÔNG sai; chỉ tài liệu sai. r5 KHÔNG đổi mã ở chỗ này.
  3_fail_close_bon_chieu: >-
    Cổng phải ĐỎ ở CẢ BỐN chiều, không chỉ chiều "thiếu":
      (i)   `*_test.py` dưới gốc được phép mà KHÔNG có trong sổ đăng ký ⇒ ĐỎ;
      (ii)  mục trong sổ mà tệp KHÔNG tồn tại ⇒ ĐỎ;
      (iii) mục trong sổ mà `ci.yml` KHÔNG thật sự gọi ⇒ ĐỎ (đây là chiều bắt được đúng cái lỗ đã
            sinh ra packet: có tên trong sổ mà không ai chạy);
      (iv)  `*_test.py` nằm NGOÀI mọi gốc đã biết VÀ ngoài `ops/reviews/**` ⇒ **ĐỎ**.
    Chiều `(iv)` là thứ giữ cho danh sách cho phép KHÔNG MỤC theo thời gian: một vị trí lạ làm cổng
    ĐỎ và buộc người phải quyết, thay vì bị bỏ qua im lặng. Thiếu `(iv)` thì "danh sách cho phép"
    lại thoái hoá thành danh sách cấm.
  4_hinh_thuc_so_dang_ky_do_executor_chon: >-
    Lease chốt HỢP ĐỒNG (bốn chiều fail-close ở trên), KHÔNG chốt hình thức. Sổ đăng ký là tệp dữ
    liệu hay là mã, sinh tự động hay khai tay — executor tự quyết và tự biện minh.

