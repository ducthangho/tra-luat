  MÃ. Chọn một trong ba KÈM LÝ LẼ ĐO ĐƯỢC: (A) chấp nhận và nói thẳng tại chỗ · (B) loại cả chú
  thích đơn độc, nhưng thế là tạo áp lực xoá thứ có giá trị · (C) cách đếm khác bạn đo ra là tốt
  hơn. KHÔNG chọn (A) chỉ vì hồ sơ liệt kê nó trước.

rang_buoc_bat_buoc: >-
  KHÔNG nới trần để cho vừa việc (4). Nếu sau khi đổi luật đếm mà vẫn không đủ chỗ cho
  `try`/`finally` thì DỪNG và BÁO — đó là finding về chính trần MỚI.
  Trần cũ `900` là con số của LUẬT CŨ; sau khi đổi luật nó MẤT NGHĨA. Đừng mang nó sang rồi gọi là
