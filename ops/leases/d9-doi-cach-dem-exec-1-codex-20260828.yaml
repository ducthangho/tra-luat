  (5) đóng nợ P2 kế thừa của #319 về LỜI KHAI tiêu chí (nói `numstat` trên write set, mã lại đo
      tổng dòng hai tệp) — sửa lời khai cho khớp thứ mã thật sự đo.

cau_hoi_that_khong_co_dap_an: >-
  Đếm dòng-không-trắng giết đường nén khoảng trắng, NHƯNG làm XOÁ CHÚ THÍCH thành đường rẻ nhất kế
