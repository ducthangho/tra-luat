  Packet này ĐỔI ĐƠN VỊ MỘT LẦN, có chủ đích, được người giữ kho duyệt, kèm đột biến canh — khác
  hẳn bốn lần đổi tuỳ tiện của #319. GHI RÕ khác biệt ấy NGAY TẠI MÃ, kẻo lượt sau đọc thành tiền
  lệ cho phép đổi đơn vị bất kỳ lúc nào.

