# ========== TIÊU CHÍ NGHIỆM THU MỚI CỦA r2 — việc thứ SÁU ==========
viec_thu_sau_S3_da_ban: >-
  `S3` đã bắn: hình dạng lỗi "mẫu đột biến ĐƠN DÒNG tự khớp với chính bảng `MUTATIONS` nằm trong
  tệp đang bị quét" nay lặp lần thứ BA. Luật §12 nói lần thứ ba thì câu hỏi đúng KHÔNG phải "vá thế
  nào" mà là "cách làm này có đúng không". Nên r2 KHÔNG chỉ đòi sửa hai mẫu; nó đòi đóng cả LỚP.
  THÊM một ca — đề xuất tên `D13` — soi TOÀN BỘ bảng `MUTATIONS` và đòi mỗi mẫu khớp ĐÚNG MỘT chỗ
  trong tệp đích; mẫu nào khớp ≠ 1 thì ca ĐỎ, kèm TÊN mẫu trong thông báo.
  Rồi mới sửa hai mẫu `d9_*` cho duy nhất (cách đã dùng ở #360: neo mẫu NHIỀU DÒNG, vì trong bảng
  các dấu xuống dòng là chuỗi thoát nên bản-trong-bảng không tự khớp).
  Sau khi có `D13`, hai mẫu hỏng ấy phải làm `D13` ĐỎ **trước** khi bạn sửa chúng — chạy và ghi lại,
  đó là phản chứng cho chính `D13`.

vi_sao_D13_chu_khong_phai_cach_khac: >-
  TIỀN LỆ ĐÃ CÓ TRONG KHO, và đó là lý lẽ mạnh nhất: `.claude/dev/launcher_test.py` có sẵn
  `t117_moi_mau_dot_bien_phai_khop_DUNG_MOT_cho`, với chú thích khai rõ nó sinh ra vì "ĐÃ XẢY RA
  THẬT trong chính đợt này". Tệp ấy có chốt LỚN TIẾNG và từ đó không hỏng lần nào; `mcp_gh_test.py`
  chỉ có chốt `src.count(old) != 1` bên trong `chay_dot_bien` — hỏng MUỘN và IM LẶNG (đột biến
  thành `KHÔNG_ĐO_ĐƯỢC`, rồi lộ ra hai tầng sau dưới dạng `D8(a)/(b)` đỏ), và đã hỏng BA lần.
  Cùng một bài toán, hai cách giải, và số liệu nói rõ cách nào đúng.
  HAI ĐƯỜNG KHÁC ĐÃ XÉT VÀ LOẠI, ghi ra để lượt sau khỏi xét lại:
  · loại bảng `MUTATIONS` khỏi vùng tìm kiếm — xoá được cái bẫy, NHƯNG khi đó một mẫu đơn dòng
    trùng thật ở HAI CHỖ TRONG MÃ sẽ lọt im lặng, tức đổi một lỗi ồn lấy một lỗi câm;
  · đưa `MUTATIONS` sang tệp dữ liệu riêng — sạch nhất về nguyên lý nhưng cần THÊM đường dẫn, tức
    đổi write set ⇒ phải qua revision khác và packet khác. Nếu bạn đo ra nó đáng thì NÓI, đừng tự làm.

khong_duoc_lam: >-
  KHÔNG nới trần `759` để cho vừa `D13`. Nếu `D13` không lọt trần thì DỪNG và BÁO — đó là finding về
