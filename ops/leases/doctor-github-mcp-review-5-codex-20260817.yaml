# ĐỒNG), và lượt 4 nêu đúng nguyên nhân: oracle chỉ đặc tả một TẬP CON lời gọi. Người vá đã
# viết sẵn trong lease lượt 4 rằng nếu chốt "danh sách cho phép" vẫn thủng thì đó là bằng
# chứng CÁCH TIẾP CẬN sai — nó thủng, nên lượt này sửa CHỖ ĐẶT chốt chứ không thêm điều
# kiện: đồ giả TỰ từ chối mọi lời gọi lệch đặc tả, và `goi_api()` là đường DUY NHẤT gọi
# `_do_github_api`. Câu hỏi của lượt 5 vì thế không phải "còn lỗ nào" mà là "cách sửa này
# có đóng được cả LỚP không" — và prompt hỏi thẳng reviewer điều đó ở mục 6.

