#
# NGUỒN SỰ THẬT LÀ TỆP NÀY. Comment trên #55 chỉ là bản chiếu do
# `.github/workflows/ops-publish-lease.yml` đăng khi tệp này được push lên nhánh `ops/**`.
#
# VÌ SAO CÓ LƯỢT 6. Lượt 5 trả `changes_requested` trên `bf24fe44` với MỘT finding P2 và
# hai đột biến sống sót. Đã vá ở `45a06e4` — đúng một tệp, đúng một thay đổi.
#
# LƯỢT 5 LÀ LƯỢT ĐẦU TIÊN ĐỔI KẾT LUẬN, và đó là dữ kiện quan trọng nhất để đọc lượt 6.
# Bốn lượt đầu, mỗi lượt reviewer tìm được đột biến sống sót và nguyên nhân đều là "cách
# chốt sai" — mỗi lần người vá phải đổi KIẾN TRÚC chốt. Lượt 5 thì khác: reviewer nói
# thẳng "chốt không sai từ gốc ở vị trí đặt trong đồ giả, nhưng còn thiếu điều kiện về
# trace đầy đủ". Nên lượt 5 người vá THÊM ĐIỀU KIỆN (so khớp CẢ DÃY lời gọi) thay vì lại
# đổi kiến trúc — và lượt 6 là phép thử xem kết luận ấy có đúng không.
#
# HAI VIỆC CỦA LƯỢT NÀY, theo thứ tự quan trọng:
#   1. MỘT MỤC CÒN MỞ. Phép đo chống lưng cho `.search` (nội dung `.mcp.json` chèn được
#      dòng `Status:` thứ hai, nhưng nằm SAU bản thật) hiện chỉ có MỘT nguồn: người vá.
#      Lượt 4 khai KHÔNG ĐO ĐƯỢC; lượt 5 xác nhận không thấy lỗ TĨNH nhưng khai rằng dựng
#      lại đầu ra CLI thật một cách độc lập là KHÔNG ĐO ĐƯỢC. Prompt mục 2 đưa nguyên lệnh
#      để reviewer tự dựng — chép ra để họ khỏi phải đoán, KHÔNG phải để họ tin.
#   2. Tìm lượt thứ SÁU của lớp "đo đồ giả", với bốn hướng cụ thể.
# Và prompt hỏi thêm một câu chưa lượt nào hỏi: theo reviewer, bản vá đã tới ngưỡng LAND
# được chưa, nếu chưa thì thiếu ĐÚNG cái gì — nói thành danh sách đóng được.

