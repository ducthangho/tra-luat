phep_do_moi_cua_luot_nay: >-
  Bốn tầng thường bị coi là hàng rào, đo ở VỎ PHIÊN: `--allowedTools` không khớp lệnh ghép ·
  `codex -s workspace-write` ghi ra ngoài cây `rc=0` · xoá `GITHUB_PAT`/`GH_TOKEN`/`GITHUB_TOKEN`/
  `GIT_CONFIG_*` vẫn `git push --dry-run` `rc=0` · nhét TOKEN RÁC vào URL vẫn `rc=0` ⇒ proxy egress
  bỏ qua credential client gửi.
  Rồi đo TRONG sandbox codex, và kết quả KHÁC HẲN — đây là chỗ suýt khái quát sai:
    codex -s workspace-write   FS trong 0 · FS ngoài 0 · ls-remote 128 · push 128
    codex -s read-only         FS trong 1 · FS ngoài 1 · ls-remote 128 · push 128
  Tức codex bị chặn MẠNG ở CẢ HAI chế độ. Reviewer chạy bằng `codex exec` KHÔNG đẩy được lên
  GitHub kể cả `workspace-write`. Chọn NỀN quan trọng hơn chọn chế độ.
  CHƯA ĐO: vì sao codex chặn mạng (sandbox tự chặn, hay biến proxy không kế thừa) ⇒ chưa được
  dựa vào nó như bảo đảm an ninh.
