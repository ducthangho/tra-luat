thay_the_cho: doctrine-ranh-gioi-reviewer-exec-1-claude-20260826
thay_the_chuoi_day_du: >-
  `doctrine-allowlist-reviewer-exec-1r4-claude-20260824` (r4 của #314) -> `…-ranh-gioi-reviewer-exec-1`
  (r1, bản này thay) -> `…-ranh-gioi-reviewer-exec-1r2`. r1 đã hoàn tất việc thay r4; r2 KHÔNG thay
  r4 lần nữa. `_kiem_bia_mo` khớp `da_bi_thay_the` bằng CHUỖI VÔ HƯỚNG nên mỗi lease cũ chỉ trỏ
  được tới MỘT lease mới — chuỗi phải đi thẳng, không rẽ nhánh.
ly_do_mo_ban_sua_doi_2: >-
  §3.2: "Findings của Reviewer được sửa trong cùng Packet KHI SPEC VẪN ĐỦ; finding cho thấy CHÍNH
  SPEC THIẾU thì verdict là `blocked` và đi qua revision mới." P1 `n7-doc-claims-khong-phai-phep-n7`
  của cross-review vòng 2 thuộc vế sau: tiêu chí N7 gọi tên một cổng KHÔNG TỒN TẠI ("delta gate"),
  và đo bằng một lệnh KHÔNG ĐỌC tệp của packet. Đó là spec thiếu, không phải bản vá thiếu.
  Phiên điều phối ban đầu nghiêng hướng "vá tiêu chí hỏng, không mở revision" — SAI, vì lúc ấy mới
  đọc VẾ ĐẦU của câu §3.2. Đọc hết câu thì protocol đã trả lời sẵn, và trả lời ngược lại.
doi_gi_so_voi_r1: >-
  ĐÚNG MỘT thứ: `acceptance` — tiêu chí N7. Mọi thứ khác BƯNG NGUYÊN: write set, base, trần 200,
  nhánh, executor, reviewer, environment, review_class. Nói riêng: trần GIỮ 200 — bản sửa đổi này
  KHÔNG phải cớ để nâng lần ba; đo được 194/200, còn biên 6.
n7_cu_va_moi:
  n7_cu: '`packet_loop.py doctrine-scan --root .` rc=0; delta gate so `origin/master` = 0'
  hong_cho_nao:
    ve_mot: >-
      `cmd_doctrine_scan` (`.claude/dev/packet_loop.py:1189`) gom mục tiêu từ ĐÚNG BA nguồn:
      `.claude/skills/**/*.md`, `CLAUDE.md`, và tệp truyền qua `--path`. Không `--path` thì quét
      7 tệp, KHÔNG có `docs/GOI_AGENT_DA_NEN.md` — đường dẫn DUY NHẤT của write set. `rc=0` ấy là
      XANH RỖNG: cổng chưa từng mở tệp đang bị sửa. Ba vòng review đều nhìn thấy `rc=0` đó.
    ve_hai: >-
      "delta gate" KHÔNG TỒN TẠI. `packet_loop.py --help` liệt kê 15 lệnh con, không có `delta`;
      `grep -n "delta" .claude/dev/packet_loop.py` RỖNG. Tiêu chí ấy không xanh được cũng không
      đỏ được — nó KHÔNG CÓ TRẠNG THÁI.
  n7a_moi: >-
    `python3 .claude/dev/packet_loop.py doctrine-scan --root . --path docs/GOI_AGENT_DA_NEN.md`
    cho `rc=0` VÀ in số tệp quét là **8**. Số 8 nằm trong tiêu chí CÓ CHỦ Ý: nó chặn đúng kiểu
    xanh rỗng vừa mô tả — 7 nghĩa là tệp chưa vào tầm quét, 8 nghĩa là đã vào.
  n7b_moi: >-
    `git diff --numstat c35ae1c -- docs/GOI_AGENT_DA_NEN.md` cho cột dòng THÊM <= `dong_them_toi_da`
    của lease này. Thay hẳn cụm "delta gate" bằng phép đo đã dùng suốt packet. Vế "đúng một đường
    dẫn" KHÔNG nhắc lại ở đây vì N6 đã giữ — nhắc hai lần là tạo hai nguồn sự thật.
  chat_hon_hay_long_hon: >-
    CHẶT HƠN ở cả hai vế: một vế từ xanh-rỗng thành có-đọc-tệp, một vế từ không-có-lệnh thành
    có-lệnh. Bản sửa đổi này KHÔNG nới cho ai cái gì. Ghi rõ để vòng review 3 khỏi phải tự suy.
thay_the_cho_r1_ly_do: >-
  Packet #314 đã được TÁCH theo khuyến nghị của chính verdict cross-review vòng 2 (PR #315,
  comment 5423010218: `blocked` · `DO_NOT_LAND`) và quyết định của người giữ kho 2026-08-26.
  PR #315 đã đóng, KHÔNG merge; nhánh `claude/doctrine-allowlist-reviewer-exec-1` (`6c4140b`)
  giữ lại làm hiện vật để verdict còn tra được SHA.
  Lease r4 giữ BA đường dẫn. Hai lease thay thế PHÂN HOẠCH đúng ba đường dẫn ấy, không chồng lấn
  và không bỏ sót: lease này lấy `docs/GOI_AGENT_DA_NEN.md`; lease
  `mcp-gh-cuu-ho-exec-1-claude-20260826` (#319) lấy `.claude/dev/mcp_gh.py` và
  `.claude/dev/mcp_gh_test.py`.
  Ghi thẳng khuyết tật của r4 để lease này không lặp: r4 có `base_sha: c35ae1c` trong khi
  `base_ghi_chu` ngay dưới còn nhắc `3e6001a`; `ngan_sach…ghi_chu` còn nói 478/520 trong khi
  trường là `da_dung: 687` / `dong_them_toi_da: 760`; và MẤT HẲN khối `nang_tran` nên trần 760
  không có thẩm quyền ghi nhận. Đó là lần THỨ TƯ cùng một hình dạng: sửa TRƯỜNG được nới, quên
  VĂN BẢN mô tả nó — nên lease này đã được grep lại toàn văn sau khi soạn.

