  (2) CHƯA có phép đo độc lập cho bảng sandbox; nó đứng bằng một phép đo của một phiên.
  (3) Lượt Windows của #315 `skipped`, KHÔNG tính là pass.
  (4) Số dòng `:601` / `:629-645` / `:659-661` đọc trên `6c4140b`; trên `master` tệp có 544 dòng
