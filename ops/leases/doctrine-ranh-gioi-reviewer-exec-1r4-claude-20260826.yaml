  KHONG_duoc_doc_thanh: >-
    KHÔNG phải "P2 không quan trọng". Nó nghĩa là P2 không đáng đổi lấy thêm một vòng vá, vì tám
    vòng đã đo được rằng mỗi lượt vá của phiên này đóng lỗi cũ VÀ đẻ lỗi mới ở cùng vùng. Luật
