dieu_kien_dung: >-
  S1 ĐÃ BẮN ở vòng 3 và đã được xử đúng đường: DỪNG, trình phương án kèm số đo, người giữ kho
  chốt, rồi mở r3 này. Cần đường dẫn THỨ BA ⇒ DỪNG LẠI LẦN NỮA, đừng tự lấy ·
  S2 vượt 200 dòng thêm ⇒ DỪNG, xin nâng trần bằng khối `nang_tran` có `ai_nang`/`vi_sao`,
  KHÔNG sửa `dong_them_toi_da` trần trụi. ĐÃ BẮN HAI LẦN — 155/120 (`nang_tran`) và 187/165
  (`nang_tran_lan_hai`). Lần thứ ba thì TÁCH, đừng nâng tiếp ·
  KHÔNG sửa `dong_them_toi_da` trần trụi ·
  S3 phát hiện một trong ba P2 của vòng 2 bị hồi quy ⇒ DỪNG, báo trước khi đi tiếp ·
