thay_the_cho: doctrine-ranh-gioi-reviewer-exec-1r3-claude-20260826
thay_the_chuoi_day_du: >-
  `doctrine-allowlist-reviewer-exec-1r4-claude-20260824` (r4 của #314) -> `…-ranh-gioi-reviewer-exec-1`
  (r1, bản này thay) -> `…-ranh-gioi-reviewer-exec-1r2`. r1 đã hoàn tất việc thay r4; r2 KHÔNG thay
  r4 lần nữa. `_kiem_bia_mo` khớp `da_bi_thay_the` bằng CHUỖI VÔ HƯỚNG nên mỗi lease cũ chỉ trỏ
  được tới MỘT lease mới — chuỗi phải đi thẳng, không rẽ nhánh.
ly_do_mo_ban_sua_doi_4: >-
  TÁCH mục mạng/sandbox và mục hai pha ra khỏi packet, theo luật của `CLAUDE.md`: "cùng một hình
  dạng lỗi lặp BA LẦN trở lên thì câu hỏi đúng là CÓ NÊN LÀM VIỆC NÀY KHÔNG."
  Đếm được, trên tiêu đề finding của từng vòng verdict (không đếm bằng mắt):
  vòng 1 có 3 finding về mạng/sandbox · vòng 2 có 2 · vòng 3 có 1 · vòng 4 có 2.
  BỐN vòng liên tiếp, TÁM finding, cùng một chủ đề — trong khi N1/N3/N4/N5/N6/N7a/N7b đã ĐẠT từ
  vòng 3. Không nâng trần lần nữa; cắt.
