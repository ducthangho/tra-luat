    tự đặt là đúng hình dạng lỗi packet này ghi lại nhiều lần. Docstring bị cắt còn phần cần
    thiết vì tệp doctrine đã mang lời giải thích. 30/30 — hết biên, lượt sau muốn thêm phải hỏi.
  KHONG_co_tep_test: >-
    KHAI THẲNG: không kèm `.claude/dev/probe_mang_test.py`, nên write set là HAI chứ không phải
    BA. Căn cứ ĐO ĐƯỢC, không phải suy đoán: `ci.yml` LIỆT KÊ từng tệp `_test.py` phải chạy
    (`codex_cred_test.py`, `packet_loop_test.py`, `gate_lifecycle_test.py`, …) chứ không quét
    theo mẫu, nên không cổng nào đòi cặp; và `.claude/dev/` đã có SẴN hai script không test là
    `charact_capture.py` và `codex_env_policy.py`.
  no_de_lai: >-
    Có giá phải trả và nói ra: probe này LÀ bằng chứng cho một mệnh đề doctrine, nên nếu nó hỏng
    lặng lẽ thì mệnh đề ấy thành không kiểm được mà không ai hay. Một test chỉ khẳng định được
    "in ra ba số nguyên" — vì kết quả THẬT phụ thuộc môi trường, đó chính là điều probe muốn đo.
    Ghi thành nợ có tên: `probe-mang-khong-co-test`.

