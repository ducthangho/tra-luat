  quyet_dinh_luc: >-
    direct, in-session, 2026-08-26 — phiên thi công DỪNG theo S2 khi đo được 155/120, trình ba
    phương án (nâng trần · tách hai packet · cắt nội dung) kèm số đo cho từng phương án; người
    giữ kho chọn nâng trần và land một packet.
  vi_sao: >-
    Trần 120 là ƯỚC LƯỢNG của phiên soạn lease, đặt TRƯỚC khi đọc hết 146 dòng phải mang từ nhánh
    bị bác sang, và nó chặt hơn doctrine ở CẢ HAI cách đọc ADR-0044: ngưỡng nghiêm nhất
    (`sensitive` chạm authority) là 3 tệp / 300 dòng thêm, còn bản vá này là 1 tệp / 155 dòng —
    còn biên 145. Nên nâng lên 165 KHÔNG phải nới doctrine, chỉ là sửa một ước lượng sai.
    Đã nén thật một lượt trước khi xin: 166 → 155. Cắt tiếp là cắt vào phép đo (bảng ba lượt,
    bảng bốn tầng, bảng sandbox) hoặc vào ba P2 mà chính `giu_nguyen_khong_lam_lai` cấm làm lại.
  vi_sao_khong_tach_lam_hai: >-
    Phương án tách đo được: phần ranh giới 100 dòng (vừa trần cũ), mục `Bash(x:*)` 55 dòng đi
    packet thứ ba. Không chọn, vì hai nửa là MỘT MẠCH: mục `Bash(x:*)` kết bằng câu "bản đầu viết
    … câu ấy SAI — xem mục dưới", nên tách ra là để một con trỏ chết đúng lúc merge — đúng bài học
    `CLAUDE.md` về câu mô tả VỊ TRÍ phải đúng ở CẢ HAI phía của lần merge. Cộng thêm: ba P2 đã được
    duyệt ở vòng 2 sẽ phải chờ thêm một vòng review nữa cho nội dung đã chấp nhận.
  15_dong_bien: >-
    165 chứ không phải 155: chừa 10 dòng cho vòng review. Đây là biên, KHÔNG phải hạn mức để tiêu.

