  sandbox là một MẶC ĐỊNH CẤU HÌNH, không phải bất biến — biết cơ chế không làm nó thành ranh giới.
  Số đo, probe và bảng hai pha đi sang packet mới: **Issue #334** (`MANG-SANDBOX-CODEX`), đã mở,
