    ve_hai: >-
      "delta gate" KHÔNG TỒN TẠI. `packet_loop.py --help` liệt kê 15 lệnh con, không có `delta`;
      `grep -n "delta" .claude/dev/packet_loop.py` RỖNG. Tiêu chí ấy không xanh được cũng không
      đỏ được — nó KHÔNG CÓ TRẠNG THÁI.
