viec_cua_luot_nay: >-
  Hoà BA câu tự mâu thuẫn trong `docs/GOI_AGENT_DA_NEN.md` (đọc trên `6c4140b`, đối chiếu số dòng
  lại sau khi rẽ nhánh vì tệp trên `master` ngắn hơn):
  `:601` tiêu đề khai "phiên review KHÔNG có ranh giới kỹ thuật — không tầng nào bó được" ·
  `:629-630` khai mạng chặn codex là "hàng rào thật, và nó có sẵn" ·
  `:642-645` bảng hai pha dùng "mạng đóng" làm cột CƯỠNG CHẾ ·
  `:659-661` lại khai chưa đo được CƠ CHẾ và "đừng dựa vào nó như một bảo đảm an ninh".
  Trục hoà: quan sát theo phiên bản ≠ bất biến an ninh; chỉ gọi là boundary SAU khi xác minh cơ
  chế fail-closed, trước đó là quan sát và phải mang điều kiện đo.
  `:617-618` đã hoà một phần cặp thứ nhất (bốn dòng bảng đo ở VỎ PHIÊN, không trong sandbox) —
  giữ ý ấy, nhưng thu tiêu đề `:601` về đúng phạm vi thân nó.
  KHÔNG chạm `CLAUDE.md`, KHÔNG chạm `.claude/**`, KHÔNG sửa mã.

giu_nguyen_khong_lam_lai: >-
  BA finding P2 đã vá THẬT ở cross-review vòng 2 của #314 giữ nguyên: hạ nhân quả xuống "tương
  quan có neo" · khai `stdout.log` KHÔNG tái lập được từ kho · tách ví dụ thứ sáu
  `bash /tmp/refscan.sh` vì nó khác nguyên nhân (thiếu `Bash(bash:*)`). Sửa lại một trong ba ⇒ ĐỎ
  (tiêu chí N5 của Issue #318).

canh_bao_cho_nguoi_thi_hanh: >-
  (1) Bảng đo sandbox `codex -s …` CHƯA được kiểm chéo — reviewer vòng 2 không tái lập được
  (`codex exec` lồng nhau `rc=1`, `Read-only file system`). Đừng viết như thể nó đã được xác nhận
  độc lập; đó chính là mệnh đề mà N2 đòi gắn nhãn hạng.
  (2) Ba con số của bảng ba lượt (78/5/10,8M · 85/10/12,8M · 45/1/3,7M) đọc từ `stdout.log` KHÔNG
  có trong kho ⇒ không tái lập được ở đây. Giữ nguyên số và giữ nguyên lời khai "không tái lập
  được"; sửa số mà không đo lại ⇒ ĐỎ.
  (3) ĐỪNG viết chuỗi bỏ-qua-CI nguyên văn ở bất cứ đâu, kể cả khi trích dẫn để giải thích.
  (4) Sandbox executor mount `.git` chỉ đọc ⇒ executor SINH DIFF, phiên điều phối commit/push.
  (5) ĐỪNG giao reviewer việc TỰ SOẠN phản chứng dựng đường dẫn thoát khỏi cây — bộ lọc nội dung
  của nền bắn đúng lớp ấy và đã giết hai lượt review. Phản chứng nằm sẵn trong cây; reviewer CHẠY
  chúng và ĐỘT BIẾN BẢN VÁ.

chua_do_duoc_luc_cap: >-
  (1) CHƯA biết CƠ CHẾ codex chặn mạng (sandbox tự chặn, hay biến proxy không kế thừa) — đây
  chính là lý do `:659-661` tồn tại và là lý do N2 đòi nhãn hạng.
  (2) CHƯA có phép đo độc lập cho bảng sandbox; nó đứng bằng một phép đo của một phiên.
  (3) Lượt Windows của #315 `skipped`, KHÔNG tính là pass.
  (4) Số dòng `:601` / `:629-645` / `:659-661` đọc trên `6c4140b`; trên `master` tệp có 544 dòng
  nên các số ấy KHÔNG áp thẳng — phải định vị lại bằng nội dung, không bằng số dòng.

