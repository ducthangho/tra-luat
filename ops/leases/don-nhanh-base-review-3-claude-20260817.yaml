#
# KẾT LUẬN CỦA LƯỢT NÀY KHÔNG ĐỦ ĐỂ LAND theo protocol. Nó là PHẢN BIỆN BỔ SUNG. Muốn land
# thì cần một trong hai: cross-review `codex` khi có quota, hoặc human review có audit của
# chủ kho. Chủ kho quyết định thế nào là việc của chủ kho — nhưng bản ghi phải nói đúng
# thứ đã xảy ra.

