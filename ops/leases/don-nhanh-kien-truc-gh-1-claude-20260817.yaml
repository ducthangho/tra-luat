muc_kiem:
- id: bat-doi-xung-moi-truong
  note: >-
    CÂU DỄ KẾT LUẬN SAI NHẤT. `don-nhanh.ps1` chạy trên máy WINDOWS của chủ kho, không chạy
    trong container. 403 ở trên là chính sách proxy CỦA CONTAINER. Phương án tốt nhất cho
    máy người dùng và cho CI có thể KHÁC NHAU — chọn theo nơi script THẬT SỰ chạy.
- id: mcp-bot-lop-hay-doi-lop
  note: >-
    Đếm lớp giải mã: MCP = HTTP → SSE (`data:`) → `content[0].text` (chuỗi) → JSON = BA lớp,
    cộng bắt tay `initialize` + `Mcp-Session-Id`. `gh pr list --json` = MỘT lớp. Nhiều lớp
    hơn thì nó DỜI chỗ hỏng chứ không ĐÓNG lớp hỏng.
- id: isError-vang-mat
  note: >-
    Lời gọi thành công trả `isError: None` — trường VẮNG MẶT. `if ($r.isError)` đọc "vắng"
    thành "không lỗi", ĐÚNG lớp lỗi của lượt 1 (`rc=0` nói dối) và đúng doctrine `None ≠
    False`. Phương án C có TÁI TẠO chính lớp lỗi nó được đề xuất để chữa không?
- id: ranh-gioi-credential
  note: >-
    Hiện script KHÔNG đọc token nào — nó dựa vào `gh` đã đăng nhập. B và C đều đòi token
    trong môi trường của một script XOÁ NHÁNH. Cân bằng lợi/hại bằng phạm vi quyền cụ thể.
- id: fail-close-con-giu-duoc-khong
  note: >-
    "Không đọc được ⇒ TỪ CHỐI XOÁ (rc=13)" là bất biến. Với B/C, "không đọc được" có bao
    nhiêu hình dạng MỚI (timeout, 5xx, SSE đứt, session hết hạn, PHÂN TRANG thiếu)? Một hình
    dạng rơi vào nhánh "coi như không có PR" là lỗ y hệt lượt 1.
- id: giu-nguyen-la-ket-luan-hop-le
  note: >-
    Đừng đề xuất đổi chỉ vì lượt này TÊN LÀ "xét lại kiến trúc" — đó là thiên kiến của chính
