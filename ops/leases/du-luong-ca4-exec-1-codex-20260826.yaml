viec_cua_luot_nay: >-
  MỘT gốc, BA mặt. Đừng vá ba lần.

  === GỐC ===

  `_nhanh_cuc_bo_tut_sau` hiện làm HAI việc sai cùng lúc:

    (i)  dựng đối ứng bằng TÊN — `doi_ung = "refs/remotes/origin/" + ten` — rồi
         `if doi_ung not in tap_ref: continue`. Tên là ĐẠI DIỆN cho quan hệ upstream,
         và đại diện ấy sai khi nhánh theo dõi một upstream KHÁC TÊN. Git đã ghi sẵn
         quan hệ THẬT ở `branch.<ten>.merge` / `<ten>@{upstream}`.
    (ii) chỉ phân loại HAI trạng thái: `trai == 0 && phai > 0` ⇒ CHẶN, còn lại ⇒ QUA.
         Phân kỳ (`trai > 0 && phai > 0`) rơi vào "còn lại" nên QUA — trong khi nó
         thiếu commit của upstream y hệt ca tụt sau, tức RỦI RO LEASE-MA LÀ NHƯ NHAU.

  === PHẢI LÀM ===

  1. ĐỌC UPSTREAM THẬT, không đoán theo tên.
     Không có upstream ⇒ nhánh cục bộ thuần ⇒ **QUA**. Chiều bắt-oan này BẮT BUỘC giữ
     (`t105` đang khoá nó) — một cổng chặn oan còn tệ hơn không có cổng.

  2. PHÂN LOẠI BỐN trạng thái, không phải hai:

       bằng      (0/0)            -> QUA
       đi trước  (M>0, 0)         -> QUA
       tụt sau   (0, N>0)         -> CHẶN, và danh sách CHO PHÉP quyết định có phát lệnh
       PHÂN KỲ   (M>0, N>0)       -> CHẶN, và **KHÔNG BAO GIỜ PHÁT LỆNH**

  3. PHÂN KỲ KHÔNG BAO GIỜ NHẬN MỘT LỆNH NÀO. Không `git branch -f` (vứt mất commit cục
     bộ), không `merge --ff-only` (không fast-forward được theo định nghĩa). Chỉ CHẨN ĐOÁN:
     nêu đích danh nhánh, upstream thật của nó, quan hệ M/N, và bảo người dùng tự quyết
     (merge, rebase, hoặc bỏ nhánh). Đây KHÔNG phải tuỳ chọn — đã ĐO: nới điều kiện thành
     `phai > 0` mà giữ nguyên tầng phát lệnh khiến cổng in `git branch -f` cho nhánh phân
     kỳ, chạy `rc=0`, và MẤT commit cục bộ, unreachable từ mọi ref. Nặng hơn cả năm finding
     của ca 4 cộng lại — chúng chỉ là ngõ cụt, cái này PHÁ DỮ LIỆU.

  4. Danh sách CHO PHÉP của ca 4 GIỮ NGUYÊN cho ca tụt sau. Phép kiểm an toàn worktree là
     CẦN nhưng KHÔNG ĐỦ: nó hỏi "worktree có sạch không", chưa bao giờ hỏi "fast-forward có
     hợp lệ về NGỮ NGHĨA không". Chốt quan hệ ref phải chạy TRƯỚC nó.

  === CA KHOÁ — bảy trạng thái, rig đã dựng sẵn và ĐÃ KIỂM ===

  Rig ở `rig/kho` có đúng bảy nhánh, mỗi nhánh mang một lease riêng:

    tutsau      origin/tutsau CÓ    0/1   -> CHẶN + lệnh (hành vi CŨ, không được đổi)
    phanky      origin/phanky CÓ    1/1   -> CHẶN, KHÔNG lệnh          [MỚI]
    bang        origin/bang   CÓ    0/0   -> QUA
    ditruoc     origin/ditruoc CÓ   1/0   -> QUA
    thuancucbo  KHÔNG origin, KHÔNG upstream -> QUA (bắt-oan, bắt buộc)
    khacten     upstream=origin/main  1/1 -> CHẶN, KHÔNG lệnh          [MỚI]
    khactensau  upstream=origin/main  0/1 -> CHẶN + lệnh               [MỚI]

  ĐÃ KIỂM TRƯỚC KHI GIAO bằng chính mã vừa land: nó CHẶN `main` + `tutsau`, và BỎ SÓT
  `phanky`, `khacten`, `khactensau`. Nên "KHÔNG_ĐO_ĐƯỢC" là câu trả lời ĐÁNG NGỜ ở đây.

  Ca từ chối phải khẳng định output KHÔNG chứa dạng lệnh chạy được (`git branch -f`,
  `git -C`, `merge --ff-only`) — y như `t111` của ca 4 làm.

  === ĐỘT BIẾN BẮT BUỘC — mỗi cái phải làm ĐÚNG ca của nó ĐỎ ===

    · gỡ phát hiện phân kỳ                    -> ca phanky ĐỎ
    · biến phân kỳ thành tụt sau (tức CHO nó nhận lệnh) -> ca phanky ĐỎ   [QUAN TRỌNG NHẤT:
      đây đúng đường phá dữ liệu; không có đột biến này thì không biết ca đang đo điều gì]
    · quay về dựng đối ứng bằng TÊN           -> khacten + khactensau ĐỎ
    · chặn cả nhánh KHÔNG có upstream         -> thuancucbo ĐỎ (bắt-oan)
    · gỡ chốt quan hệ ref, chỉ còn danh sách cho phép -> phanky ĐỎ

  Mỗi đột biến phải chạy trong THƯ MỤC RIÊNG (bẫy `.pyc` trùng `(mtime giây, kích thước)`).

  === ĐỪNG ===

  ĐỪNG đụng `t102`–`t111`; chúng phải XANH nguyên vẹn sau bản vá (nếu một ca cũ buộc phải
  đổi thì DỪNG và khai, đừng tự sửa). ĐỪNG mở lại thiết kế danh sách CHO PHÉP của ca 4.
  ĐỪNG tự stash/reset/abort/prune bất cứ thứ gì.

