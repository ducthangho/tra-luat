     tách. So bằng TẬP, không bằng `wc -l` — hai tập lệch vẫn có thể cùng lực lượng.'
  - 'Giữ nguyên biểu thức `fromJSON(...)` của ma trận cho mọi job mới — KHÔNG thêm một mặt
     điều kiện nào. Lực lượng tập chuỗi biểu thức phân biệt phải không tăng.'
  - 'Giữ `timeout-minutes: 60` trên MỌI job.'
  - 'ĐO và CÔNG BỐ phút tính tiền tăng thêm; ngưỡng ≤ 135,00 phút tính tiền.'
  - 'In ra danh sách tên job mới, đúng dạng chuỗi mà branch protection dùng.'
