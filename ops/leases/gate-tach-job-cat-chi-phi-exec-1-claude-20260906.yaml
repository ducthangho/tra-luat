     `.claude/dev/**` chứ không ở `ci.yml`. Nợ có tên: MUTANT-WINDOWS-PACKET-LOOP.'
  - 'Đổi tập bước hoặc đổi lệnh của bất kỳ bước nào — packet này chỉ đổi bước ấy nằm trong
     JOB nào.'
  - 'Viết cú pháp `${{ }}` trong comment của `run:` — GitHub nội suy TOÀN BỘ thân `run` trước
