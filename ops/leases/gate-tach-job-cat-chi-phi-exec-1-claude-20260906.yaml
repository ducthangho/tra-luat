     vấn đề đọc được lấy một vấn đề vô hình. Trần đứng nguyên ở 60.'
  - 'Thêm bất kỳ mặt ĐIỀU KIỆN nào (theo diff / theo nhãn / `paths:`) — đã có đặc tả đóng băng
     `ops/specs/CI-FASTPATH-THEO-DIFF.md` và bản triển khai ĐÃ BỊ BỎ (PR #247 đóng, không
     merge). Kho đã trả giá HAI lần cho logic điều kiện của workflow. Tách job là thêm JOB,
     không thêm ĐIỀU KIỆN.'
