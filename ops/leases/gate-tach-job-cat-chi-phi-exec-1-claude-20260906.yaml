ly_do_cap: >-
  Nợ do chính `ci.yml:63` tự khai: "NÂNG TRẦN KHÔNG CHỮA NGUYÊN NHÂN: gate 22 phút và đang
  lớn dần là nợ riêng". Khi #456 được soạn, nợ ấy CHƯA BÀN ĐƯỢC vì tổng thời gian Windows
  thật chưa ai đo — job luôn bị cắt ở trần. #456 đã land và LẦN ĐẦU sinh ra số đo ấy.
  Đo run 34045664423 (nhánh, head `426bfc0`) lúc 17:41Z và run 34048685345 (master, head
  `1b3caa1`, đã chạy trọn) lúc 18:10Z 06-09-2026: Windows 43,20p `success` 43/43 (nhánh) ·
  42,28p `success` 43/43 (master). Biên dưới trần 60: 16,80p (nhánh) · 17,72p (master) — mỏng.
  Hai bước nặng nhất = 63,5 % chi phí Windows (`test registry` 17,70 = 41,0 % ·
  `packet-loop selftest` 9,70 = 22,5 %). Chênh job − Σbước = 0,03 phút ⇒ không có chi phí ẩn
  ngoài các bước; mọi khoản cắt phải cắt vào một bước có tên.
  "Bỏ bước trùng" ĐÃ ĐO và KHÔNG CÓ: 39 bước khai, 0 bước có thân `run` trùng nhau (17:59Z).
  Tách ba job ⇒ job dài nhất Windows 43,20 → 21,03 phút (−51,3 %), NHƯNG phút TÍNH TIỀN
  110,65 → 126,23 (+14,1 %) vì trả tiền thiết lập ba lần thay vì một. Khoản tăng ấy đụng đúng
  chỗ kho này đã chết một lần — `ci.yml:19-24` ghi CI đứng hình từ 12-08-2026 vì cạn hạn mức
  2.000 phút/tháng — nên nó là con số CHỦ KHO DUYỆT TRƯỚC, không phải con số phiên thi công
  tự nuốt.

