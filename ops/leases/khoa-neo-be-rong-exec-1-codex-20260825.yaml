viec_cua_luot_nay: >-
  Đóng finding P2 của connector trên PR #311: `_khoa_neo_cac_sha` xếp CẢ hai bề rộng vào
  "OID đầy đủ" mà KHÔNG hỏi object format của kho.

    day_du = [s for s in hop_le if len(s) in (40, 64)]

  Trong kho SHA-256, một tiền tố 40 ký tự vừa tự khớp mình vừa khớp bản 64 ⇒
  `len(ung_vien_day_du) == 2` ⇒ chặn oan.

  PHẢI TỰ ĐO LẠI — phản chứng đã chạy trên head `cb6f566e` bằng fixture của chính bộ test
  (`_kho_gia_co_verdict` + `_bn_that`):
    OID 64 + tiền tố 40 CỦA CHÍNH NÓ  -> rc=11 (`KHÔNG ĐO ĐƯỢC: … khớp nhiều OID đầy đủ`)
    đối chứng 40 + tiền tố 7 của nó   -> rc=0, đếm 1
    đối chứng một mình 64             -> rc=0, đếm 1

  VÁ: suy bề rộng OID từ **object format của kho** trước khi phân loại `day_du`.

  BA RÀNG BUỘC, ràng buộc thứ hai là chỗ dễ hỏng nhất:
  (1) Ca `bien_nhan_viet_tat_khop_hai_oid_la_KHONG_DO_DUOC` hiện có PHẢI VẪN ĐỎ sau khi vá.
      Nó xanh nghĩa là bản vá đã nới quá tay và giết luôn phần chặn ca mơ hồ THẬT.
  (2) `packet_loop.py` CỐ Ý không phụ thuộc git cho phép đếm này — `_la_dang_commit` khai
      thẳng lý do (lệnh phải chạy được ở cây không có lịch sử ấy). Hỏi object format là mở
      MỘT phụ thuộc git mới. Vì vậy: hỏi được thì dùng; KHÔNG hỏi được (không `.git`, bản sao
      rời) thì phải giữ nguyên hành vi hiện tại, KHÔNG được chặn. Ca
      `bien_nhan_ban_sao_roi_thi_bo_qua` đang bảo vệ đúng đường ấy — nó phải vẫn xanh.
  (3) Thêm ca hồi quy full-64 + tiền tố-40, và ca đối chứng hai commit KHÁC NHAU vẫn đếm HAI
      (chiều bắt-oan). Thiếu chiều này thì bản vá có thể "an toàn" bằng cách gom sạch.

  Mỗi tính chất một đột biến riêng. Ca không có răng thì thà không có.

