viec_cua_luot_nay: >-
  LƯỢT 2 — đóng ĐÚNG MỘT finding P1 của cross-review vòng 1 trên PR #317
  (`verdict: changes_requested`, reviewed_sha `34de004a2c6e329d8632d6b1e64f56668d4360ba`).

  Lượt 1 vá ĐÚNG HƯỚNG và reviewer xác nhận: mục 2 (không tạo fail-OPEN), mục 3
  (`_dat_object_format` dựng kho Git THẬT chứ không diễn kịch bản), mục 4 (3 ca mới đều có
  răng, 66→69 mutant, không mutant nào sống), mục 5 (92/120, 2 tệp) đều ĐẠT.
  KHÔNG mở lại những phần ấy.

  FINDING P1 `oid-format-leo-len-kho-cha` — `git -C <root>` LEO LÊN KHO CHA:
    `_be_rong_oid_cua_kho()` gọi `git -C <root> rev-parse --show-object-format` mà KHÔNG chặn
    discovery đi ngược lên thư mục cha. Nên một bản sao rời KHÔNG có `.git`, nếu tình cờ nằm
    trong một kho cha SHA-256, bị phân loại là SHA-256 thay vì rơi về `(40, 64)`.
    ⇒ FAIL-CLOSE MỚI trên đúng đường "không có `.git`" — tức ràng buộc quan trọng nhất của
    packet bị thủng.

  PHÉP ĐO A/B của reviewer (cùng fixture, cùng bố cục, chỉ đổi script base/HEAD):
    no_dot_git_under_sha256_parent   HEAD -> rc=11, count_one=False   (CHẶN OAN)
    no_dot_git_under_sha256_parent   base -> rc=0,  count_one=True    (đúng)
  Sáu đường hỏng khác (không `.git`, `.git` là tệp, không có `git` trên PATH, rc≠0, stdout lạ,
  timeout 5.13s) đều GIỮ ĐÚNG `rc=0` và đếm MỘT — chỉ ca lồng kho là thủng.

  PHIÊN ĐIỀU PHỐI ĐÃ TÁI HIỆN ĐỘC LẬP, không nhận lời khai:
    git init --object-format=sha256 chame ; mkdir chame/con     (con KHÔNG có .git)
    git -C chame/con rev-parse --show-object-format  ->  sha256
    git -C chame/con rev-parse --show-toplevel       ->  .../chame     <- KHÁC `con`

  HƯỚNG VÁ (reviewer đề, phiên điều phối đồng ý): trước khi tin câu trả lời, xác nhận kho mà
  git PHÁT HIỆN chính là `root`. Phép so `--show-toplevel` với `root` là chốt phân biệt đã đo
  được ở trên. Không khớp (hoặc không hỏi được) ⇒ trả `(40, 64)` như cũ.
  Cẩn thận biên: `root` có thể là đường dẫn tương đối, có symlink, hoặc chính là một worktree
  (`.git` là TỆP) — ca `.git` là tệp hiện đang ĐẠT, đừng làm nó đỏ.

  CA MỚI BẮT BUỘC: đặt nguyên fixture full-SHA + viết tắt sẵn có của suite vào một thư mục con
  KHÔNG có `.git` của một kho SHA-256 thật, rồi đòi `rc=0` và bằng chứng dương đếm MỘT.
  Kèm đột biến: gỡ phép so toplevel phải làm ca ấy ĐỎ.
  Nền không dựng được kho `--object-format=sha256` ⇒ ghi `KHÔNG_ĐO_ĐƯỢC` và DỪNG, đừng giả lập.

  KHÔNG mở lại 3 ca của lượt 1. KHÔNG đụng tệp ngoài write set.

