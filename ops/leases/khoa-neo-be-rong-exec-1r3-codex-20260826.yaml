viec_cua_luot_nay: >-
  LƯỢT 3 — đóng HAI finding P1 của cross-review VÒNG 2 trên PR #317
  (`verdict: changes_requested`, reviewed_sha `b811049d2259ce0780f9320a14a5235d460e0360`).

  Vòng 2 xác nhận P1 vòng 1 (`oid-format-leo-len-kho-cha`) **ĐÃ VÁ THẬT**, và bốn mục còn lại
  ĐẠT: không fail-OPEN trong các alias đo được · `resolve()` xử lý đúng vòng symlink và đường
  dài · ca/mutant mới giết đúng ca đích · hai mỏ neo mutant lượt 1 vẫn có răng.
  KHÔNG mở lại những phần ấy.

  === P1-A `oid-format-root-co-xuong-dong` ===
  `stdout.splitlines()` rồi lấy `ket_qua[0]` giả định đường dẫn top-level chiếm ĐÚNG một dòng.
  Git cho phép tên thư mục có ký tự xuống dòng và trả nguyên đường dẫn, nên output có hơn hai
  dòng ⇒ hàm rơi về `(40, 64)`. Với một OID SHA-256 full-64 và tiền tố 40 của nó, fallback coi
  cả hai là OID đầy đủ ⇒ báo mơ hồ ⇒ `rc=11`.
  ⇒ FAIL-CLOSE MỚI trên một kho HỢP LỆ. Đo: `newline_root_width=(40, 64)`, `newline_root: rc=11`.
  VÁ: lấy trường object-format từ BÊN PHẢI để không cắt vụn top-level. Phép so
  `resolve() != root.resolve()` phải TIẾP TỤC ép ca chẩn-đoán-phụ-ở-đầu-stdout về fallback —
  đó là rủi ro reviewer nêu cho chính cách vá này.

  === P1-B `oid-format-resolve-valueerror` ===
  Khối `except` bắt `(OSError, RuntimeError, subprocess.SubprocessError)` nhưng Python 3.11 ném
  `ValueError` khi đường dẫn chứa byte NUL. Một Git wrapper trả rc=0 và đúng hai trường mà
  top-level như vậy làm TRACEBACK thoát `rc=1`, trong khi hợp đồng của hàm đòi mọi output không
  dùng được phải GIỮ FALLBACK.
  PHIÊN ĐIỀU PHỐI ĐÃ TÁI HIỆN ĐỘC LẬP:
    grep khối except  ->  `except (OSError, RuntimeError, subprocess.SubprocessError):`
    Path('/tmp/a\x00b').resolve()  ->  ValueError: embedded null byte
  VÁ: coi `ValueError` là trạng thái không xác định và giữ fallback. Giữ phạm vi `try` HẸP
  quanh parse/resolve — bắt quá rộng có thể che một `ValueError` lập trình khác.

  CẢ HAI phải có ca khoá + đột biến RIÊNG:
    · ca root có xuống dòng: đòi `rc=0` và bằng chứng dương đếm MỘT; đột biến trả phép tách về
      `ket_qua[0]` phải làm ca ấy ĐỎ.
    · ca Git giả trả output hai trường có đường dẫn không hợp lệ: đòi `rc=0` + đếm MỘT; đột biến
      bỏ riêng nhánh `ValueError` phải làm ca ấy ĐỎ.
  Reviewer ước lượng: P1-A ~2 dòng, P1-B ~1 dòng mã + 8–12 dòng test/mutant. Trần mới 150 cho
  **33 dòng** còn lại — đủ, nhưng KHÔNG rộng. Vượt ⇒ `S2`, DỪNG, đừng cắt phản chứng để lọt trần.

  KHÔNG đụng tệp ngoài write set. KHÔNG mở lại ba ca của lượt 1 hay bản vá toplevel của lượt 2.

