  === (W1) ca KHÔNG DỰNG NỔI FIXTURE trên Windows, và nó ném traceback thay vì khai ===

      ĐỎ  bien_nhan_sha256_root_xuong_dong_dem_MOT: OSError: [WinError 123] The filename,
          directory name, or volume label syntax is incorrect:
          '...\baseline\bien_nhan_sha256_root_xuong_dong_dem_MOT\bnsha256\nroot\.git'

  Win32 KHÔNG cho ký tự xuống dòng trong tên tệp/thư mục. Ca này CỐ Ý dựng một thư mục có
  `\n` trong tên, nên trên Windows nó không thể tồn tại. Hôm nay ca chết bằng traceback —
  tức nó khai KHÔNG ĐO ĐƯỢC bằng cách sập, chứ không bằng lời.

  === (W2) ĐỘT BIẾN MẤT RĂNG trên Windows ===

      ĐỎ  đột biến bien_nhan_bo_nhanh_valueerror:
          ca ['bien_nhan_git_gia_duong_dan_nul_giu_fallback'] VẪN XANH ⇒ ca đó không đo gì

  GIẢ THUYẾT của phiên điều phối, **PHẢI ĐO, ĐỪNG NHẬN**: ca ấy cài một `git` GIẢ bằng tệp
  có shebang `#!/usr/bin/env python3` cộng `chmod +x`, đặt đầu `PATH`. Windows KHÔNG có cơ
  chế shebang, nên `subprocess.run(["git", ...])` không chạy tệp ấy — ca đi một đường khác,
  trả fallback vì lý do KHÁC, và trả fallback ấy dù có hay không có nhánh `except ValueError`.
  Nếu đo ra nguyên nhân KHÁC thì ghi nguyên nhân đo được, đừng chép giả thuyết này.

  === (W3) P2 vòng 3: `try` còn ôm phép LẤY PHẦN TỬ ===

  `.claude/dev/packet_loop.py:1532-1535`. `ket_qua[0]` được đánh giá BÊN TRONG
  `try ... except ValueError`, nên một `ValueError` do lỗi lập trình tại chính phép lấy phần
  tử bị nuốt thành fallback im lặng. Reviewer đo được:

      valueerror_in_removesuffix: propagated=ValueError:injected-removesuffix
      valueerror_in_rsplit:       propagated=ValueError:injected-rsplit
      valueerror_in_indexing:     returned=(40, 64)      <- nuốt

  Vá: đưa `ket_qua[0]` ra TRƯỚC `try`; chỉ `Path(...).resolve()` và phép so ở trong. Đừng
  đưa `Path(...)` ra theo — dựng `Path` từ chuỗi có NUL là chỗ ValueError HỢP LỆ phát sinh.

  === CHUẨN CHO CẢ W1 VÀ W2: "BỎ QUA" PHẢI LÀ MỘT LỜI KHAI, KHÔNG PHẢI MỘT LỖ ===

  Kho này đã trả giá vì ca "có MẶT mà không có ĐO". Nên mỗi chốt bỏ qua phải thoả BỐN điều:
    1. BỎ QUA theo NĂNG LỰC ĐO ĐƯỢC, không theo tên nền. Thử dựng thứ cần dựng; chỉ khi hệ
       điều hành TỪ CHỐI mới bỏ qua. `os.name == "nt"` là danh sách đoán trước — nó cũng tha
       oan cho một Windows tương lai làm được, và không tha cho một hệ tệp Linux không làm được.
    2. IN RA lý do, đúng nếp `BỎ QUA …` đã có trong kho, và ca bị bỏ qua KHÔNG được đếm vào
       số ca ĐẠT.
    3. Bộ chạy đột biến KHÔNG được đòi một ca ĐÃ BỎ QUA phải chết — nhưng cũng KHÔNG được vì
       thế mà coi đột biến ấy là "đã giết".
    4. TRÊN NỀN DỰNG ĐƯỢC (Linux ở đây), ca vẫn CHẠY THẬT và đột biến vẫn GIẾT ĐÚNG nó. Đây
       là chiều bắt-oan: thiếu nó thì bản vá có thể "xanh" bằng cách bỏ qua ở mọi nơi.

  ĐỘT BIẾN BẮT BUỘC — làm cho chốt tha thành VÔ ĐIỀU KIỆN (luôn bỏ qua) thì phải có thứ ĐỎ.
  Không có đột biến ấy thì không ai biết chốt đang đo năng lực hay đang đo một hằng số.

