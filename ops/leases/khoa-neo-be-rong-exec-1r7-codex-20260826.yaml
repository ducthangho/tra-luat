viec_cua_luot_nay: >-
  MỘT việc. Không phải góp ý — có phản chứng chạy được.

  === CHỐT "MỎ NEO CHẾT" BỊ LÀM YẾU CHO 30/75 MUTANT ===

  Lượt 6 thêm cơ chế chạy đột biến nhắm TEST HARNESS, và phân loại nó thế này
  (`.claude/dev/packet_loop_test.py`, trong `main`):

      dot_bien_test = bool(thieu) and all(t in goc_test for t, _ in cap)
      if thieu and not dot_bien_test:        # <- chỉ còn báo MỎ NEO CHẾT ở nhánh này

  `thieu` = mỏ neo KHÔNG tìm thấy trong MÃ SẢN PHẨM. Nên hễ một mỏ neo sản phẩm CHẾT mà
  chuỗi ấy TÌNH CỜ có mặt trong tệp test, lỗi "mỏ neo chết" bị NUỐT và mutant bị đổi thành
  "đột biến test" — chạy im lặng, không ai biết chốt đã mất răng.

  VÀ CHUỖI ẤY GẦN NHƯ LUÔN CÓ MẶT: chính bảng `MUTANTS` nằm TRONG tệp test và chứa mỏ neo
  NGUYÊN VĂN. Đo được: **30/75** mutant có mỏ neo xuất hiện ở CẢ HAI tệp.

  PHẢN CHỨNG (thuần văn bản, không cần chạy suite — dựng lại `dot_bien_test` rồi phá mỏ neo
  trong bản sao mã sản phẩm):

      tran_attempt_3_thanh_99          neo bị phá -> IM LẶNG, coi là đột biến TEST
      void_bo_kiem_hmac                neo bị phá -> IM LẶNG, coi là đột biến TEST
      bien_nhan_khong_leo_len_kho_cha  neo bị phá -> BÁO MỎ NEO CHẾT        (đúng)

  Cái thứ ba đúng CHỈ VÌ mỏ neo của nó kết thúc bằng XUỐNG DÒNG THẬT, còn trong bảng thì
  `\n` là hai ký tự nên không trùng. Tức ranh giới giữa "được canh" và "không được canh" là
  một chi tiết cú pháp NGẪU NHIÊN — không ai chọn nó, và không ai đọc được nó từ mã.

  Đây đúng bài học `CLAUDE.md`: **danh sách CẤM không bao giờ đủ — phải đảo thành danh sách
  CHO PHÉP**. Phân loại phải là KHAI BÁO, không phải SUY LUẬN từ chuỗi.

  PHẢI LÀM:
    · Khai báo TƯỜNG MINH mutant nào nhắm test harness (bảng riêng, hoặc một trường trong
      chính mục ấy). KHÔNG suy từ "chuỗi có mặt ở tệp kia".
    · Mỏ neo chết của một mutant nhắm MÃ SẢN PHẨM phải quay lại **BÁO ĐỎ** vô điều kiện.
    · Mỏ neo chết của một mutant KHAI BÁO nhắm test harness cũng phải BÁO ĐỎ — chốt ấy
      không được biến mất, chỉ đổi tệp mà nó tra.

  CA KHOÁ (bắt buộc, và nó là ca đo LOGIC PHÂN LOẠI chứ không đo một lượt chạy):
    · phá mỏ neo của một mutant nhắm mã sản phẩm **có chuỗi trùng trong tệp test**
      (ví dụ `tran_attempt_3_thanh_99`) ⇒ suite phải ĐỎ với "không tìm thấy mỏ neo";
    · mutant khai báo nhắm test harness vẫn chạy đúng và vẫn giết đúng ca đích của nó;
    · ĐỘT BIẾN: đưa phép phân loại TRỞ LẠI kiểu suy luận `all(t in goc_test ...)` phải làm
      ca khoá thứ nhất ĐỎ. Không có đột biến này thì không biết ca đang đo phân loại hay đo
      một hằng số.

  ĐỪNG mở lại W1/W2/W3 — cả ba đã đúng và đã có răng. Đừng xoá hai đột biến "tha vô điều
  kiện"; chúng là chốt của W1/W2 và đã đo được là giết đúng ca đích.

