thay_the_ly_do: >-
  Đặc tả bản 1 TỰ MÂU THUẪN. Nó khoá write set ở hai tệp mã, viết "KHÔNG sửa bất kỳ tệp
  `.md` nào", và đặt `S1` cấm đường dẫn thứ ba — trong khi CẢ HAI tệp ấy nằm trong gói phát
  hành 180 tệp, nên sửa chúng BẮT BUỘC phải sinh lại `RELEASE_MANIFEST.json`. Không có
  đường nào đi trọn hợp đồng bản 1 mà cổng xanh.

  Đo được: `gate` run `33160410378` trên `381c5711` FAILURE tại bước "release-verify strict
  (manifest khớp cây)"; `package_hash_expected 298108fe…` so `package_hash_current 34163574…`,
  `package_hash_match: false`. Mọi bước gate SAU bước ấy không chạy, nên lượt 1 chưa từng
  được đo trọn.

  Đây là khuyết tật của ĐẶC TẢ, không phải của người thi công — `§3.2` gọi đúng tên: finding
  cho thấy chính spec thiếu thì verdict là `blocked` và đi qua revision mới. Phiên điều phối
  nhận trách nhiệm: khi soạn bản 1 nó không hỏi "hai tệp này có nằm trong gói phát hành
  không", dù kho đã có sẵn `release-verify` để trả lời trong một lệnh.

  Cùng lỗi đọc ấy đã cắn một lần nữa trong CÙNG PHIÊN: lúc đóng PR #123, phiên này đọc việc
  PR ấy sửa `RELEASE_MANIFEST.json` + `CHANGELOG.md` như PHẠM VI THỪA. Không thừa — bắt buộc,
  vì cùng lý do. Hai lần, cùng một chỗ mù.
