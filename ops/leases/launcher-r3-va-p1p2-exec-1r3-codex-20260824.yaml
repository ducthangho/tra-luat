  diff, điều phối commit/push. Căn cứ của (b) là PHÉP ĐO chứ không phải sở thích: sandbox codex
  mount `.git` CHỈ ĐỌC (7 lượt executor) ⇒ executor codex vốn không commit/push được và mọi packet
  vẫn land; hai provider đang bất đối xứng do TÌNH CỜ của sandbox, không do thiết kế. Thêm: tên
  generation branch đổi theo lượt nên luật "khớp chính xác" của (a) phải dựng THEO LƯỢT — thêm máy
  móc cho một năng lực mà phép đo nói không ai dùng, và luật dựng theo lượt lại là chỗ mới để sai.
  CẢ HAI đều là lời giải chính đáng. Chọn (a) ⇒ `S3` kêu: DỪNG, trình phép đo, xin quyết định.
