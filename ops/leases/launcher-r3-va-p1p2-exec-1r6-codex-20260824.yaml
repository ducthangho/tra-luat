      đo được không cần credential (hình dạng argv, schema đóng, mutation) ở lại `launcher_test.py`.
    · Phần đòi process Codex THẬT + event `--json` chuyển thành BẰNG CHỨNG NĂNG LỰC RIÊNG: một
