thay_the_ly_do: >-
  LƯỢT 3 ĐÃ CHẠY DƯỚI r5 VÀ DỪNG ĐÚNG — lỗi là của LEASE, không phải của executor.
  Executor codex (xhigh) khớp băm đầu vào, đo lại `launcher-windows.yml` và xác nhận mâu thuẫn,
  rồi DỪNG TRƯỚC KHI gõ vào write set với lý do: `canh_bao (3)` bảo đọc `vung_duoc_phep_cham`
  "của `r3`", mà trường ấy KHÔNG tồn tại trong `r3`. Executor đã tìm nó trong `r3` tại BỐN SHA
  (`a2ad098b`, `2a40326b`, `d1b20119`, `3143c624`) và trong cả `LEASE.yaml`, không thấy, nên
  ghi `KHÔNG_ĐO_ĐƯỢC` thay vì tự suy §5/§7 là vùng được phép. Đó là hành vi ĐÚNG.
  TRUY NGUYÊN — trường ấy biến mất từ TRƯỚC r5, và đây là lần thứ BA cùng một chỗ hỏng:
    revision 1, 2:  không định nghĩa, không nhắc tới      -> nhất quán
    revision 3:     ĐỊNH NGHĨA 1 lần, nhắc tới 2 lần      -> nhất quán
    revision 4:     ĐỊNH NGHĨA 0 lần, nhắc tới 2 lần      -> CON TRỎ TREO
    revision 5:     kế thừa con trỏ treo, và làm nặng thêm bằng cách khai sai NƠI Ở của trường
  r4 sinh ra để sửa đúng bệnh "chép một luật ở hai chỗ thì hai chỗ sẽ trôi lệch", và nó sửa bằng
  cách TRỎ SANG trường có thẩm quyền — hướng đúng. Rồi chính nó XOÁ MẤT trường được trỏ tới.
  Lượt 2 không vấp vì được giao kèm số dòng cụ thể cho từng finding nên không cần tra vùng; lượt 3
  có mandate rộng hơn nên vấp ngay. Con trỏ nằm im hai revision không phải vì nó lành, mà vì chưa
  ai đi theo nó.
  r6 khôi phục nguyên văn trường từ r3, nới thêm §7 cho lượt 3 (nêu lý do tại chỗ), và sửa
  `canh_bao (3)` để nói rõ trường sống trong LEASE chứ không trong đặc tả.
  Ngân sách, write set, provider, reviewer KHÔNG đổi. Lượt 3 chưa tiêu dòng nào: `git diff` của
  cây executor RỖNG, `numstat` vẫn `90  30`.
