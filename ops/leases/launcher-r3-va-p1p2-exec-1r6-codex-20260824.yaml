  đỏ thường trực là cổng người ta tắt hoặc học cách bỏ qua — tức `r3` tự tay dựng lại đúng bệnh
  "cổng vắng mặt" mà nó sinh ra để chữa.

  HƯỚNG VÁ (connector đề, phiên điều phối đồng ý): TÁCH HAI TẦNG, đừng hạ tiêu chí.
