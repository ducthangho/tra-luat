      process thật ⇒ `KHONG_DO_DUOC` và **chặn**, "không được tính là pass".
    · `r3` §5 đặt TẦNG THI HÀNH vào `.claude/dev/launcher_test.py` + mutation suite.
    · ĐO: `.github/workflows/launcher-windows.yml` chạy `python .claude/dev/launcher_test.py`
      và `--dot-bien`, với `on.push.branches: [master]` + `paths: ['.claude/dev/**']` —
      tức MỌI lần đẩy master chạm `.claude/dev/**` đều chạy, KHÔNG điều kiện nhãn.
    · Runner GitHub KHÔNG có `CODEX_AUTH_JSON`.
