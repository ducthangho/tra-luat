ly_do_cap: >-
  `bang_chung_xanh` chỉ soi HAI NHÓM BẮT của regex, mà ở `MOI` hai nhóm ấy là cặp số CA.
  Cặp số ĐỘT BIẾN nằm ngoài nhóm bắt nên không bao giờ được nhìn tới. Đo 17:45Z
  06-09-2026, gọi thẳng hàm: `TONG: CA 39/39 dat · DOT BIEN 0/0 bi giet` trả `True` —
  đúng hình dạng "tập rỗng thoả `not song`" mà bài học #319 sinh ra để chặn.
  Lỗ có sẵn TỪ TRƯỚC #456; #456 bịt phía Windows và CỐ Ý không bịt phía Linux vì M4 của
  nó đóng băng hành vi Linux (cross-review Codex lượt 1, finding P2; bản vá lùi lại ở
  `426bfc0`).
  ĐO CẢ HAI HƯỚNG rồi mới chọn — đơn vị: số phản chứng đổi màu / số mẫu regex phải sửa.
  Sửa `bang_chung_xanh` soi MỌI cặp `n/m` trong span = 0 mẫu, 1 phản chứng (`50/51`);
  siết từng mẫu `[1-9]\d*` = 2 mẫu, 3 phản chứng. Và hướng "tự nhiên" của B — bắt cặp đột
  biến thành nhóm 3/4 — là HỒI QUY đo được: mệnh đề `len(m.groups()) != 2` trả `True` VÔ
  ĐIỀU KIỆN, nên `CA 0/39` đi từ `False` sang `True`, tức tắt luôn cả chốt CA.
  Lỗ chạm HAI mục `MOI` (`pretooluse_guard_test.py` + `subagent_ghi_detect_test.py`, cùng
  một chuỗi regex, hai dòng kề nhau); 6/13 cặp bằng chứng của cả sổ đăng ký chưa từng
  được kiểm.

