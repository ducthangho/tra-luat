thay_the_ly_do_r3: >-
  MỞ WRITE SET sang `launcher.py` + `launcher_test.py`. Đây là thay đổi write set nên
  §3.2 đòi revision mới; đặc tả đóng băng cũng đi qua bản sửa đổi 3, băm mới `c5e1435eef7c135cab1da0b56a6f07a113dfde964332bb81f2f6ec53b1cdc510`.

  Vì sao: dưới `S3` của bản 2 (cấm đụng launcher), packet buộc phải tái sử dụng MỘT PHẦN
  `_doc_mcp_json`, và chính lựa chọn đó đẻ ra lớp hỏng mới. Hai vòng review đo được:
  vòng 1 — URL và headers đến từ HAI ảnh chụp, có thể gửi token của B tới A;
  vòng 2 — **ABA đánh bại** bản vá so băm (A → B trong lúc launcher đọc → A), hai băm khớp
  mà launcher đã trả URL của B còn client đọc headers của A.

  Đó là MÂU THUẪN KIẾN TRÚC, không phải cẩu thả: ủy quyền thì giết được lớp "hai công cụ
  bất đồng" nhưng buộc hai lần đọc; tự phân tích thì hết đua nhưng tái sinh đúng lớp trôi
  lệch mà packet sinh ra để giết. Không có đường thứ ba TRONG ràng buộc bản 2.

  Đường thoát: `_doc_mcp_json` trả cả `headers` ⇒ MỘT lời gọi, MỘT ảnh chụp ⇒ đua chết theo
  CẤU TRÚC, mà client vẫn không tự phân tích.

  Chủ kho gỡ `S3` in-session 2026-08-27: *"chọn 1, cho sửa launcher.py"*.

