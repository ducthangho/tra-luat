ly_do_cap: >-
  Phép canh mù mà `CLAUDE.md` quy định CHỈ phủ `refs/heads` — cả hai vế của phép so hai nguồn
  đều không đọc `refs/tags`. Đo 2026-09-08: lệnh doctrine cho 307/307, MU = 0 (tuyên SẠCH), trong
  khi cùng kho cùng lúc thiếu 23 tag (62 máy chủ / 39 cục bộ), 20 trong đó thuộc `luu-tru/*` —
  đúng loại ref mà chính `CLAUDE.md` gọi là "ref BỀN duy nhất giữ các commit công bố verdict".
  Hậu quả đo được, không phải suy luận: `doc-claims-check --strict` cho rc=0 ở CẢ HAI vế nhưng
  stdout lệch 7 byte (70861 B thiếu tag / 70854 B đủ tag), vì SHA `1835b46` chỉ tra được qua tag
  `archive/dlbrut-ke-hoach-dau` — kho thiếu tag phân loại nó `SHA_NOT_A_COMMIT`, kho đủ tag phân
  loại `SHA_NOT_REACHABLE`. `rc` KHÔNG phân biệt được hai môi trường ấy.
  Cùng họ bài học "cổng VẮNG MẶT trông giống cổng XANH", đổi đối tượng: một namespace ref không
  được canh trông giống một kho đầy đủ.

