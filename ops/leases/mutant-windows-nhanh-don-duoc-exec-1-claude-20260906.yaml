  `NHANH_DON_DUOC_KHONG_DOT_BIEN`, và dùng nó để cắt đột biến khỏi Windows là KHÔNG PHÁT
  HIỆN ĐƯỢC — lượt chạy đủ 10 đột biến và lượt 0 đột biến in GIỐNG NHAU TỪNG BYTE tại điểm
  quan sát của sổ đăng ký (`8/8`, `rc=0`).
