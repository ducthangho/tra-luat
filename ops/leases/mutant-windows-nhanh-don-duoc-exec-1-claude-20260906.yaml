  cho `rc=0` khi bảng đột biến RỖNG. Và `LO-319-LINUX-BANG-CHUNG-XANH` KHÔNG chữa được nó —
  số đột biến của bộ này CHƯA BAO GIỜ được in ra dưới dạng cặp, nên không có gì để soi.
  Đó là địa điểm THỨ BA của cùng một hình dạng lỗi, và là địa điểm duy nhất mà cách chữa
  phải là IN RA thứ chưa từng in, không phải soi kỹ hơn thứ đã in. Nó mở rộng phạm vi:
  packet này không chỉ cắt đột biến khỏi Windows mà còn làm bằng chứng đột biến của bộ này
  TỒN TẠI ở tầng sổ đăng ký, trên cả hai nền.

