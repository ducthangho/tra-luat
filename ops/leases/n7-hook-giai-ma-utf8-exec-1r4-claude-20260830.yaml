  hỏng được bảo toàn thành surrogate U+DCFF; `t25b` đòi `main()` trả 0 VÀ `_chup` KHÔNG được
  gọi — vế thứ hai mới là phép đo. Kèm `m25` và `m26`.

  P3 (đã vá): hai ca monkeypatch module TOÀN CỤC với phép gán nằm NGOÀI `try`. Reviewer dùng
  `dis.Bytecode` chỉ ra offset chính xác rồi `sys.settrace` ném đúng chỗ đó, đo được rò. Tôi đã
  kiểm chỗ này ở lượt trước và KẾT LUẬN SAI — tôi chỉ ném trong THÂN ca, không ném giữa phép
  gán và `try`. Nay dùng context manager `_tam_thay` với `setattr` nằm TRONG `try`.

  BỐN mutant #412 nay giết đúng đường trên nền ép UTF-8: `m23` sang `t25a`, `m24` sang `t25b`,
  `m25` sang `t25a`, `m26` sang `t25b`; 0 dưới chuẩn.

  Reviewer lượt 5 cũng ĐÓNG ba hướng nghi mà phiên thi công tự nêu: fake TRUNG THÀNH (đo thật
  và đo giả cho cùng chuỗi méo), không va `.pyc`, không rò sentinel giữa các lần nạp.

  hint_provenance lượt 5: finding `rang-cho-hai-lua-chon-errors` và `lo-ro-truoc-finally`,
  reviewer codex, path là tệp TEST thuần nên đủ điều kiện §8-3a, `da_tai_dan_xuat: true` — đọc
  từng hunk, xác nhận hook SẢN PHẨM không đổi, rồi tự đo trên nền ép UTF-8 cộng phép thử
  ném-ngay-sau-`setattr` mà reviewer không nêu.

  SỰ CỐ ĐÃ XẢY RA KHI GHI CHÍNH TỆP NÀY, ghi lại vì nó là bài học của kho lặp lại đúng chữ:
  lượt ghi đầu dùng `io.open(p, "w")` và nội dung có một CHUỖI THOÁT mô tả surrogate. Chuỗi ấy
  bị giải mã thành ký tự surrogate THẬT ở tầng công cụ, nên `encode("utf-8")` ném — SAU khi
  `open(..., "w")` đã truncate. Tệp lease còn 0 byte, và commit lẫn push vẫn chạy tiếp vì
  chúng nối bằng `&&` sau một lệnh python đã thoát khác 0 ở stderr nhưng không chặn chuỗi.
  CHỮA: khôi phục từ commit trước, ghi lại bằng đường NGUYÊN TỬ (tệp tạm cùng thư mục rồi
  `os.replace`), và KHÔNG viết chuỗi thoát nào trong nội dung — mô tả surrogate bằng lời.

