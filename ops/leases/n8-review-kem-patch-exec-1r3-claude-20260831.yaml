  kiện. Nên mọi packet chạm `AGENTS.md` mà không tái sinh manifest đều ĐỎ CI theo kiến trúc.
  Đo với bản sửa tại chỗ: `rc=2`, `failed` có ĐÚNG một mục `AGENTS.md` (5683 → 6484 byte),
  `extra_files: []`, `file_count` giữ 180.
  Vì `file_count` KHÔNG đổi nên golden KHÔNG phải ghi lại (CLAUDE.md §Quy ước deploy mục 5 chỉ
  đòi khi số đếm kiểm kê đổi). Bản vá manifest đo được là ĐÚNG 5 dòng: `total_bytes`,
  `package_hash`, `content_hash`, cộng `size`/`sha256` của mục `AGENTS.md`.
  Phiên thi hành DỪNG đúng theo `S1` thay vì tự chạm đường thứ ba — hành vi ĐÚNG, và chính nó
  làm lộ thiếu sót của điều phối. Bài học đã có từ đợt `r291` (packet docs-only ăn hai vòng CI
  đỏ vì lý do y hệt) mà điều phối vẫn không hỏi câu "tệp này có trong manifest không".
  Trần dòng nâng 200 → 210 CHỈ để chứa 5 dòng manifest, không phải để nới cho phần văn bản.

