  Phản chứng: lane chọn `max`, rollout ghi `xhigh`, validator trả `rc=0` ⇒ FALSE GREEN.
  Tức phiên thi hành vá fail-open ở một mặt rồi MỞ LẠI ĐÚNG LỚP LỖI ẤY ở mặt kia — và chính nó
  tự khai như vậy. Chữa bằng MỘT NGUỒN SỰ THẬT cộng guard rỗng/ngoài-tập, đo được ba vế:
  nền PASS · đột biến gán cứng validator FAIL · đột biến gán cứng lệnh phóng FAIL; và trên
  rollout THẬT: `xhigh` rc=0, `max` rc=1 (`SAI BAC`), `low` rc=1.

  P2: `§7` xuất hiện ĐÚNG 0 lần trong `SKILL.md` trong khi `AGENTS.md` đã trỏ — hai tệp nói hai
  điều khác nhau. Đo lại sau vá: 2 lần. Adapter TRỎ §7 chứ không chép bốn điều kiện vào.

  `diff.patch` báo `byte_equal=False` KHÔNG phải lỗi bundle: reviewer tự truy ra `git diff` từ
  mirror BARE rút gọn index hash thành 8 ký tự (8191 byte) còn cây ghim `abbrev=7` cho 8185 =
  bundle. Đây là ca hiếm reviewer tự bác phát hiện của chính mình bằng phép đo.

  Điều phối kiểm độc lập, ba lời khai KHỚP: head `a11943f7`; `75 1` + `14 0` + `5 5` = 3 tệp /
  94 dòng thêm; không đường thứ tư; `§7` nay có 2 lần trong `SKILL.md`.

  CHƯA GIẢI QUYẾT — P1 write set chứa tệp land-only: `RELEASE_MANIFEST.json` vẫn trong
  `write_set` và vẫn có trong diff (`5 5`). Protocol dòng 652 cấm worker sửa tệp ấy, dòng 710
  nói CI worker KHÔNG so feature branch với manifest committed. Nhưng `ci.yml` LẠI chạy
  `release-verify --strict` vô điều kiện. Đó là MÂU THUẪN giữa protocol và cấu hình CI thật,
  không phải lỗi của phiên thi hành — và gỡ manifest ra sẽ làm CI đỏ. Cần quyết định của chủ
  kho, ghi ở đây để không bốc hơi.

