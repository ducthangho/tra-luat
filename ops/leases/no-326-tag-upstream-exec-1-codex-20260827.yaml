viec_cua_luot_nay: >-
  MỘT việc: phép kiểm TỒN TẠI của ref upstream phải hỏi ĐÚNG CÂU HỎI.

  === HIỆN TƯỢNG ===

  Git cho phép nhánh theo dõi ref cục bộ NGOÀI `refs/heads`/`refs/remotes`:

      git config branch.tagup.remote .
      git config branch.tagup.merge  refs/tags/v1
      -> %(upstream) = refs/tags/v1
      -> git branch -vv:  tagup 81ded08 [v1] ...
      -> git status -sb:  ## tagup...v1

  Git coi đó là upstream HỢP LỆ. Nhưng `_cac_ref_cuc_bo()` chỉ đưa `refs/heads/*` và
  `refs/remotes/*` vào `tap_ref`, nên phép kiểm thành viên ném KHÔNG_XÁC_ĐỊNH:

      CHAN [12]: KHÔNG_XÁC_ĐỊNH: tagup khai upstream không có ref: refs/tags/v1

  CHẶN OAN — và ĐO ĐƯỢC ngay cả khi nhánh BẰNG upstream (0/0), tức chẳng có gì để chặn.

  === GỐC ===

  Mã đang dùng `tap_ref` — TẬP REF MÀ BỘ QUÉT LEASE DÙNG — để trả lời câu hỏi
  "ref này có TỒN TẠI không". Hai câu hỏi KHÁC NHAU:

      "ref này có thật không"                  -> hỏi git
      "ref này có trong phạm vi quét lease không" -> hỏi tap_ref

  === PHẢI LÀM ===

  1. Kiểm tồn tại ĐỘC LẬP (ví dụ `git rev-parse --verify <ref>`), KHÔNG hỏi `tap_ref`.
  2. TUYỆT ĐỐI KHÔNG mở phạm vi quét lease sang `refs/tags/*`. Lease KHÔNG được đọc từ tag.
     Connector cảnh báo đúng chỗ này: *"ensure that broader existence checking does not cause
     leases on tags to be scanned."* Đây là hai thay đổi RIÊNG BIỆT; chỉ làm cái thứ nhất.
  3. GIỮ NGUYÊN hai chốt đã có của #326:
     · khai upstream mà git KHÔNG giải được (`%(upstream)` rỗng nhưng có config)
       -> vẫn fail-CLOSE `KHÔNG_XÁC_ĐỊNH`  (`khaihong`, `khaihongkhongref`)
     · `remote="."` trỏ `refs/heads/*` -> vẫn QUA  (`remotecham`)

  === CA KHOÁ — rig có MƯỜI HAI nhánh, ĐÃ KIỂM trước khi giao ===

      (mười trạng thái của #326 giữ nguyên, phải không đổi hành vi)
      tagup      remote="." merge=refs/tags/v1, BẰNG   (0/0) -> QUA          [MỚI]
      tagupsau   remote="." merge=refs/tags/v1, TỤT SAU (0/1) -> KHÔNG được
                 `KHÔNG_XÁC_ĐỊNH`. Phân loại nó NHƯ MỌI upstream khác (tức TỤT_SAU).
                 Nếu bạn cho rằng phát lệnh chữa tới một TAG là sai, DỪNG và khai —
                 đừng tự chọn.

  Kiểm bằng chính mã trên master trước khi giao: `tagup` (0/0) vẫn bị
  `KHÔNG_XÁC_ĐỊNH`. Nên `KHÔNG_ĐO_ĐƯỢC` là câu trả lời ĐÁNG NGỜ.

  === ĐỘT BIẾN BẮT BUỘC ===

      · quay lại hỏi `tap_ref` thay vì kiểm độc lập   -> tagup ĐỎ
      · đưa `refs/tags/*` vào phạm vi quét lease       -> phải ĐỎ (mở đúng lỗ mục 2 cấm)
      · gỡ chốt fail-close khai-hỏng                    -> khaihong ĐỎ
      · chặn oan `remote="."` trỏ refs/heads           -> remotecham ĐỎ

  Mỗi đột biến chạy trong THƯ MỤC RIÊNG.

  === ĐỪNG ===

  ĐỪNG đụng `t102`–`t114`. ĐỪNG sửa rig cho khớp mã — rig là ĐỀ BÀI.
  Rig sạch: `rig/rig_v4.sh <thư-mục-MỚI>`.

