thay_the_ly_do: >-
  Lượt 1 đúng hướng và đã xanh CẢ HAI nền CI trên `5ad81a5`, nhưng cross-review (connector,
  thread `r3869605801`) đo được một **P2 THẬT**: `git rev-parse --verify` dùng BỘ PHÂN TÍCH
  REVISION MỞ RỘNG của git, nên nó giải được cả BIỂU THỨC chứ không chỉ ref.
  Phiên điều phối tái hiện được, git 2.43.0, tag ANNOTATED + `branch.X.merge=refs/tags/v1^{}`:
    %(upstream)                          = refs/tags/v1^{}
    rev-parse --verify --end-of-options  -> rc=0 kèm SHA
    show-ref  --verify --                -> rc=1   (KHÔNG phải ref thật)
  Và cổng HÀNH ĐỘNG theo đó — trên rig có nhánh tụt sau biểu thức, nó phát:
    chữa: git branch -f tagpeel 'refs/tags/vann^{}'
  tức lệnh chữa trỏ tới một BIỂU THỨC, không phải ref.
  Trần, write set, provider, reviewer KHÔNG đổi. KHÔNG nới trần (100/300, còn 200 dòng).
  Đây là vòng review thứ 2 — ĐÚNG trần ADR-0043 của packet MỚI, không cần `nang_tran`.

viec_cua_luot_2: >-
  MỘT việc, và nó là CÙNG MỘT HÌNH DẠNG lỗi mà lượt 1 vừa sửa — nên đọc kỹ chỗ này.

  === HÌNH DẠNG ===

  Lượt 1 thay câu hỏi SAI này:
      "ref có nằm trong TẬP QUÉT LEASE không"   (tap_ref)
  bằng câu hỏi vẫn SAI:
      "chuỗi này có GIẢI được thành object không"  (rev-parse --verify)
  Câu hỏi ĐÚNG là:
      "chuỗi này có phải MỘT REF TỒN TẠI không"    (show-ref --verify)

  Ba câu khác nhau. `--end-of-options` chặn tiêm CỜ, nhưng KHÔNG tắt bộ phân tích revision.

  === PHẢI LÀM ===

  1. `_ref_ton_tai()` dùng `git show-ref --verify --quiet -- <ref>` (ref CHÍNH XÁC).
     `git show-ref -h` nói rõ `--verify` đòi đường dẫn ref chính xác.
  2. Cộng thêm phép KIỂM HÌNH DẠNG: giá trị phải là một refname hợp lệ trước khi hỏi git.
     Gợi ý: `git check-ref-format <ref>`. Không hợp lệ ⇒ `KHÔNG_XÁC_ĐỊNH` (fail-CLOSE),
     KHÔNG lùi về tên.
  3. GIỮ NGUYÊN mọi thứ lượt 1 và #326 đã khoá:
     · `_cac_ref_cuc_bo` KHÔNG được đụng — phạm vi quét lease KHÔNG mở rộng
     · `tagup` (`remote="."` + `merge=refs/tags/v1`, ref THẬT) vẫn QUA
     · `khaihong`/`khaihongkhongref` vẫn fail-close · `remotecham`/`thuancucbo` vẫn QUA

  === CA KHOÁ — rig có MƯỜI BA nhánh, ĐÃ KIỂM trước khi giao ===

      (mười hai trạng thái cũ giữ nguyên hành vi)
      tagpeel   remote="." merge='refs/tags/vann^{}' (tag ANNOTATED), TỤT SAU (0/1)
                -> phải `KHÔNG_XÁC_ĐỊNH`, và TUYỆT ĐỐI không phát lệnh nào       [MỚI]

  Kiểm bằng chính mã lượt 1 trước khi giao: nó phát
  `git branch -f tagpeel 'refs/tags/vann^{}'`. Nên `KHÔNG_ĐO_ĐƯỢC` là câu trả lời ĐÁNG NGỜ.

  Nhắc: cổng fail-close ở nhánh ĐẦU TIÊN gặp lỗi và `khaihong` đứng trước theo thứ tự chữ
  cái. Để nhìn riêng ca tag, tạo BẢN SAO rig rồi `git config --unset` hai khoá của
  `khaihong`/`khaihongkhongref`. Đó là bản sao để ĐO — KHÔNG phải sửa rig gốc.

  === ĐỘT BIẾN BẮT BUỘC ===

      · quay lại dùng `rev-parse --verify`      -> tagpeel ĐỎ
      · gỡ phép kiểm hình dạng refname          -> tagpeel ĐỎ (hoặc ca hình dạng riêng)
      · đưa `refs/tags/*` vào phạm vi quét lease -> phải ĐỎ (điều cấm của lượt 1)
      · chặn oan `tagup` (ref tag THẬT)          -> tagup ĐỎ

  Mỗi đột biến chạy trong THƯ MỤC RIÊNG.

  === ĐỪNG ===

  ĐỪNG đụng `t102`–`t115`. ĐỪNG sửa rig cho khớp mã. Rig sạch: `rig/rig_v5.sh <thư-mục-MỚI>`.
