# ═══ HAI TRỤC, CƯỠNG CHẾ ĐỘC LẬP — chốt của người giữ kho, 2026-08-20 ═══
#
# ĐỊNH NGHĨA (viết ra vì lượt trước phiên điều phối đã GỘP hai trục và đếm sai):
#
#   attempt = MỘT LẦN EXECUTOR TUYÊN BỐ DONE — tức trình ra một head nó tin là xong.
#             KHÔNG phải một lần gọi tiến trình. Executor iterate bên trong bao nhiêu
#             lần cũng được (code, tự review, vá, chạy lại) cho tới khi nó tuyên bố xong.
#             CI ĐỎ sau khi đã tuyên bố DONE ⇒ attempt ấy ĐÃ TIÊU.
#             Báo BỊ CHẶN (spec hỏng, chốt ngoài write set) KHÔNG tiêu attempt — không
#             có head nào được trình ra.
#
#   call    = trục CHI PHÍ. Đếm lần gọi tiến trình / token. Cưỡng chế RIÊNG.
#
# VÌ SAO TÁCH: đây đúng doctrine kho đã có cho phía review — §10 định nghĩa một VÒNG là
# "một lượt reviewer trả verdict trên một exact head", neo vào HEAD chứ không neo vào lần
# gọi, và tách `review_rounds` (canon) khỏi `review_calls` (chi phí) kèm câu "hai trục
# cưỡng chế độc lập, đừng gộp hai trục". Phía executor phải đối xứng.
#
# VÌ SAO KHÔNG ĐẾM LẦN GỌI: số lần gọi là TẠO TÁC CỦA HẠ TẦNG, không nói gì về công việc.
# Lượt này phải gọi lại codex chỉ vì sandbox của nó mount `.git` read-only nên không
# commit được. Một ngân sách phụ thuộc chuyện đó là đo NHIỄU, không đo hội tụ.
#
# TÍN HIỆU MÀ TRẦN NÀY BẢO VỆ: "hai lần anh nói XONG mà chưa xong" — đó mới là dấu hiệu
# về CÁCH LÀM. Hết trần ⇒ DỪNG, xử cách khác, không tự nới.

