  - id: PLAT-X8-bang-dung-hay-khong-KHONG-DO-DUOC
    noi_dung: >-
      Cổng mua tính NHẤT QUÁN, không mua tính ĐÚNG của `_BANG_LOP`. Không phép thử nào trong write
      set biến một dòng bảng sai thành ĐỎ. Dưới bảng seed, 15/15 đường dẫn từng xuất hiện trong
      `write_set` đều ra `sensitive`, và 6/10 lease khai lớp sẽ bị NÂNG. Người giữ kho đã có con số
      này trên bàn 21-08 và quyết GIỮ NGUYÊN; nới bảng là packet riêng.
  - id: PLAT-X8-reviewer-luon-sensitive-cho-toi-khi-co-trang-thai-BEN
    noi_dung: >-
      Q1 đã THU HỒI: lease reviewer ra `sensitive` VÔ ĐIỀU KIỆN. Giá hôm nay = 0; giá TƯƠNG LAI có
      thật, sau khi bảng được nới. Đừng dựng lại đường kế thừa cũ — `A3`/`A13` khoá sự VẮNG MẶT của
      nó và sẽ ĐỎ khi nó quay lại.
  - id: PLAT-X8-Q6-that-thu-tu-cap-lease
    noi_dung: >-
      Q6 thắt thứ tự: executor TRƯỚC, reviewer SAU. Packet do người giữ kho tự làm executor không
      bao giờ có lease executor ⇒ mọi reviewer lease của nó thành `sensitive`.
  - id: PLAT-X8-canh-bao-dung-tren-du-lieu-TU-KHAI
    noi_dung: >-
      Cảnh báo của mục tiêu 7 đứng trên `leased_at_utc` — trường KHÔNG cổng nào kiểm, và đã tồn tại
      một lease khai mốc ở TƯƠNG LAI mà vẫn hợp lệ. Cố ý để là CẢNH BÁO: chốt đứng trên dữ liệu tự
      khai là chốt lừa được. Chốt thật thuộc gói spec-gate (mục D), chưa mở Issue.
  - id: PLAT-X8-KHONG-doc-risk-va-diff-that
    noi_dung: >-
      §8:567 đòi BA đầu vào — `risk`, effective write set, `diff thật`. Cổng này có một rưỡi.
      `grep '^risk:' ops/leases/` = 0 tệp. Với lease EXECUTOR, `diff thật` KHÔNG TỒN TẠI lúc cổng
      chạy (cổng chạy lúc ĐĂNG, trước khi executor viết dòng nào) ⇒ cổng đo LỜI KHAI VỀ PHẠM VI,
      không đo phạm vi ĐÃ XẢY RA. Trên đường REVIEWER thì exact head có thật. Chốt hậu-diff ở lượt
      LAND là gói RIÊNG.
  - id: PLAT-X8-schema-version-KHONG-TU-LAN
    noi_dung: >-
      `schema_version: 2` không tự lan. Ai quên bump được tha im lặng; mục tiêu 7 chỉ in cảnh báo.
  - id: no-R2-KHONG-thuoc-packet-nay
    noi_dung: >-
      Nợ `no-R2-van-mo` chỉ kích hoạt khi packet chạm `.claude/dev/launcher*`. Write set này KHÔNG
      chạm ⇒ nợ vẫn mở và KHÔNG phải việc của lượt này.
  - id: SO-LEASE-KHONG-NAM-MOT-CHO
    noi_dung: >-
      Vẫn MỞ. Lượt cấp này lại phải quét tay 162 ref vì kho chưa có lệnh nào trả lời *"lease nào
      đang giữ đường dẫn X"*. Biên bản `ops/RUT_LEASE_PLAT_X8_20260821.md`.
  - id: AG-T0-01B-thu-hoi-lease-chua-co-duong
    noi_dung: >-
      Đo được thành số ở lượt này: 9 lease CHƯA HẾT HẠN giữ `ops/lease_publish*` mà cả 9 thuộc packet
      ĐÃ LAND — 9 quyền ghi còn sống sau khi việc xong (lần đo trước: 5). Không trường nào trong tệp
      lease đánh dấu "việc đã xong", nên phân biệt sống/chết phải đi tìm HIỆN VẬT trên master.
