  đo 48 lease có cả hai trường ⇒ **44 BẰNG / 4 LỆCH**. Cổng `check` đòi đúng 40 hex thường và
  nói thẳng lý do (*"SHA ngắn hoặc lệch dạng là mỏ neo GIẢ"*), nên trường này KHÔNG có chỗ cho
  trạng thái thứ ba.
  BẢN ĐẦU CỦA TỆP NÀY GHI `KHONG_DO_DUOC_LUC_CAP` và cổng chặn `rc=8`. Lý lẽ khi ấy — *"head
  phải review là head SAU merge, chưa tồn tại"* — ĐÚNG về sự việc nhưng SAI về trường: `6b46012`
  là một commit THẬT, đã đẩy, và nó là MỐC BẮT ĐẦU chứ không phải lời khai về head cuối. Ghi một
  SHA thật vào một trường nghĩa là "neo từ đâu" không phải bịa; bịa là gõ một chuỗi hex không ứng
  với commit nào — đúng lỗi phiên này đã tự bắt ở gen 2. Hai thứ khác nhau, và bản đầu gộp chúng.
  GIỚI HẠN, khai thẳng vì cổng không khai hộ: head mà lượt 3 THỰC SỰ review là head SAU commit
  merge `dc02c9b` vào nhánh packet, và commit ấy CHƯA TỒN TẠI lúc cấp. Nên `reviewed_sha_required`
  ở đây là **cận dưới**, không phải head cuối; head thật được ghi vào `VERDICT.md` và vào biên
  nhận của lượt 3. Đừng đọc trường này thành "lượt 3 phải review đúng `6b46012`" — `M8` của chính
  packet này cấm review một bản sắp bị thay.

