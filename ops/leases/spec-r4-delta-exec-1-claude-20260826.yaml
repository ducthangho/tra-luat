viec_cua_luot_nay: >-
  Dựng `ops/specs/t33-doi-shellcheck-r4.md` — bản DELTA, không phải bản viết lại.

  === NỘI DUNG BẮT BUỘC ===

  (1) HẠ HAI CÂU hình dạng `A` xuống đúng phép đo. Cả hai là CÙNG MỘT CÂU, nguyên văn, chỉ khác
  con số đi kèm:
      `ops/specs/t33-doi-shellcheck-r2.md:232`   (đi với `88/88`)
      `ops/specs/t33-doi-shellcheck-r3.md:192`   (đi với `97/97`)
      > "…thay mệnh đề nền bằng phân biệt theo TÊN TỆP vẫn cho 88/88,
      >  rc=0 trên toàn chân Ubuntu (đo 23-08-2026). Ca này khoá đúng cái trục ấy."
  Sai ở chỗ: đột biến ấy CHƯA TỪNG được đẩy lên CI, nên nó chưa chạy trên một runner Ubuntu nào —
  nó chạy trong một worktree CỤC BỘ. `"toàn chân Ubuntu"` chỉ cả job/leg CI.
  Bản hạ phải nói ĐÚNG thứ đã đo: một lượt chạy cục bộ, ngày nào, và KHÔNG khai chân CI nào.

  (2) GHI NHẬN `r2:215` VÀ NÓI RÕ NÓ NGOÀI PHẠM VI — không sửa, không im lặng.
  Câu: "…nó làm cổng nền tra theo một trục hoàn toàn khác mà **toàn bộ chân Ubuntu im lặng**".
  Lý do ngoài phạm vi, phải viết ra chứ không chỉ khẳng định: nó là GIẢI THÍCH cho bảng đo ngay
  trên nó, không phải BẰNG CHỨNG; nội dung của nó SUY RA ĐƯỢC (`t73` truyền `nen="posix"` trùng
  `os.name` thật của runner Linux nên gỡ mệnh đề nền là NO-OP với nó); và cơ chế phân biệt được
  NÊU NGAY TẠI CHỖ (8 dòng `BỎ QUA` trên chân `windows-latest`) nên người đọc kiểm được.
  KÈM luật rút ra để lần sau không phải hỏi lại: hình dạng `A` là về BẰNG CHỨNG; một câu nhắc
  phạm vi trong lúc GIẢI THÍCH một con số đã nêu ở chỗ khác thì soi bằng thước khác.
  VÀ KHAI THẲNG: đây là kết luận của một LẬP LUẬN, không phải của một phép đo; không cổng nào
  phân xử được nó. Câu này đã được hỏi HAI lần — ghi ra để lần thứ ba không ra đáp án khác.

  (3) KHỐI ĐÁNH DẤU MÁY ĐỌC ĐƯỢC ở đầu tệp, dạng YAML front-matter, kèm MỘT trường khai thẳng
  rằng hình dạng này là TẠM và packet "cơ chế trạng thái đặc tả" được phép đổi hoàn toàn. Thiếu
  trường ấy là lén đặt trước giao diện cho một packet chưa được thiết kế.

  (4) NÓI RÕ `r4` LÀ DELTA: nó KHÔNG thay thế `r2`/`r3` toàn phần, chỉ thay hai chỗ đã nêu; mọi
  phần khác của `r2`/`r3` GIỮ NGUYÊN hiệu lực. Ai neo băm `r2`/`r3` vẫn neo đúng — hai tệp ấy
  KHÔNG đổi một byte nào.

  === TỰ CHỊU CHÍNH PHÉP THỬ MÌNH ĐANG ÁP ===
  `r4` là một văn bản đầy lời khai. Một bản đặc tả sửa lỗi "khai rộng hơn đo" mà TỰ khai rộng hơn
  đo thì tệ hơn không sửa — `r4` của #314 đã mắc đúng thế (khai "sửa ĐÚNG MỘT lời khai" trong khi
  cùng tệp ghi "CHƯA AI QUÉT"), và `r5` bị thu hồi một phần cũng vì lặp lại nó BA lần.
  Cụ thể: đừng khai "đã quét hết". Số đo được là HAI chỗ hình dạng `A` cộng MỘT chỗ cần người
  quyết; "chỉ ba" là kết luận của MỘT phép quét theo cụm từ — tức một DANH SÁCH ĐOÁN TRƯỚC —
  không phải một chứng minh.

