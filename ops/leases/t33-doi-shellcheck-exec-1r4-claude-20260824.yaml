    #249 đòi `t33` ĐỎ khi thiếu `shellcheck`. Hai luật khác nhau cho cùng một lỗ. Lượt này
    KHÔNG giải mâu thuẫn ấy — nó nhường phần công cụ cho #290 và chỉ làm phần #290 không chạm.
  giao_duong_dan_voi_290: 'KHÔNG — đo 23-08: comm giữa hai write set = RỖNG. Trùng CHỨC NĂNG, không trùng đường dẫn.'
