# ── BẢN SỬA ĐỔI 4 THÊM TỪ ĐÂY ────────────────────────────────────────────────
# Khoá MỚI, KHÔNG trùng tên khoá nào ở trên. `nang_tran` của r3 nói về vòng review
# PR #288 (đặc tả) và GIỮ NGUYÊN; trần của PR #293 (thi công) là chuyện khác, nên
# nó mang tên riêng `nang_tran_pr293`. Đặt hai bảng cùng tên là mất dữ liệu im lặng
# — bài học "bảng TOML trùng tên" đã trả giá bốn lượt review.

ghi_de_byte_identity_voi_dac_ta:
  dieu_bi_ghi_de: >-
    `canh_bao_cho_nguoi_thi_hanh` (1) của r1/r2/r3 — "ca là t98, chép NGUYÊN VĂN từ r3, KHÔNG tự
    nghĩ lại (r4/Q13)". Cả hai lượt cross-review đã ĐO và xác nhận byte-identity: khối 14 dòng
    băm 4c9b223d3e5edd4a ở CẢ HAI phía, 670 byte, `cmp` rỗng.
  ai_ghi_de: ducthangho
  tham_quyen: §2 — start/pause/resume/reroute/override/authorize thuộc chủ kho
  quyet_dinh_luc: >-
    direct, in-session, 2026-08-24 — sau khi được trình verdict lượt 2, finding P2, và BA đường
    (a) đặc tả r4 rồi chép lại · (b) ghi đè có vết · (c) land nguyên trạng, kèm khuyến nghị (a):
    "vá đi và review lại nếu cần nới thì tôi cho phép".
  do_duoc_sau_khi_va:
    khoi_14_dong_trong_ma: 1ed3eb53770076d6
    khoi_14_dong_trong_r3: 4c9b223d3e5edd4a
    con_khop: false
    pham_vi_lech: >-
      ĐÚNG MỘT dòng docstring (dòng 3134). Thân ca — `def bo()`, lời gọi `_chay_main_meta(bo, "nt")`,
      phép `bang(...)` — KHÔNG đổi một byte. `git diff efcf5757..3239279b` = 1 tệp, +1/−1.
  he_qua_khai_thang: >-
    Mã nay KHÁC đặc tả đóng băng r3 ở một dòng. Ai đối chiếu t98 với r3 về sau sẽ thấy lệch và
    PHẢI đọc bản ghi này để biết đó là cố ý, không phải executor tự nghĩ lại. Đó chính là lý do
    khối này tồn tại: r4/Q13 sinh ra để chặn hình dạng E, và bỏ nó mà không ghi vết thì lần sau
    không ai phân biệt được "ghi đè có phép" với "tự ý chế lại".
  dac_ta_tren_master_VAN_SAI: >-
    `ops/specs/t33-doi-shellcheck-r3.md:192` trên master vẫn mang nguyên câu "trên toàn chân
    Ubuntu". Lượt này CỐ Ý không sửa: lease cho ĐÚNG MỘT đường dẫn, và sửa đè một đặc tả đóng
    băng làm hồ sơ mất dấu. Đường đúng là một bản đặc tả r4 (delta) — đã tách Issue riêng.
    Nói thẳng hệ quả: chừng nào r3:192 còn nguyên thì AI CHÉP LẠI r3 SẼ CHÉP LẠI ĐÚNG CÂU ẤY.

nang_tran_pr293:
  ai_nang: ducthangho
  tham_quyen: §2
  quyet_dinh_luc: direct, in-session, 2026-08-24 — "nếu cần nới thì tôi cho phép"
  adr: ADR-0043
  tran_cu: 2
  tran_moi: 4
  pham_vi: >-
    Vòng review của PR #293 (THI CÔNG). KHÔNG dính tới `nang_tran` ở trên, vốn nói về vòng review
    của PR #288 (ĐẶC TẢ) và giữ nguyên tran_cu 2 → tran_moi 4 với căn cứ riêng của nó.
  can_cu: >-
    ĐO được, không phải ước lượng. Lượt 1 = approve, 0 finding. Lượt 2 = changes_requested, ĐÚNG
    MỘT finding P2, và nó nằm trong write set. Lượt 3 tồn tại vì bản vá của lượt 2 CHƯA TỪNG được
    một bên độc lập kiểm — chính bản vá ấy có thể tái tạo khuyết tật nó sửa (lời khai mới
    "rc=0 khi chạy cục bộ trên Linux" cũng là một lời khai, và nó vừa được một vòng review chấp
    nhận nên là chỗ khó thấy nhất). Tức các vòng thêm KHÔNG do đặc tả không hội tụ mà do MỖI vòng
    tìm ra một lớp lỗi lớp trước không với tới được — đúng lý do ADR-0043 cho phép nới có căn cứ.
  canh_bao: >-
    Khối này KHÔNG được cổng cưỡng chế. Đo 23-08: `ops/lease_publish.py` có 0 lần nhắc `nang_tran`
    và 0 cơ chế đếm vòng review. ĐO THÊM 24-08: `packet_loop.py record-review` TỪ CHỐI ghi lượt 2
    vì state đã là `accepted` sau lượt 1 — máy KHÔNG có đường lùi từ `accepted` khi có bằng chứng
    mới, nên sổ cục bộ đang nói "approve, 0 finding" trong khi bằng chứng mới nhất là
    changes_requested + 1 P2. Bộ đếm vòng lại sống trong `.claude/.packet_state/` vốn gitignore và
    KHÔNG sống sót qua container. Ba khuyết tật độc lập, cùng một hệ quả: trần ADR-0043 hiện
    KHÔNG cưỡng chế được xuyên phiên. Sự có mặt của khối này là hiện vật TỰ NGUYỆN.

noi_da_duoc_cho_phep_ma_KHONG_dung:
  duoc_cho_phep: >-
    Chủ kho cho phép nới không giới hạn loại ("nếu cần nới thì tôi cho phép").
  khong_dung_cho: >-
    KHÔNG nới write set. Đường dẫn vẫn ĐÚNG MỘT: `ops/lease_publish_test.py`. Bản vá P2 nằm TRỌN
    trong đó nên không cần nới. Cụ thể, KHÔNG thêm `ops/specs/**` để sửa r3:192, dù việc ấy có lý
    và dù đã được cho phép trước.
  vi_sao: >-
    Được phép nới không phải lý do để nới. Trần là NGƯỠNG, không phải hạn mức phải tiêu — chính
    câu `write_set_note` của r3 đã nói thế về suất tệp còn dư của ADR-0044. Sửa một đặc tả đóng
    băng đang được lease này NGHIM BĂM, ngay trong lượt thi công mà lease ấy cấp phép, là để mã
    và đặc tả cùng trôi trong một commit — không bên nào còn làm mốc cho bên nào.
