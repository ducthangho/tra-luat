  quyet_dinh: 'chủ kho, direct in-session 2026-08-23 ("Đồng ý (2)")'
  bo_khoi_luot_nay: [M1, M2]
  bo_khoi_write_set: [ops/cai_actionlint.sh]
  vi_sao: >-
    Packet #290 `HA-TANG-CONG-CU-TAT-DINH` (PR #291, ĐANG MỞ, exact head 134b5a04) xây ĐÚNG
    thứ M1/M2 nhắm tới, và rộng hơn: `ops/cong_cu.yaml` là bản kê MỘT NƠI cho
    `bat_buoc`/`ban_ghim`/`probe`/`cai`/`canary`; `ops/cai_cong_cu.sh` cài rồi ĐO LẠI;
    `ops/canary/actionlint_shellcheck.yml` là fixture `SC1003` chứng minh tầng luật shell CÓ
