# Lease REVIEWER — `ops-don-ref`: cho `tao-tag` tạo được `luu-tru/*`.
#
# NGUỒN SỰ THẬT LÀ TỆP NÀY. Comment trên #55 chỉ là bản chiếu.
#
# VÌ SAO CÓ LƯỢT NÀY. Workflow `ops-don-ref.yml` TỰ CHẶN TRÌNH TỰ CHÍNH NÓ QUY ĐỊNH:
# nhánh `xoa-nhanh` dặn "Tạo tag TRƯỚC (hành động tao-tag), rồi mới xoá", mà `tao-tag`
# lại từ chối đúng không gian tên `luu-tru/`. Đo trên lượt chạy THẬT (thử khô):
#   tao-tag luu-tru/doctor-github-mcp-verdict-6 -> "DỪNG: … Đặt tên khác." (rc=2)
# Và đây là đường DUY NHẤT để phiên web tạo tag — đẩy `refs/tags/*` bị proxy chặn 403.
#
# CHỖ ĐÁNG SOI NHẤT: đây là bản vá MỞ một chốt an ninh. Mở đúng chỗ thì trình tự chạy
# được; mở rộng một li thì thành lỗ. Nên mục kiểm 1 hỏi thẳng: mở `tao-tag` có kéo theo
# mở `xoa-tag` hay `xoa-nhanh` không.
#
# VÀ MỘT CẢNH BÁO VỀ CÁCH VÁ SAI TRÔNG NHƯ ĐÚNG: chốt `xoa-nhanh` hỏi "còn tag nào giữ
# commit ấy không" chứ KHÔNG hỏi tag tên gì — nên "đặt tên khác cho xong" VẪN QUA được
# chốt ấy, workflow vẫn chạy, ca vẫn xanh, mà quy ước không gian tên (`CLAUDE.md`: ref
# BỀN duy nhất giữ commit verdict) thì đã hỏng. Mục kiểm 3 giao cho reviewer bác nếu sai.

