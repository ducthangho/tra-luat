  quét toàn kho (309 nhánh + 62 tag) chỉ ra 10 verdict đánh số 6–15; lượt 1–4 không hiện vật,
  lượt 5 có hiện vật TỰ PHỦ ĐỊNH. Tổng ≥ 8 lượt không verdict bền — và đó là cận DƯỚI.
