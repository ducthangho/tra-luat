phien_thi_hanh: >-
  Packet do một PHIÊN KHÁC thi hành. Phiên ghi lease này là ĐIỀU PHỐI và KHÔNG thi công.
  Khác packet N7, nơi hai vai nhập nhằng trong cùng một phiên và cross-review đã bắt đúng đó
  (`PROTOCOL:27-29` buộc một phiên một vai trên một đơn vị công việc; `:47-50, 202-206` chỉ cho
  cùng tác nhân giữ vai khác nhau ở NHỮNG PHIÊN KHÁC NHAU).
  Phiên thi hành PHẢI tự xác minh: fetch nhánh lease rồi `git show` chính tệp này, đối chiếu
  `spec_hash`. Đừng nhận bảng giá trị từ điều phối.

cap_nhat_truoc_khi_xin_review: >-
  DỜI NEO sang exact head `2b82a9bc` TRƯỚC khi mở PR. `da_dung` 0 sang 57 (trần 80), đo
  `git diff --numstat c9a2e9c2 -- .github/workflows/ci.yml` ⇒ `57 1`, đúng một tệp.

  PHÁT HIỆN QUYẾT ĐỊNH CỦA PHIÊN THI HÀNH, ghi lại vì nó sửa chính đặc tả này:
  làm ĐÚNG NGUYÊN VĂN `PROTOCOL:711-715` cho ra một phép kiểm **KHÔNG THỂ ĐỎ**. Manifest tạm
  sinh TỪ CHÍNH cây nên nó hấp thụ luôn tệp thừa. Đo trên `c9a2e9c2`, cây thêm đúng 1 tệp:
  manifest committed ⇒ `rc=2` nêu tên; manifest tạm ⇒ `rc=0`, `extra_files` RỖNG,
  `file_count` 180 sang 181.
  Nên lane worker KHÔNG dừng ở `release-verify` mà thêm lớp thứ hai: mọi tệp trong manifest tạm
  PHẢI được git theo dõi. Đột biến gỡ chốt ấy ⇒ ca tệp-thừa chuyển `rc=0`, mutant SỐNG ⇒ chốt
  đúng là thứ cấp răng.
  Đặc tả §2 chỉ nói "dùng manifest tạm"; nếu thi hành theo chữ mà không đo thì packet đã land
  một cổng không thể đỏ — đúng lớp lỗi cả kho đang chống.

  THU HẸP CÓ CHỦ ĐÍCH, khai chứ không giấu: ở lane worker lớp "file thừa" hẹp lại còn ca
  UNTRACKED; tệp PR cố ý thêm và ĐÃ commit thì lane worker XANH. Ca ấy chuyển hẳn cho lane land,
  nơi manifest committed vẫn bắt (đo `rc=2`, `extra_files`).

  `workflow_dispatch` xếp theo `github.ref` chứ không theo `github.event_name`: dispatch trên
  master ⇒ lane land, dispatch trên nhánh làm việc ⇒ lane worker. Lý do: thứ quyết định mức
  nghiêm là REF ĐANG ĐƯỢC GÁC, không phải cách bấm nút — và biểu thức ấy đã dùng nguyên văn ở
  `concurrency` và `matrix.os`, nên KHÔNG mở bề mặt điều kiện mới.

  `actionlint` — NỀN KHÔNG TÁI HIỆN ĐƯỢC, khai thẳng: `ci.yml` `rc=0` ở CẢ hai vế, delta 0.
  Nhưng nền `rc=1` cộng `SC1003:info` ghi trong `CLAUDE.md` KHÔNG tái hiện: trên host Windows
  này shellcheck-integration TREO ở `ops-don-ref.yml` (`rc=124`) ở CẢ hai vế. Cô lập bằng A/B
  trên `-shellcheck=`: tắt ⇒ rc=0 tức thì, bật ⇒ timeout. Đó là `KHÔNG ĐO ĐƯỢC` của NỀN, không
  phải hồi quy của packet — và là một con số trong `CLAUDE.md` đã hết hạn theo điều kiện đo.

  CHƯA ĐO ĐƯỢC, phiên thi hành tự khai: `doc_pointers` (312) và an-toàn-đường-dẫn trên đường
  manifest tạm CÓ MẶT trong output nhưng CHƯA đột biến để chứng minh có răng — chỉ `skill_links`
  đã đo. Chú thích trong `ci.yml` nói "vẫn gác" cho cả ba; hai mục kia là lời khai rộng hơn phép
  đo, cần lượt review soi.

