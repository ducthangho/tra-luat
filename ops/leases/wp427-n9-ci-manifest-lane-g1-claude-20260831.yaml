canh_bao_cho_nguoi_thi_hanh: >-
  (1) ĐỪNG chỉ tắt bước `--strict` ở lane PR. Nó đang bảo vệ "file THỪA trong cây mà manifest
  không có ⇒ ĐỎ". Phải dựng phép kiểm thay thế bằng manifest TẠM ngoài repo (`PROTOCOL:711-715`)
  và ĐO rằng nó vẫn bắt được ca ấy.
  (2) `actionlint` BẮT BUỘC, và thiếu công cụ thì ĐỎ. Sáu lượt cross-review từng cùng kết luận
  "YAML ok" cho một tệp mà GitHub TỪ CHỐI — vì cả sáu chỉ kiểm bằng PyYAML.
  (3) Dấu hiệu GitHub từ chối workflow KHÔNG phải job đỏ: đó là một run mang tên ĐƯỜNG DẪN TỆP,
  0 job, `conclusion: failure`. `get_job_logs` trả `total_jobs: 0` nên tìm log sẽ không thấy gì.
  (4) ĐỪNG viết cú pháp biểu thức Actions trong CHÚ THÍCH của thân `run` — một cặp rỗng trong
  comment làm cả tệp không hợp lệ.
  (5) Nền `actionlint` ĐỎ SẴN (`rc=1`, `ops-don-ref.yml:106 SC1003:info` khi có `shellcheck`).
  Đo nền trước khi nghi bản vá của mình, và ghi rõ `shellcheck` có mặt hay không.
  (6) Workflow có `paths:` đã từng KHÔNG chạy ở lần đẩy tạo nhánh MỚI — nguyên nhân chưa ai
  biết. Sau mỗi lần đẩy, ĐO là workflow đã chạy (`list_workflow_runs` lọc theo nhánh), đừng suy
  từ `git push` thành công.
  (7) `core.abbrev=7` ghim trong mọi clone/sandbox. KHÔNG push thẳng master.
