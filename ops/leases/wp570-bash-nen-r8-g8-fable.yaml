      trong khi thuoc tinh la CO CHE", cung khong song qua NAM lan mac bay "dot bien tep khong
      can duoc ma da nap trong tien trinh". Nhung bai hoc ay chi song o dac ta, o docstring
      tung ca, va o CONG DO DUOC (44 ca, 52 dot bien, ban kinh 1/44, luat t39/N22).
      Cho thu ba la cho duy nhat khong phu thuoc tri nho ai — do la ly do viec doi executor
      giua packet chiu duoc. Nhung `t39` chi bat hinh dang "chot tren PHAN QUYET"; lan thu BAY
      lot qua no va chi bi BAN KINH DOT BIEN bat. Phan con lai van dua vao nguoi doc: NO CO TEN.'
