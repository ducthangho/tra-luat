reason: 'Owner rerouted the wp685 executor to Claude (answer in the dispatcher Claude Code session on 2026-10-09, quoted in owner_decision_text). Lease wp685-r23-g4b-codex-20261007 (Codex Desktop on the owner''s Windows machine) expired 2026-10-08T23:00:00Z with attempts_used 0 and no agent branch (dispatcher report). Protocol 3.1.1/3.2: a change of executor or environment requires a new Packet revision and generation, so spec r25 (superseding the unfrozen draft r24) and Mission r8 are proposed.'
proposed_changes:
- wp685 executor codex (GPT-6 Astra, codex_desktop, machine/local, local Windows) -> claude (claude-opus-5-5, model family claude/anthropic, execution_surface claude_code, transport machine/local); environment local -> cloud (Linux container of the executor Claude Code cloud session). The executor is the dispatcher session itself, as the owner's answer Claude (tôi) names it; the lease records recorder_is_executor true. Mission r8 no longer pins effort (r7 effort medium was the codex setting).
- wp685 reviewer stays codex in an independent read-only session on the exact candidate SHA; because executor and reviewer are now different model families, the review assurance target becomes cross_approved, plus human_audited on the same SHA because review_class is sensitive. Mission acceptance criterion 3 is reworded accordingly (it named a same-provider Codex reviewer).
- Spec r25 ops/specs/launcher-con-song-esrch-r25.md (sha256 bc3d6f40ebcc74aed20d2f85ab3f40318bc2e351a4cfa44d289014dfed441b31, commit 0aba473d24b534eea47f47e44fae842202c67dfb, blob c479b6f79404e4159a86aadcd38b42c28bf7b215) supersedes r23 (96387f833a0f102742b5f9c86948f2b3f0597d3032dd1817ce732557ae2af939). r25 = draft r24 (ops/specs/launcher-con-song-esrch-r24.md, sha256 be3b416b80681f17a82fa57219c2dac3b0cc52e363890f6bf18ae2a825376fab, commit 0c91271b27f44f582fc378a4a0def347c02e2fb8, blob 142031564ad7ad7fe8db7358704c4210367e012a; never frozen, no Mission event or lease anchors it) + HINT.patch (sha256 0f90fc6f9db031c2be9d255eae7d4312a94355c5f5294ac851758af08b021eb4) of the advisory cross-review round 1 on r24 (VERDICT sha256 67a89d25c6901b59e38fc9cc83944e3a936f680b3b3acb4ec7bcfa517ec70224, changes_requested, 1 P1 / 1 P2 / 3 P3). Against r23, r25 changes the executor/environment/reviewer cells, the review-assurance clause of closure required_checks (same_provider_approved, written for a codex executor, becomes cross_approved) and the sentences that name the current revision, and adds the facts listed in its tables of changes against r24 and r23 (re-measure rule for evidence left on the old executor machine; write_set_hash of g4 and g4b). Objective, acceptance B1-B8, closure land_obligations, the two-path write set, review class sensitive and base ab457c651eb4428705f0492163080b661c858b72 are unchanged.
- 'Packet revision 25, generation 5 (protocol 3.1.1: executor/environment change => new revision and generation).'
- 'PROPOSAL, needs explicit owner confirmation: attempt_limit null and same_failure_limit 10 for wp685 generation 5, both counted from 0 at generation 5 (same as the g4 decisions MCR-686-06/MCR-686-07, which were scoped to generation 4 only); history of generations 2-4 kept as data. envelope (incl. same_failure_limit 2, max_attempts_per_packet 3) unchanged for every other packet. The g5 lease also carries review_rounds_limit 10 (inherited from g1-g4b, no recorded basis), above the protocol 8 cap of two Codex review rounds per PR; it needs the same explicit confirmation, otherwise the lease uses 2.'
- 'No tombstone: lease g4b expired 2026-10-08T23:00:00Z before this request, so write-set exclusion already released it; writing da_bi_thay_the into a dead lease only adds an expired file to the publish scan (CLAUDE.md lesson 20-09-2026). The new lease declares thay_the_cho: [] and names g4b in a generation_truoc field.'
- 'Install Mission revision 8 with a new exact plan hash only after the owner''s durable #686 decision citing the sha256 of this file and the r8 plan hash; grant the generation-5 lease only after event readback, holder scan on both paths (all origin refs, server-vs-cache ref set check) and base check. Before the grant, spec r25 section 11 item 5 needs a named evidence ref or artifact channel with push authority.'
