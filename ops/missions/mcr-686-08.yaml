reason: 'Owner rerouted the wp685 executor to Claude (answer in the dispatcher Claude Code session on 2026-10-09, quoted in owner_decision_text). Lease wp685-r23-g4b-codex-20261007 (Codex Desktop on the owner''s Windows machine) expired 2026-10-08T23:00:00Z with attempts_used 0 and no agent branch (dispatcher report). Protocol 3.1.1/3.2: a change of executor or environment requires a new Packet revision and generation, so spec r28 (superseding the unfrozen drafts r24, r25, r26 and r27) and Mission r8 are proposed.'
proposed_changes:
- wp685 executor codex (GPT-6 Astra, codex_desktop, machine/local, local Windows) -> claude (claude-opus-5-5, model family claude/anthropic, execution_surface claude_code, transport machine/local); environment local -> cloud (Linux container of the executor Claude Code cloud session). The executor is the dispatcher session itself, as the owner's answer Claude (tôi) names it; the lease records recorder_is_executor true. Mission r8 no longer pins effort (r7 effort medium was the codex setting).
- wp685 reviewer stays codex in an independent read-only session on the exact candidate SHA; because executor and reviewer are now different model families, the review assurance target becomes cross_approved, plus human_audited on the same SHA because review_class is sensitive. Mission acceptance criterion 3 is reworded accordingly (it named a same-provider Codex reviewer).
- Spec r28 ops/specs/launcher-con-song-esrch-r28.md (sha256 8007edf4e00aaefc298bf299bf19be9a71c54e73ff6a1610eb676a806773e156, commit 4a35f633e1b3f05be12eecf74ab9a8a17ef82c69, blob fa07ca1bc3707bc273bf25349ffa6f3ca6ad6160) supersedes r23 (96387f833a0f102742b5f9c86948f2b3f0597d3032dd1817ce732557ae2af939). Four drafts precede it; none was frozen and no Mission event or lease anchors any of them: r24 (ops/specs/launcher-con-song-esrch-r24.md, sha256 be3b416b80681f17a82fa57219c2dac3b0cc52e363890f6bf18ae2a825376fab, commit 0c91271b27f44f582fc378a4a0def347c02e2fb8, blob 142031564ad7ad7fe8db7358704c4210367e012a) and r25 (ops/specs/launcher-con-song-esrch-r25.md, sha256 bc3d6f40ebcc74aed20d2f85ab3f40318bc2e351a4cfa44d289014dfed441b31, commit 0aba473d24b534eea47f47e44fae842202c67dfb, blob c479b6f79404e4159a86aadcd38b42c28bf7b215) and r26 (ops/specs/launcher-con-song-esrch-r26.md, sha256 2315200036c57ba4e35699a11545b20c637a509c5a5690058c1cf204eebdfd73, commit 265a1970481d7763c62b810bbfa371ed37c3cb58, blob 7589c61f136367ee0117fb65f31d32c22d9e1082) and r27 (ops/specs/launcher-con-song-esrch-r27.md, sha256 4250e0548b937c943eb4ebe73d097b7071422b9c51711b1525201d9dd1e0f998, commit 0f17f288902e432dbd3100865c4918a1c17038d6, blob 3cf7ddb82c3da83d49b7e744f61fc842bd85ac25). r25 = draft r24 + HINT.patch (sha256 0f90fc6f9db031c2be9d255eae7d4312a94355c5f5294ac851758af08b021eb4) of the advisory cross-review round 1 on r24 (VERDICT sha256 67a89d25c6901b59e38fc9cc83944e3a936f680b3b3acb4ec7bcfa517ec70224, changes_requested, 1 P1 / 1 P2 / 3 P3), then the hand edits listed in the r25 table of changes against r24 (column HINT lệch phép đo and its last row); HINT's two hunks on r24's own history blocks are not applied, so r25 is not byte-equal to r24 + HINT.patch. r26 revises r25 after the advisory cross-review round 2 on r25 (VERDICT sha256 bd84b8a1b724ce36078acf8344b13d158e5a89099eecedf31fb61eb502f66641, changes_requested, 0 P1 / 0 P2 / 2 P3; HINT.patch sha256 683f8ad682a36e033acdddaae1adb410d7e3