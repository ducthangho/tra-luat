  - id: PLAT-X8-reviewer-luon-sensitive-cho-toi-khi-co-trang-thai-BEN
    noi_dung: >-
      Q1 đã THU HỒI: lease reviewer ra `sensitive` VÔ ĐIỀU KIỆN, cổng không tra lease nào. Đo
