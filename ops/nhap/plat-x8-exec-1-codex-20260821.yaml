    noi_dung: >-
      §8:567 đòi BA đầu vào — `risk`, effective write set, `diff thật`. Cổng này chỉ có một rưỡi.
      Đo: `grep '^risk:' ops/leases/` = **0/49 tệp**, tức trường ấy KHÔNG TỒN TẠI trong dữ liệu;
