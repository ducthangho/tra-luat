P1_MOI_chan_land:
  ten: finding-02-if-false-vinh-vien-vo-hieu-chieu-iii
  noi_dung: >-
    Phep trich `run` KHONG doc `step.get("if")` lan `job.get("if")`. Mot step — hoac ca job — mang
    `if: false` van co `run` la chuoi hop le, nen van khop, trong khi GitHub KHONG BAO GIO chay no.
    Do la chieu (iii) — chinh chieu lease mo ta la "bat duoc dung cai lo da sinh ra packet".
  do_duoc: >-
    step-if-false LOT · job-if-false LOT · step-if-always-false-expr LOT · baseline-normal-step
    KHONG bao loi (ca doi chung dung). Do bang script rieng tren module that o dung sha, khoi phuc
    trang thai module ngay sau — khong de lai trang thai meo.
  vi_sao_P1_du_executor_TU_KHAI: >-
    `if: false` / `if: 'false'` / `if: ${{ false }}` la gia tri YAML DOC TINH DUOC, re, va QUYET
    DINH DUOC dut khoat — khac han cac bien the o finding-03. Ban va da cam san `step`/`job` dict
    trong tay, chi thieu mot dong kiem. De ho dung phan RE NHAT cua lo ma packet ton tai de dong,
    sau khi da thu hep phan kho, nghia la duong lach chi co tu "sua bat ky dong nao trong workflow"
    xuong "them dung MOT dong `if: false`" — van nam gon trong write set nay.
    Reviewer noi thang: TU KHAI lam review KHONG BAT NGO khi tim ra, nhung khong lam giam muc
    nghiem trong cua mot lo con song. Xep hang la viec cua reviewer, khong phai cho executor tu
    mien tru. Phien dieu phoi CO Y khong xep hang truoc va hoi reviewer ma KHONG kem dap an.
  cung_ho_voi_P1_luot_1: >-
    Ca hai la "kiem SU CO MAT tinh cua van ban `run:` ma khong kiem KHA NANG thi hanh" — dung benh
    "dem su CO MAT thay vi KHA NANG" kho da ghi nhan nhieu lan.
