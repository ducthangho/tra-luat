LOI_CUA_PHIEN_DIEU_PHOI_KHI_GHI_BIEN_NHAN_NAY:
  loi_gi: >-
    Heredoc KHÔNG trích dẫn (`<<EOF` thay vì `<<'EOF'`) nên vỏ shell THỰC THI ba cụm trong dấu
    huyền chưa được thoát và thay chúng bằng CHUỖI RỖNG. Ba nhãn `chiều MỞ`, `chưa xếp được`,
    `cơ chế đã xác minh` biến mất khỏi mục `huong_va_reviewer_de_xuat` — đúng ba nhãn là NỘI DUNG
    của hướng vá.
  vi_sao_suyt_lot: >-
    `yaml.safe_load` vẫn ĐỌC ĐƯỢC tệp và in ra "YAML OK". Cổng cú pháp xanh trong khi nội dung đã
    hỏng — đúng hình dạng "cổng xanh không phải bằng chứng" mà cả hai packet trong phiên này sinh
    ra để chặn. Thứ bắt được là ba dòng `command not found` trên stderr, không phải bộ kiểm.
  lan_thu_hai: >-
    Đây là LẦN THỨ HAI trong phiên heredoc không trích dẫn làm hỏng một biên nhận YAML. Lần trước
    `yaml.safe_load` ném lỗi nên bắt được ngay; lần này nó KHÔNG ném, và nếu tôi chỉ nhìn dòng
    "YAML OK" thì bản ghi đã đi vào kho với ba chỗ trống.
  luat_rut_ra: >-
    Ghi YAML nhiều dấu huyền thì dùng `<<'EOF'` hoặc viết bằng Python. Và ĐỌC LẠI nội dung sau khi
    ghi, đừng chỉ kiểm cú pháp.
