    Đó là chốt làm đúng việc: vân tay bền nhất của kho trở thành **không đọc được**, và
    nếu neo lỏng hơn thì lượt đo đã chạy trên một cây không ai xác minh được. Chữa bằng
    `git fetch --unshallow origin` ⇒ đúng MỘT root commit, khớp neo.
- id: pwsh-mat-cung-dev-shm
  noi_dung: >-
    `/dev/shm` bị xoá giữa các phiên ⇒ mất `pwsh`. Tải lại 7.4.6 linux-x64; tarball giải
    nén ra `pwsh` **thiếu bit exec** đúng như bàn giao cảnh báo ⇒ `chmod +x`. Đòi BẰNG
    CHỨNG DƯƠNG trước khi đọc bất kỳ con số nào (`pwsh --version` **và** một biểu thức
    thật trả `42`), vì `rc=127` + đầu ra rỗng trông y hệt "chạy xong sạch".

