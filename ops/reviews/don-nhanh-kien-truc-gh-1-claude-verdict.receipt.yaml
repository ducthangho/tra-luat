verdict_usage_caveats:
- id: mcp-do-duoc-roi-mat
  noi_dung: >-
    Verdict này nói reviewer KHÔNG tái lập được phép đo trong lease (`11 PR qua MCP, đủ head
    và base`). **Người vá đã tự kiểm và reviewer ĐÚNG.** Chạy lại lúc 14:56 UTC bằng CÙNG
    token (vân tay `49933df4`, độ dài 93) và CÙNG đoạn mã ⇒ `isError: true`, `403 Resource
    not accessible by personal access token`. Phép đo gốc chạy ~14:44, tức nó **chết trong
    ~12 phút**, KHÔNG phải "vài giờ" như verdict ước. Vân tay token KHÔNG đổi ⇒ không phải
    token xoay vòng mà là trạng thái UỶ QUYỀN phía server đổi. **Đừng chạy lại lệnh MCP
    trong verdict rồi kết luận gì từ kết quả** — đường ấy đã trôi, và chính sự trôi ấy là
    một phần của kết luận `giu_nguyen`.

no_khai_bao_cua_reviewer:
- 'Chưa đo trực tiếp truncation `--limit 200` — `gh` bị proxy container chặn ngay cả sau khi cài.'
- 'Chưa đo B (`Invoke-RestMethod` từ PowerShell thật) — không có máy Windows; chỉ đo REST bằng `urllib`.'
- 'Chưa đo PowerShell 5.1 cho bất kỳ phương án nào — kế thừa nguyên trạng "chưa kiểm".'
- '`get_me` qua MCP trả 503 "No server is currently available" — CÓ header X-GitHub-* ⇒ trục trặc phía GitHub thật, KHÔNG phải proxy container. Khai riêng để không ai đọc nhầm thành lỗi phạm vi quyền.'

no_cua_nguoi_va:
- id: lease-mang-mot-phep-do-da-chet
  noi_dung: >-
    Người vá đưa `mcp_list_pull_requests: 11 PR` vào lease làm CĂN CỨ SỰ THẬT cho cả lượt.
    Căn cứ ấy bốc hơi trước khi reviewer kịp đọc. Bài học: một phép đo về TRẠNG THÁI DỊCH VỤ
    BÊN NGOÀI có hạn dùng, và đưa nó vào lease như dữ kiện tĩnh là sai loại. Lease nên ghi
    kèm thời điểm đo và nói rõ nó có thể trôi — hoặc bảo reviewer TỰ ĐO thay vì đưa số sẵn.

