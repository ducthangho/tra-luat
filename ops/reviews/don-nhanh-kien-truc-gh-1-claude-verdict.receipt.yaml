    đối xứng môi trường là lý do MCP có thể thắng ở container. Reviewer chỉ ra phạm vi quyền
    là thuộc tính của TOKEN, không phải của MÁY — nên bất đối xứng ấy không cứu được B/C.
  2_so_lop_giai_ma: >-
    MCP = 4 lớp (initialize → notifications/initialized 202 → tools/call → SSE `data:` →
    phong bì JSON-RPC → `content[0].text` chuỗi → parse JSON LẦN HAI). Người vá đếm 3, tức
    ĐẾM THIẾU. `gh pr list --json` = 1 lớp. ⇒ MCP DỜI chỗ hỏng, không ĐÓNG.
  3_isError_vang_mat_do_HAI_CHIEU: >-
    Người vá chỉ đo một chiều. Reviewer đo cả hai: lời gọi THÀNH CÔNG (`search_repositories`,
    `total_count:1`) trả `result` KHÔNG CÓ khoá `isError`; lời gọi LỖI thì `isError: true`
    xuất hiện. ⇒ `if ($r.isError)` đọc "vắng" thành "không lỗi" — phương án C TÁI TẠO NGUYÊN
    VẸN lớp lỗi của lượt 1 (`rc=0` nói dối) mà nó được đề xuất để chữa.
  4_ranh_gioi_credential: >-
    Hiện script KHÔNG cầm token nào (dựa `gh auth login`, lưu ngoài biến môi trường). B/C
    đòi PAT đúng scope trong môi trường một script XOÁ NHÁNH — và token tiện tay nhất ở đây
    KHÔNG đủ scope, nên đó không phải bước rẻ.

