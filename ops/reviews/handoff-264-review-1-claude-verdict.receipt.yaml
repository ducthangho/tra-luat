de_quy_ho_so: >-
  MỘT PR HỒ SƠ KHÔNG THỂ CHỨA HỒ SƠ REVIEW CỦA CHÍNH NÓ. Thêm verdict của #264 vào #264 sẽ đổi head,
  làm verdict vừa ghi không còn phủ nội dung, và đòi một lượt review nữa — lặp vô hạn. Đó là lý do
  hai biên nhận này nằm ở PR RIÊNG, ghi SAU khi #264 đã merge.
  Đệ quy KHÔNG tự dừng bằng cơ chế; nó dừng bằng QUYẾT ĐỊNH. Chuỗi này dừng ở đây theo chỉ thị chủ
  kho ("ghi verdict #264 vào PR follow-up"): PR hồ sơ NÀY không cần một PR hồ sơ nữa cho review của
  nó. Nếu ai muốn luật chung thay vì quyết định từng lần, đó là ADR chưa viết — nêu làm nợ dưới đây.

