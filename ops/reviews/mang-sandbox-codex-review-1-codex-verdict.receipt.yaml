ba_P1:
  ma-chan-gom-moi-loi-khong-phan-loai: >-
    Hợp đồng `1 = bị chặn` RỘNG HƠN phép đo. Mọi exception và mọi rc khác 0 của tiến trình con đều
    thành cùng một mã: URL sai cú pháp, `PATH` rỗng, kho không tồn tại, DNS/timeout/auth giả lập
    đều cho `1`. Và bộ test CHỦ ĐỘNG bắt lỗi bug rồi đòi nó mang nhãn "chặn" — tức phản chứng đang
    khoá đúng cái hành vi sai. Hướng vá: tách ít nhất `LOT` · `POLICY_DENIED` · `ENDPOINT_ERROR` ·
    `TIMEOUT` · `TOOL_ERROR` · `UNKNOWN`; lỗi không nhận dạng phải thành `KHÔNG_ĐO_ĐƯỢC`, không tự
    nâng thành "sandbox chặn".
  cong-dot-bien-tu-giam-van-xanh: >-
    Cổng đột biến KHÔNG có phản chứng cho CHÍNH NÓ. Reviewer xoá từng phần và cổng vẫn xanh:
    xoá bất kỳ entry mutant nào (m1..m5) ⇒ `đột biến 4`, `TỔNG: ĐẠT`, rc=0 · xoá chốt duy-nhất
    `goc.count(cu) != 1` ⇒ xanh · xoá fail-close nền-đỏ ⇒ xanh · xoá ghi nhận mutant sống ⇒ xanh ·
    xoá nhánh kết luận `xau` ⇒ xanh. Cộng ba tổ hợp hai-bước cho thấy chuỗi khai thác thật.
  bon-to-hop-chua-co-lenh-nguyen-van: >-
    Bảng bốn tổ hợp là BẰNG CHỨNG TRUNG TÂM để cô lập hai cờ, nhưng tài liệu chỉ có một template và
    shorthand, không có bốn lệnh chép-chạy. `DUONG_DAN_GOC` không có dòng gán. Vi phạm hợp đồng
    "tái lập nguyên văn" của chính packet.
  ghi_chu_cua_dieu_phoi: >-
    P1 thứ hai là ĐÚNG cùng lớp lỗi mà #319 vừa mất một lượt vì nó, và #334 đã có chốt duy-nhất —
    nhưng chốt ấy KHÔNG CÓ PHẢN CHỨNG. Bài học: thêm một chốt không bằng đo được chốt ấy còn sống.
    Đây là lần thứ BA trong phiên bắt được hình dạng "cơ chế mới thêm vào cổng mà không ai canh nó".

