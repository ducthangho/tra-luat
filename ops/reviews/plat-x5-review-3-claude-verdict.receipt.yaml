finding_1:
  muc: P3
  id: docstring-_cat_chu_thich_run_inline-overclaim-nhe-ve-ANSI-C-quoting
  KHONG_CHAN: true
  noi_dung: >-
    Docstring nói "theo dõi nháy đơn, nháy kép và dấu chéo ngược" mà không nêu: bộ theo dõi coi
    `$'…'` (ANSI-C quoting của bash) giống `'…'` thường, nên `\'` bên trong bị hiểu thành đóng
    nháy sớm. ĐÂY LÀ BUG TRACKING THẬT.
  vi_sao_KHONG_khai_thac_duoc: >-
    Vì lý do CẤU TRÚC chứ không phải may: hàm chỉ chạy trên plain scalar không quote, mà với plain
    scalar thì chính YAML đã cắt tại `#` đầu tiên có khoảng trắng trước — tiêu chí yếu hơn, nên
    điểm cắt YAML luôn ≤ điểm cắt heuristic. Reviewer kiểm đúng ca `$'…'`: hai điểm cắt TRÙNG nhau.
  duong_va_khong_cap_bach: 'nêu thêm giới hạn `$''…''` vào mục "Giới hạn có chủ ý", hoặc không đóng nháy đơn khi ký tự trước là `\` và scalar mở bằng `$''`.'
  da_va: false

