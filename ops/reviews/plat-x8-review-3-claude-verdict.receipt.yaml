  - id: bang-lop-noi-ngoai-8-572
    muc: P1
    trang_thai: DA_DONG
    tai_hien: true
    dong_boi: 28f32f7cfb393c759e73e8afbb566a54866fc4b4
    tom_tat: >-
      `_BANG_LOP` chứa 4 mục `systemic` KHÔNG bắt nguồn từ §8:572 (`docs/PROTOCOL_DA_PHIEN.md`,
      `docs/adr/`, `ops/lease_publish_test.py`, `ops/chay_lease_publish_test.sh`). Đặc tả cấm đúng
      việc này ở ba chỗ nguyên văn (§8 "chỉ được seed bằng thứ §8:572 nói NGUYÊN VĂN"; §8 "14/14
      đường dẫn đều ra sensitive"; §4.2 "không nới bảng… đó là packet khác"). Hậu quả thật: một lease
      khai `write_set: ['ops/lease_publish_test.py']` một mình sẽ được cổng cho phép khai
      `effective_review_class: systemic`, tức bỏ qua yêu cầu `cross_approved`/`human_audited` của
      `sensitive` — và đường ấy nằm trong write_set của CHÍNH packet này.

tai_hien_boi_dieu_phoi: >-
  KHÔNG nhận lời khai. Phiên điều phối đo lại từ đầu, và kết quả RỘNG HƠN mô tả của reviewer:
  quét 165 ref (đã so HAI NGUỒN `ls-remote` vs `for-each-ref` trước — 0 nhánh mù), 120 blob lease
  phân biệt, 23 đường dẫn phân biệt trong `write_set` của mọi lease ⇒ trên head `86a55663` chỉ
  **20/23** ra `sensitive`; BA đường rơi xuống `systemic`, trong đó `ops/lease_publish_test.py` xuất
  hiện ở **27 lease**. Đặc tả khai 14/14. Sau vá: **23/23**.
  Đọc §8:572 và §575/§578 trực tiếp trên master để kiểm phần CHUẨN TẮC, không chỉ phần hành vi —
  và chỗ đó suýt làm phiên điều phối kết luận sai: §575 có chữ "protocol", §578 có chữ "test", nên
  "cả bốn phải sensitive" KHÔNG hiển nhiên từ §8 một mình. Thứ quyết định là quy tắc SEED của đặc
  tả (chỉ seed hạng mục sensitive, còn lại rơi vào mặc định fail-closed), không phải phép tự phân
  loại từng đường. Ghi ra vì bước này là chỗ dễ bác nhầm một finding đúng.

