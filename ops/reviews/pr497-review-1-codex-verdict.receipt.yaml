      remote.origin.url` ⇒ URL GitHub), THẤY nó lệch với `EVIDENCE.md`, và vì cấu hình THẬT là URL
      GitHub trong một sandbox không mạng nên `ls-remote origin` vô dụng ⇒ KHÔNG chạy nó.
      (Bản đầu của trường này viết "Reviewer đọc câu sai đó… nên KHÔNG chạy nó" — kể NGƯỢC nhân quả
      và gán cho reviewer một trạng thái tâm trí. KHÔNG ai bị lừa: reviewer bắt được nó. Lượt 2 chấm
      lỗi này, lượt 3 chấm lại vì nó còn sót ở đây và ở hàng README — đó là bằng chứng rằng "đã vá
