      của toàn bộ kết quả phải có. `all()` trên tập RỖNG là `True` — phiên đã đo:
      `all({}.values()) == True`. Nên một oracle chỉ trả tiêu chí ĐÍCH và **bỏ** tiêu chí kia cho
      `khac = {}` ⇒ `all(...)` đúng một cách rỗng ⇒ **9/9 GIẾT THẬT, rc=0**.
      Reviewer dựng đúng oracle ấy (`T2`) và nói thẳng: *"Không có quan sát không đích KHÔNG tương
      đương `DAT`"*. Hướng chữa họ nêu: so `set(khac)` **bằng đúng** tập tiêu chí trừ đích TRƯỚC khi
      `all` — họ đã thử trên bản sao: `missing-nontarget` `rc=1` / `0of9`, oracle thật vẫn `rc=0` / `9of9`.
      HÌNH DẠNG: đây là kênh tín dụng giả **THỨ BA** trong cùng một bộ đo. Lượt 3 đóng kênh 1 (bộ
      đọc vượt ranh giới mục), r5 đóng kênh 2 (`rc != 0`), và kênh 3 vẫn mở. Đúng nếp *"vá đúng chỗ
      được chỉ rồi bỏ sót đường tiếp theo"* — lần thứ BA ở packet này.
  - id: a17-hai-ban-sua-cua-toi-LA-phep-noi-tieu-chi
    toi_khai: >-
      Hai bản sửa bộ đo `A17'` (xếp theo KHỐI; thêm `vá lẻ`/`bảng phân loại` vào danh sách CHO PHÉP)
      là sửa ĐỘ PHỦ chứ không phải nới TIÊU CHÍ, và chốt *"ba phép làm ĐỎ phải VẪN ĐỎ"* chứng minh
      điều đó.
    do_lai: >-
      **BỊ BÁC, và chốt của tôi KHÔNG ĐỦ.** `A17'` cấm **cả dòng vô hại** ngoài ba nhóm, nên không
      cần payload phủ định mới chứng minh được nới. Hai phản chứng của reviewer:
      `W2` — cùng một câu mô tả vô hại: đứng **RIÊNG** ⇒ bị bắt (`False`); đặt **KỀ** một khối `A2'`
      ⇒ **lọt** (`True`), trong khi bản thân nó `xep=None`. Tức xếp theo KHỐI làm **một dòng nhận
      diện hợp thức hoá phần còn lại**.
      `W3` — câu mô tả vô hại có chữ `vá lẻ`: có hai từ mới thì `True`, bỏ hai từ mới thì `False`,
      dù nó **không** mô tả nghĩa vụ `BẢNG LỚP` nào.
      Và câu bác chốt của tôi, nguyên văn: *"Ba fixture cũ vẫn đỏ chỉ giữ **ba điểm kiểm**, không
      giữ **tập chấp nhận**"*. Đó là chỗ tôi sai: tôi tưởng "ba phép làm ĐỎ vẫn ĐỎ" đủ để chứng minh
