hinh_dang_lap_lai_va_toi_dang_dem_no: >-
  ĐẾM HÌNH DẠNG, KHÔNG CHỈ ĐẾM LỖI — doctrine của kho đòi vậy, nên đếm ra đây:
  r6 rút bằng BẢNG KHAI ⇒ prose vẫn vận hành. r7 đóng BỐN ĐƯỜNG + viết lại DANH SÁCH ⇒ prose ngoài
  danh sách vẫn vận hành. Hai lượt ấy CÙNG MỘT HÌNH DẠNG: vá đúng chỗ được chỉ, bỏ sót chỗ không ai
  chỉ. r8 ĐỔI HÌNH DẠNG (`M17`, danh sách CHO PHÉP) và **đổi ấy có tác dụng thật** — nội dung lớp
  đóng được. Nhưng cơ chế mới có ba khuyết tật của một bản đầu tiên.
  Nên đây KHÔNG phải "bốn lần cùng một hình dạng ⇒ hỏi có nên làm không". Đây là: hai lần cùng hình
  dạng, rồi đổi hình dạng, rồi gỡ lỗi của cơ chế mới. Tôi khai phân biệt này ra để KHÔNG dùng nó làm
  cái cớ đi tiếp — nếu lượt sau `M17` lại đẻ lỗi mới nữa thì hình dạng MỚI ấy đã lặp hai lần, và câu
  hỏi đúng lúc đó là **có nên có `M17` không**, chứ không phải vá `M17` lần ba.

