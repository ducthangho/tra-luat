      `bo-do-bang-chi-kiem-ten-khong-kiem-nghia`. Lượt 5 tôi tìm tên CÓ dấu phẩy trên trong khi văn
      bản viết KHÔNG dấu. Lượt 8 tôi tìm tên CÓ ngoặc ngược trong khi YAML viết TRẦN. Mỗi lần tôi
      tìm **CÁI DẠNG TÔI ĐOÁN**, không tìm **KHÁI NIỆM** — và mỗi lần bộ quét cho XANH đúng lúc nó
      phải ĐỎ. Reviewer tìm ra bằng ĐỌC, không bằng bộ quét, cả ba lần.
  (2) "ledger bản 3 phủ cửa sổ `06:16:03Z…21:42:48Z`" — SAI Ở ĐẦU CỬA SỔ. Tôi lấy `06:16:03Z` từ
