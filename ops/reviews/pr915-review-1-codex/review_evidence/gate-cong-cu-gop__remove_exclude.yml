        git config --global core.abbrev 7

        '
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        pattern: gate-nhanh-${{ matrix.os }}-*
        path: manh
        merge-multiple: true
    - name: "g\u1ED9p m\u1EA3nh nhanh_don_duoc (targeted_mutant_gate)"
      run: python ops/nhanh_don_duoc_test.py --gop-dich manh
