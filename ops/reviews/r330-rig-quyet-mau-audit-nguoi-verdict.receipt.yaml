    `cross_approved` — và vì đường kia ĐO ĐƯỢC là bị chặn. Packet khác phải tự chứng minh lại.
- id: author-association-khong-phan-biet-duoc
  noi_dung: >-
    ĐỪNG dùng `author_association` làm bằng chứng "người đã ký" ở bất kỳ biên nhận nào. Nợ #566.
