    `approve` này KHÔNG khai r330 đã chữa trên MỌI cấu hình Windows. Nó khai: chữa được, đo hai
    lượt độc lập, trên MỘT máy Windows 11 + WSL, với đối chứng âm ĐẠT ở cả hai lượt.
- id: no-r379-va-r378-van-mo
  noi_dung: >-
    KHÔNG đóng hai chỗ: (1) nguyên nhân `SyntaxError` của r379 vẫn CHƯA BIẾT và 2/2 xanh không
    phải chứng minh; (2) `r378` đỏ vì thiếu quyền symlink trên máy chủ kho, chưa ai mở nợ. Packet
    kế tiếp chạm `scripts/tl_selftest.py` phải biết cả hai.
- id: khe-protected-evidence-ref-van-mo
  noi_dung: >-
    Biên nhận này phải neo `canonical_ancestry` cho ĐO ĐƯỢC trong khi thứ có thẩm quyền là
    comment — đúng khe mà #566 sinh ra để vá, và #566 CHƯA land. Lần thứ HAI một biên nhận
    human_audited phải đi vòng như vậy.

