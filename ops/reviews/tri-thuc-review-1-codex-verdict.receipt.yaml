    văn bản mà nội dung là *"reviewer đã nói X"*, với chính họ là người nói X. Người giữ kho quyết
    phương án này in-session 23-08-2026.
- id: BAY-DEM-git-grep-c-dem-DONG-khong-dem-LAN-XUAT-HIEN
  noi_dung: >-
    Ghi ra vì phiên sau sẽ đếm lại đúng con số này. `git grep -c <mẫu> <ref>` đếm **số DÒNG có
    khớp trên mỗi tệp**, KHÔNG đếm **số lần xuất hiện**. Trên `5a96c1a` nó cho **20**, còn
    `git grep -o … | wc -l` cho **22** — và 22 mới là con số reviewer nêu. Dừng ở `-c` thì đã báo
    một chênh lệch KHÔNG CÓ THẬT và nghi oan bản vá. Cùng họ với *"cổng xanh nhờ `rc=0`"*: một
    lệnh trả số không có nghĩa nó trả **số mình đang hỏi**.
