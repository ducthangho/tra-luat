  (2) Ban dau cua chinh muc tren khai "khop tung byte sau khi chuan hoa xuong dong" — SAI mot byte,
      vi phep so chay `difflib` SAU KHI `.rstrip("\n")` CA HAI VE, tuc xoa dung thu dang can do.
