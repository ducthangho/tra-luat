ban_chieu_KHONG_byte_khop_voi_comment: >-
  Tap ky tu phi-ASCII giong het (43/43), va noi dung khop tung byte — NHUNG CHI SAU HAI phep chuan
  hoa, va phai ke ca hai chu khong chi mot. Do o muc BYTE:
