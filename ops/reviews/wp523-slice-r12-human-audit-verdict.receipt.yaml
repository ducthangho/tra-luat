    ban DA GUI          : 1061 byte · CRLF 0   · LF x19  · KET THUC bang '...20260921' + LF
    DA DEN sau CRLF->LF : 1060 byte
  1060 KHAC 1061. Lech dau tien o offset 1060, tuc dung cho het phan chung: mot dau xuong dong
  CUOI da bi cat o dau do tren duong di. LOP NAO CAT THI **KHONG DO DUOC**. Ban truoc cua muc
  nay khai "GITHUB CAT" — mot loi khai RONG HON phep do, codex bat (P2 tren #597, dong 188).
  Ly do no khong dung duoc: chu kho DAN TAY van ban nay, nen clipboard, trinh duyet, hay chinh
  o nhap deu co the cat dau ay TRUOC khi GitHub nhan. Ba con so va ba bam duoi day KHONG phan
  biet duoc cac kha nang do — ap phep cat o BAT KY lop nao trong so do deu tai hien DUNG bo so
  nay, nen chung khong co kha nang phan dinh. Muon co ten thu pham thi phai co THAN YEU CAU THO,
  hoac mot duong ghi doc lap dang bang may (vd. dang bang API roi doc nguoc byte); lan nay KHONG
  co ca hai. Nen cau dung la "khop tung byte sau khi doi CRLF sang LF VA sau khi tinh mot LF cuoi
  bi cat o mot lop CHUA XAC DINH" — khong phai "khop tung byte sau khi chuan hoa xuong dong",
  cung khong phai "GitHub cat". Cung ho bai hoc "phai biet minh dang dung o LOP NAO", va lan nay
  cai sai la GAN TEN cho mot lop chua do duoc.
  Bam cua CA BA than, de lan sau khong phai doan:
    DA DEN (nguyen ban, CRLF) f9b716734f8d6afb2e9fbebef9fbd10a4a101b40b28abef6130c3925e4df6e20
    DA DEN (da doi sang LF)   0e51b2f271f766bd7431228d827c27e3490a03e91ca231c62f90a7a3ac54b4df
    DA GUI                    da8111b9cfdda3ce6a7b07411cae619b4c06e55b09d43bdd7380d08ac67b01f0
  KHONG sua comment goc de "cho khop": comment la NGUON CO THAM QUYEN, sua no la THAY bang chung
  chu khong phai VA.
