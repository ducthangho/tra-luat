prior_findings:   # finding id -> class -> change -> locking test / dedicated mutant (each mutant measured as killed by its target case's own ChotB4)
  - id: B4-C01
    class: b4-trusted-classifier-materialization
    severity: P1
    change: >
      fc520d8: _b4_tinh_lai runs git on a TEMP empty GIT_DIR. The --root repo contributes only objects, through
      alternates. The commit also sets a temp GIT_CONFIG_GLOBAL and core.symlinks=false. Together these remove the
      caller's local/global config (smudge filters), replace refs, grafts and info/attributes, and stop symlink
      escapes. b1c9e82: core.attributesFile now points at an absent file in the temp dir, which closes the global
      attributes file ($HOME/.config/git/attributes). Before this fix, measured on fc520d8: the HOME attribute
      `eol=crlf` changed a byte-sensitive classifier from khong_giam to duong_nhanh, and `working-tree-encoding`
      produced la. After the fix, every HOME-attribute probe returns khong_giam.
    tests: [cong_b4_git_smudge_cuc_bo, cong_b4_git_smudge_toan_cuc, cong_b4_git_thay_the, cong_b4_git_cau_hinh_la_van_nhanh (healthy), cong_b4_lien_tep, cong_b4_lien_thu_muc, cong_b4_git_thuoc_tinh_toan_cuc (new), cong_b4_git_thuoc_tinh_trong_cay (healthy control, new: in-tree M attributes still honoured)]
    mutants: [b4_git_dir_cua_kho, b4_doc_cau_hinh_toan_cuc, b4_lien_trong_cay_tam, b4_doc_thuoc_tinh_toan_cuc (new), b4_object_vao_kho]
    residual_not_closed: >
      Two gaps remain, measured or stated and left for the reviewer and coordinator. (1) Object-store integrity:
      if a loose object under the exact classifier blob OID in the caller's --root store is overwritten with other
      bytes, the result becomes duong_nhanh, because git does not re-hash objects on read. This was measured by an
      out-of-suite probe (rv1462/a2/probe_obj.py). Spec section 5 has the classifier read the objects of --root,
      so blocking this changes the contract and needs a scope decision. (2) The system gitconfig and system
      gitattributes are not isolated. They cannot be tested without root, so a guard would have no killable mutant.
      Both gaps are recorded in KET_QUA.md under "Chưa đo".
