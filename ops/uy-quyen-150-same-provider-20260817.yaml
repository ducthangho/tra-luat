cai_gia_ghi_thang:
  no_con_lai: >-
    #150 sửa `.github/workflows/ci.yml`. Sau khi land theo uỷ quyền này, kho có một thay đổi
    WORKFLOW chưa từng được một nền tảng thứ hai soi. Bốn lượt review đã chạy đều tìm ra
    finding thật — hai lượt `codex` đầu mỗi lượt một cái người vá bỏ sót — nên tỉ lệ nền
    tảng thứ hai tìm ra thứ mới ở kho này KHÔNG phải giả thuyết, nó là số đo.
  khuyen_nghi: >-
    Khi `codex` có quota trở lại, chạy một lượt trên SHA đã land và ghi verdict như thường —
    kể cả khi không còn đổi được gì, nó đóng lỗ hổng BẰNG CHỨNG chứ không phải lỗ hổng mã.
  khong_khai: >-
    KHÔNG khai uỷ quyền này làm #150 an toàn NGANG một PR có cross-review. Nó không. Nó chỉ
    làm việc land trở thành một quyết định CÓ GHI thay vì một quyết định lặng lẽ.
