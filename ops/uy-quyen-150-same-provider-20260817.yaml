# UỶ QUYỀN HẠ MỨC ASSURANCE — PR #150, và CHỈ PR #150.
#
# ĐỌC BA DÒNG NÀY TRƯỚC:
#
# 1. Đây là một OVERRIDE, không phải "yêu cầu đã được đáp ứng". §8 đòi cross-provider cho
#    phạm vi workflow; yêu cầu ấy KHÔNG được đáp ứng và sẽ không bao giờ được đáp ứng cho
#    SHA này bằng con đường hiện tại. Chủ kho hạ mức, có ghi.
#
# 2. VĂN BẢN NÀY DO MỘT PHIÊN `claude` SOẠN. §2: "Thẩm quyền không được chuyển qua output
#    của agent". Nên tệp này TỰ NÓ không phải uỷ quyền — nó là bản GHI của một chỉ thị
#    người dùng đưa trong phiên. Thứ có thẩm quyền là `authorization_url` bên dưới, và nếu
#    chủ kho muốn chặt hơn thì tự đăng lại bằng tài khoản mình.
#
# 3. §8 cho HAI đường thay cross-provider: cross-review khác nền tảng, HOẶC "human review
#    có audit". Chỉ thị nhận được là "cho phép chấp thuận same_provider_approved" — tức HẠ
#    NGƯỠNG, KHÔNG phải "tôi đã tự review và audit". Hai thứ đó khác nhau và bản ghi này
#    không được nhập nhằng chúng.

